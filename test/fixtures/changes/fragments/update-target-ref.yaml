type: added
scope: skf-update-skill
prs: [517]
issues: [511]
summary: |
  New `--target-ref <ref>` flag for a skill built from a remote repository: update it against a tag, branch, `HEAD` or full commit instead of the ref it recorded, for example the newer tag an audit checked out. When the update writes, the skill records that ref and the commit it read, and the audit report now suggests the flag after it checked out a newer ref.
