# The external tools SKF uses, with the oldest version SKF supports
# (minimum) and the versions SKF has run on (tested). This is the one list:
# the prerequisites table in docs/getting-started.md is generated from it,
# and the installer copies it to _bmad/skf/shared/ with the rest of
# src/shared/, so the CLI and the Python helpers can read it too.
#
# How the numbers are set:
# - `tested` lists versions SKF has actually run on, and `basis` names the
#   run: a CI pin, the CI runner, the install smoke test or a named release
#   run. An empty list means no run is recorded yet.
# - `minimum` starts at a tested version, the only version SKF has evidence
#   for. It starts lower only where the repository already sets a floor for
#   a stated reason (Node 22, Python 3.11, git 2.15), and `basis` says which.
# - A minimum comes down only after a run on an older version passes. It is
#   never guessed lower.
# - `minimum: null` means SKF has no floor it can check yet. A null minimum
#   never warns. Node and Python always have one, since --check compares
#   their copies with it.
# - A tier tool's minimum also decides its tier: skf-setup counts a tier tool
#   below its minimum as unavailable. So a first minimum for gh, qmd or ccc
#   waits for a recorded run, and stays at or below the versions package
#   managers ship, or their users drop out of Deep or Forge+. Other tools
#   below their minimum only warn.
# - Raising a minimum, or giving a tool its first one, is a breaking change:
#   the release check (tools/covered-surfaces.js) asks for a major release
#   and a breaking change fragment that names the tool. Lowering or removing
#   one is additive, and changing `tested` is neither.
#
# To change a version, edit this file and run
# `node tools/tool-requirements.js --write`, which regenerates the
# prerequisites table. `node tools/tool-requirements.js --check` (run in CI)
# also compares the copies elsewhere in the repository: the minimums in the
# README, docs/ and CONTRIBUTING.md, `engines.node` in package.json, the
# workflows' node-version and python-version, .nvmrc, the ast-grep-cli pin in
# package.json `test:python`, and the README Acknowledgements rows.
#
# Keys of each tool (keyed like skf-detect-tools.py's tool keys where it
# probes the tool):
#   name             the name the docs use
#   summary          what the tool is, in a few words (optional)
#   kind             runtime (SKF needs it at every tier), tier (a capability
#                    tier needs it) or optional (a workflow uses it when present)
#   tiers            the capability tiers that need it (none for optional)
#   workflows        the workflows that run it, as skf-<name> folder names
#                    without the prefix, or [all]
#   used_for         what SKF uses it for, as the prerequisites table says it
#   minimum          the oldest supported version as a string, or null
#   tested           the versions SKF has run on, as strings
#   basis            where minimum and tested come from
#   version_command  the command that prints the installed version
#   install_url      where to install it from
#   upgrade          how to upgrade it
#   acknowledged_as  its row in the README Acknowledgements table (required
#                    for tier and optional tools)

schema_version: 1
tools:
  node:
    name: Node.js
    kind: runtime
    tiers: [Quick, Forge, Forge+, Deep]
    workflows: [all]
    used_for: Installation, npx commands
    minimum: "22"
    tested: ["22", "24"]
    basis: The minimum is package.json engines.node, which the install smoke test runs on Linux, Windows and macOS. CI runs the version in .nvmrc.
    version_command: [node, --version]
    install_url: https://nodejs.org
    upgrade: Install the current LTS release from https://nodejs.org

  python:
    name: Python
    kind: runtime
    tiers: [Quick, Forge, Forge+, Deep]
    workflows: [all]
    used_for: Deterministic scoring, validation, and utility scripts. The minimum is what the helpers that read package manifests need (used by Quick Skill, Brief Skill, Analyze Source and Stack Skill)
    minimum: "3.11"
    tested: ["3.11", "3.12"]
    basis: The minimum is set by the helpers that import tomllib, new in Python 3.11. The quality workflow runs the Python tests on 3.11 and the release workflow on 3.12.
    version_command: [python3, --version]
    install_url: https://www.python.org
    upgrade: uv python install

  uv:
    name: uv
    summary: Python package runner
    kind: runtime
    tiers: [Quick, Forge, Forge+, Deep]
    workflows: [all]
    used_for: Running Python scripts with automatic dependency management
    minimum: null
    tested: ["0.12.15", "0.12.23"]
    basis: No minimum yet. CI installs the latest uv without pinning one, so each run takes that day's release. Quality & Validation run 37190025809 (2026-10-04, pull request 665, the tree of main b5150b08, the v3.0.0 release candidate) ran the Python tests through uv 0.12.23 on ubuntu-latest and windows-latest. Pull request 665's npm run quality on its branch head (issue 556 step 5b fix round 8, 2026-10-04, commit 4fecff22, the same tree) ran on uv 0.12.15 on Linux.
    version_command: [uv, --version]
    install_url: https://docs.astral.sh/uv/getting-started/installation/
    upgrade: uv self update

  git:
    name: git
    kind: runtime
    tiers: [Quick, Forge, Forge+, Deep]
    workflows: [analyze-source, audit-skill, brief-skill, create-skill, setup, test-skill, update-skill]
    used_for: Reading remote sources, and checking that a local source is still at the commit a skill was built from
    minimum: "2.15"
    tested: ["2.47.3", "2.55.0"]
    basis: The minimum is the one skf-source-tree.py states. No run is recorded on it. Quality & Validation run 37190025809 (2026-10-04, pull request 665, the tree of main b5150b08, the v3.0.0 release candidate) ran the Python tests, which drive real git, on the runners' git 2.55.0 (2.55.0.windows.5 on windows-latest). Pull request 665's npm run quality on its branch head, and its verification of skf-skill-inventory.py derive-name --probe-git against live remotes (issue 556 step 5b fix round 8, 2026-10-04, commit 4fecff22, the same tree), ran on git 2.47.3 on Linux.
    version_command: [git, --version]
    install_url: https://git-scm.com/downloads
    upgrade: Install the latest release from https://git-scm.com/downloads

  gh_cli:
    name: gh
    summary: GitHub CLI
    kind: tier
    tiers: [Deep]
    workflows: [analyze-source, audit-skill, brief-skill, campaign, create-skill, forger, quick-skill, test-skill]
    used_for: Required for the Deep tier, for Campaign, and for `forge-auto --pin`. Optional otherwise, where it makes reading GitHub sources easier
    minimum: null
    tested: ["2.102.0"]
    basis: No minimum yet. The tests stub gh. On 2026-10-04 the v3.0.0 pre-release tool check (recorded in the pull request that added these versions) ran every helper of main b5150b08 (the release candidate) that calls gh, the way the step files call them, against honojs/hono at v4.6.0 on gh 2.102.0, and each exited 0. They were skf-github-probe.py (repo, tags, tree), skf-validate-pins.py, skf-fetch-temporal.py, skf-detect-docs.py, campaign-provenance.py and skf-github-fetch.py, whose gh fallback ran with raw.githubusercontent.com blocked. Setup's skf-detect-tools.py also read the version.
    version_command: [gh, --version]
    install_url: https://cli.github.com
    upgrade: Install the latest release from https://cli.github.com
    acknowledged_as: GitHub CLI

  ast_grep:
    name: ast-grep
    summary: CLI tool for code structural search, lint, and rewriting
    kind: tier
    tiers: [Forge, Forge+, Deep]
    workflows: [analyze-source, audit-skill, brief-skill, create-skill, create-stack-skill, test-skill, update-skill]
    used_for: Forge, Forge+ and Deep tiers
    minimum: "0.45.3"
    tested: ["0.45.3"]
    basis: The create-skill recipes are verified by test/test-skf-create-skill-recipes.py on the ast-grep-cli version package.json test:python pins. No older version has run them.
    version_command: [ast-grep, --version]
    install_url: https://ast-grep.github.io
    upgrade: npm install -g @ast-grep/cli@latest
    acknowledged_as: ast-grep

  ccc:
    name: ccc
    summary: cocoindex-code semantic code search
    kind: tier
    tiers: [Forge+]
    workflows: [analyze-source, audit-skill, brief-skill, create-skill, create-stack-skill, update-skill]
    used_for: Forge+ tier, and the Deep tier when installed
    minimum: null
    tested: ["0.2.41"]
    basis: No minimum yet. The tests stub ccc. On 2026-10-04 the v3.0.0 pre-release tool check (recorded in the pull request that added these versions) ran the ccc commands of main b5150b08 (the release candidate) on cocoindex-code 0.2.41. skf-detect-tools.py found ccc with a healthy daemon (Forge+), and skf-merge-ccc-exclusions.py in setup and clone mode (ccc init, ccc index and ccc status) and the create-skill and audit-skill ccc search commands ran on scratch projects. Earlier full workflow runs on 0.2.41 were /skf-setup on SKF 2.2.0 (issue 490, 2026-09-23), the workspace-clone and audit-skill runs of pull request 509 (2026-09-27), and the /skf-setup re-runs of pull request 517 (2026-09-28). Both pull requests are unreleased v3 development.
    # ccc has no --version flag: the version is on the cocoindex-code line of
    # `uv tool list` when ccc was installed with uv.
    version_command: [uv, tool, list]
    install_url: https://github.com/cocoindex-io/cocoindex-code
    upgrade: uv tool upgrade cocoindex-code
    acknowledged_as: cocoindex-code

  qmd:
    name: qmd
    summary: local hybrid search engine for project files
    kind: tier
    tiers: [Deep]
    workflows: [audit-skill, brief-skill, create-skill, create-stack-skill, update-skill]
    used_for: Deep tier
    minimum: null
    tested: ["2.8.3"]
    basis: No minimum yet. The tests stub qmd. On 2026-10-04 the v3.0.0 pre-release tool check (recorded in the pull request that added these versions) ran the qmd commands of main b5150b08 (the release candidate) on qmd 2.8.3 with an isolated index. It ran create-skill's qmd collection remove and add (first run and re-run) and qmd search, audit-skill's qmd ls and qmd search, and setup's qmd status and collection classifier. qmd embed and the vector searches did not run, because no embedding model was cached and the check downloaded none. Before that, qmd 2.8.3 ran in the Deep-tier create-skill runs of 2026-09-28 in bmad-module-ultracode-goal, which built four skills with qmd collection add, embed and search, on SKF main 8ce1db01, an unreleased build between v2.2.0 and v3.0.0.
    version_command: [qmd, --version]
    install_url: https://github.com/tobi/qmd
    upgrade: bun install -g @tobilu/qmd@latest
    acknowledged_as: QMD

  tessl:
    name: tessl
    summary: Tessl CLI
    kind: optional
    tiers: []
    workflows: [create-skill, test-skill]
    used_for: Opt-in Tessl Review in Create Skill and Test Skill (`tessl_review_workspace` in preferences)
    minimum: null
    tested: ["0.111.0"]
    basis: No minimum yet, since no older tessl has run Tessl Review. The tests stub tessl. Pull request 517 (unreleased v3 development, merged 2026-09-28 as 2b3b5113) records live create-skill and test-skill runs on tessl 0.111.0 in which Tessl Review returned a score. On 2026-10-04 the v3.0.0 pre-release tool check (recorded in the pull request that added these versions) ran `skf status` from main b5150b08 (the release candidate), which read tessl 0.111.0, and ran skf-tessl-review.py collect against it signed out, which starts no review.
    version_command: [tessl, --version]
    install_url: https://tessl.io
    upgrade: tessl cli update
    acknowledged_as: tessl

  skill_check:
    name: skill-check
    summary: skill validator
    kind: optional
    tiers: []
    workflows: [create-skill, create-stack-skill, quick-skill, test-skill, update-skill]
    used_for: Spec validation, auto-fix and quality scoring. SKF runs it with npx, so it needs no install; without it, validation is done by hand
    minimum: null
    tested: ["1.2.0"]
    basis: SKF runs it through npx at whatever version npx resolves, so there is no floor it can check. In the v3.0.0 pre-release tool check (recorded in the pull request that added these versions) on 2026-10-04, on main b5150b08 (the release candidate), npx resolved skill-check 1.2.0, npm's latest since 2026-02-21, and test-skill's check (`npx skill-check check <skill-dir> --format json --no-security-scan`) on a copy of an oh-my-skills skill returned every field SKF reads. No other version has a recorded run.
    version_command: [skill-check, --version]
    install_url: https://github.com/thedaviddias/skill-check
    upgrade: npm install -g skill-check@latest
    acknowledged_as: skill-check
