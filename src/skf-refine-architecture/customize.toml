# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-refine-architecture.
# Team overrides:     {project-root}/_bmad/custom/skf-refine-architecture.toml
# Personal overrides: {project-root}/_bmad/custom/skf-refine-architecture.user.toml
# The overrides apply only when BMad core's customization resolver runs;
# otherwise the run warns `customization_resolver_unavailable` and uses the
# defaults in this file.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run during activation, after the config load and the headless
# check and before the pre-flight (the emitter, the configured folders, the
# write probe and the run folder). Overrides append. Use for org-wide checks
# (auth, network, compliance) that must precede architecture refinement work.

activation_steps_prepend = []

# Steps to run once the pre-flight has passed, before step 1 loads the
# inputs. Overrides append. Use for context loads or banner customization
# that should run once activation completes successfully.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (refinement standards, evidence-citation rules). Overrides append.
#
# Each entry is one of:
#   - a literal sentence, e.g. "Refinements must cite specific API signatures, never speculate."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/refine-policy.md" (globs supported; file
#     contents are loaded and treated as facts).
#   - an entry prefixed with `!`, which loads nothing and drops each earlier
#     entry it names.
#
# The default below loads every project-context.md under {project-root}.
# Overrides append, so they cannot delete it; to stop loading those files,
# set in {project-root}/_bmad/custom/skf-refine-architecture.toml:
#   persistent_facts = ["!file:{project-root}/**/project-context.md"]

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# --- Optional asset overrides ---
#
# House-style refinement rules. Empty = the bundled
# references/refinement-rules.md. A copy replaces that whole file, so start
# it from the bundled one: it can add, rename, drop or redefine the gap,
# issue and improvement types, name its own severity and value tiers, and
# decide which tier each [VS] verdict raises. It keeps the six tables the
# steps read by name, and each tier becomes a {<tier>_count} of the
# Refinement Summary, so step 1 halts on a copy that lacks a table or whose
# tiers break these rules: a tier name starts with a letter and holds only
# the letters A to Z, digits and spaces; no two tiers share a name (ignoring
# case), severity and value tiers included; none is named gap, issue,
# improvement, unverified or skill; and each VS Report Integration row
# raises a tier of Issue Severity, or no issue. Fixed whatever the copy
# says: what each step looks for, which skills and pairs are analyzed (the
# document scope), how findings are stored for recovery
# (references/finding-storage.md), and how the refined document is built,
# marked and checked (headings, callouts, RA markers, preservation).

refinement_rules_path = ""

# Override the destination directory for the refined architecture document
# and the files beside it: the earlier refined document a promotion renames,
# the result files (refine-architecture-result-<YYYYMMDD-HHmmss>.json and its
# -latest.json copy, the stable path pipelines read) and the record of
# findings a review dropped (.ra-dismissed-<project>.json). Empty = use
# {output_folder} from config.yaml. Useful for orgs that want
# refined-architecture artifacts to land under a curated docs tree.

output_folder_path = ""

# Optional post-completion hook: a shell command. When non-empty, step 6 runs
# it with `--result-path=<path>` (the per-run result JSON) once the refined
# architecture is promoted and both result files are written, before the run
# finishes. Use to index the refined doc, notify, or chain the next workflow.
# A failure shows as a warning line in step 6's report but never fails the run.

on_complete = ""
