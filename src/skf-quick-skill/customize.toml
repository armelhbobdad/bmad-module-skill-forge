# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-quick-skill.
# Team overrides:     {project-root}/_bmad/custom/skf-quick-skill.toml
# Personal overrides: {project-root}/_bmad/custom/skf-quick-skill.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run in SKILL.md On Activation step 3: after config.yaml is read,
# the run folder created and headless mode resolved, before the CLI flags are
# parsed and before any stage runs. Overrides append. Use for org-wide
# pre-flight checks (auth, network, compliance) that must precede any
# compilation work.

activation_steps_prepend = []

# Steps to run once activation completes (step 4 has parsed the CLI flags),
# before step 1 or a --batch run starts; a batch runs them once, not per
# target. Overrides append. Use for context loads or banner customization.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (house style, naming conventions, compilation guardrails).
# Overrides append.
#
# Each entry is one of:
#   - a literal sentence, e.g. "All skills must cite their upstream source."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/skill-style.md" (globs supported; file
#     contents are loaded and treated as facts).
#   - an entry prefixed with `!`, which loads nothing and drops each earlier
#     entry it names.
#
# The default below loads every project-context.md under {project-root}.
# Overrides append, so they cannot delete it; to stop loading those files,
# set in {project-root}/_bmad/custom/skf-quick-skill.toml:
#   persistent_facts = ["!file:{project-root}/**/project-context.md"]

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# --- Optional overrides. An empty string means the default named below. ---

# The template step 4 assembles SKILL.md and context-snippet.md from, a path
# from the skill root. Default: assets/skill-template.md. A house-style copy
# may reword it and add optional sections, and must keep:
#   - its `## SKILL.md Section Structure` and `## context-snippet.md Format`
#     headings, which step 4 reads;
#   - the `## Overview`, `## Description`, `## Key Exports` and
#     `## Usage Patterns` headings: step 5's output validator requires all
#     four, and the snippet's `#key-exports` and `#usage-patterns` anchors
#     point at the last two.
# metadata.json is read from a copy only when skf-render-quick-metadata.py
# is missing or fails twice, so leave the copy's `## metadata.json Format`
# section as bundled.

skill_template_path = "assets/skill-template.md"

# The folder a --batch run writes its summary to
# (quick-skill-batch-<timestamp>.json and quick-skill-batch-latest.json),
# ending in a slash. Default: {skills_output_folder}/_batch/.

batch_output_path = "{skills_output_folder}/_batch/"

# Optional post-completion hook: a shell command, not an instruction. Step 6
# runs it once the success envelope is printed and the result contract
# written, as:
#   <on_complete> --result-path=<skill package>/quick-skill-result-latest.json
# The result file sits in the skill package, which then holds SKILL.md,
# metadata.json and context-snippet.md (unless --skip-snippet); its
# `outputs` list those paths. It is skipped when the emitter wrote no result
# file, or not that -latest copy. Under --batch it runs once per target
# that finishes; a HARD HALT never runs it. A failure is logged and never
# fails the workflow, and the envelope, already printed, does not carry it.
# Use for git-add, skill-registry registration, or a notifier on the
# freshly compiled skill. Empty string = no hook (default).

on_complete = ""
