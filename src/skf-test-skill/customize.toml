# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-test-skill.
# Team overrides:     {project-root}/_bmad/custom/skf-test-skill.toml
# Personal overrides: {project-root}/_bmad/custom/skf-test-skill.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps SKILL.md On Activation step 3 runs right after the customization
# resolve: config.yaml is loaded and headless mode resolved by then, and no
# stage has run. Overrides append. Use for org-wide pre-flight checks (auth,
# network, compliance) that must precede any quality-test work.

activation_steps_prepend = []

# Steps to run after activation but before the first stage executes.
# Overrides append. Use for context loads or banner customization that
# should run once activation completes successfully.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (house style, severity policies, grading guardrails).
# Overrides append.
#
# Each entry is one of:
#   - a literal sentence, e.g. "Test failures of CRITICAL severity block release."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/test-policy.md" (globs supported; file
#     contents are loaded and treated as facts).
#   - an entry prefixed with `!`, which loads nothing and drops each earlier
#     entry it names.
#
# The default below loads every project-context.md under {project-root}
# and is kept on purpose: this workflow reads the project context (Drop
# Skill and Campaign, which do not need it, ship none). A `!` entry in an
# override drops it; to stop loading those files, set in
# {project-root}/_bmad/custom/skf-test-skill.toml:
#   [workflow]
#   persistent_facts = ["!file:{project-root}/**/project-context.md"]

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# --- Optional overrides. An empty string means the default named below. ---

# The test report template init copies to the run's report. Default:
# templates/test-report-template.md, a path from the skill root. Keep a
# house-style copy outside the skill folder, which every update overwrites,
# and name it as {project-root}/<path to the copy>. The copy may reword the
# prose, and must keep:
#   - the title line `# Test Report: {{skillName}}`, which init fills with
#     the skill name;
#   - the six `## ...` section headings, each with the `<!-- Populated by`
#     comment under it, since each stage replaces its own placeholder.
# Step 1 (init.md §6c) halts the run (`input-invalid`) on a copy that is
# missing or lacks one of them, once it has found the skill and before it
# creates the report, and the report check halts it (`report-anchor-missing`)
# on a report a stage left without them.

test_report_template_path = "templates/test-report-template.md"

# The scoring rules and the output formats are not overridable: scripts own
# the weights and the verdict rules, and the hard gate reads the Gap Severity
# table, so a house-style copy could change what blocks export.

# Pass threshold (percent) for every run given no `--threshold=<N>`. Empty
# (the default) leaves it to the pipeline's default (the per-pipeline table
# in init.md §1b), else 80. Precedence: CLI `--threshold=<N>` > this
# scalar > per-pipeline defaults > bundled 80. forge-auto and campaign pass
# `--threshold` themselves, so they keep their own. A value above 80 never
# turns a PASS into a FAIL: a run scoring 80 or more passes through the
# threshold fallback, and a run a cap forced to FAIL stays FAIL at any
# threshold.
default_threshold = ""

# Optional post-finalization hook: a shell command, not an instruction. When
# non-empty, the report step runs it from {project-root} as:
#   <on_complete> --result-path="<the per-run skf-test-skill-result-<YYYYMMDD-HHmmss>.json>"
# after the result JSON is finalized. A failure is shown to the user but
# never fails the workflow.
# Unlike BMad core, where on_complete is an instruction, this workflow hands
# the value to the shell, so an instruction such as "run Test Skill" fails.
# Empty = no-op.
on_complete = ""
