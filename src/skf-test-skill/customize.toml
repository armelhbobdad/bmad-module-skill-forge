# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-test-skill.
# Team overrides:     {project-root}/_bmad/custom/skf-test-skill.toml
# Personal overrides: {project-root}/_bmad/custom/skf-test-skill.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps SKILL.md On Activation step 3 runs right after the customization
# resolve: config.yaml is loaded and headless mode resolved by then, and no
# stage has run. Overrides append. Use for org-wide pre-flight checks (auth,
# network, compliance) that must precede any quality-test work.

activation_steps_prepend = []

# Steps to run after activation but before the first stage executes.
# Overrides append. Use for context loads or banner customization that
# should run once activation completes successfully.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (house style, severity policies, grading guardrails).
# Overrides append.
#
# Each entry is one of:
#   - a literal sentence, e.g. "Test failures of CRITICAL severity block release."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/test-policy.md" (globs supported; file
#     contents are loaded and treated as facts).
#   - an entry prefixed with `!`, which loads nothing and drops each earlier
#     entry it names.
#
# The default below loads every project-context.md under {project-root}.
# Overrides append, so they cannot delete it; to stop loading those files,
# set in {project-root}/_bmad/custom/skf-test-skill.toml:
#   persistent_facts = ["!file:{project-root}/**/project-context.md"]

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# --- Optional asset overrides ---
#
# Lift the canonical asset paths so orgs can substitute house-style copies
# without forking the skill. Empty string = use the bundled default.

test_report_template_path = ""

# The scoring rules and the output formats are not overridable: scripts own
# the weights and the verdict rules, and the hard gate reads the Gap Severity
# table, so a house-style copy could change what blocks export.

# Pass threshold (percent). Precedence: CLI `--threshold=<N>` > per-pipeline
# defaults (the init.md §1b lookup table, which outranks this scalar in
# forge-auto, forge, forge-quick and campaign runs) > this scalar > bundled
# fallback 80. Override here to change the org-wide default without forking
# the skill. A value above 80 is a target: a run scoring 80 or more still
# passes through the threshold fallback (with an evidence report), while a
# run a cap forced to FAIL stays FAIL at any threshold.
default_threshold = 80

# Optional post-finalization hook. When non-empty, the workflow invokes:
#   <on_complete> --result-path=<the per-run skf-test-skill-result-<YYYYMMDD-HHmmss>.json>
# after the result JSON is finalized. A failure is shown to the user but
# never fails the workflow. Empty = no-op.
on_complete = ""
