# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-export-skill.
# Team overrides:     _bmad/custom/skf-export-skill.toml (under {project-root})
# Personal overrides: _bmad/custom/skf-export-skill.user.toml (under {project-root})

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (uv probe, config load).
# Overrides append. Use for org-wide pre-flight checks (auth, network,
# compliance) that must precede any export work.

activation_steps_prepend = []

# Steps to run after activation but before the first stage executes.
# Overrides append. Use for context loads or banner customization that
# should run once activation completes successfully.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (publishing standards, distribution-instruction house style, snippet
# token-budget guardrails). Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All exported skills must include a CHANGELOG entry."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/export-policy.md" (globs supported; file
#     contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Optional post-export hook. When non-empty, invoked with
# `--result-path=<path>` after step 6 writes the per-run result JSON
# (before the terminal health-check step); a --dry-run writes none and
# never invokes it. Useful for downstream distribution, notification, or
# pipeline chaining. A failure shows as a warning line in the run's output
# and never fails the workflow. Empty = no-op (default).

on_complete = ""

# --- Optional asset override ---
#
# Lift the canonical snippet template path so orgs can substitute a
# house-style copy without forking the skill. Empty string = use the bundled
# default. The managed-section format and the IDE mapping have no override:
# drop-skill and rename-skill rebuild the same section through the shared
# helper, so a copy only export read would put them out of step.

snippet_format_path = ""
