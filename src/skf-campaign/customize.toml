# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for skf-campaign.
# Team overrides:     {project-root}/_bmad/custom/skf-campaign.toml
# Personal overrides: {project-root}/_bmad/custom/skf-campaign.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run right after the customization resolve (On Activation step 3).
# Config and preferences are already loaded by then, so a step here can read
# them but cannot run before them. Overrides append. Use for org-wide
# pre-flight checks (auth, network, compliance) that must precede any
# orchestration work.

activation_steps_prepend = []

# Steps to run once activation is complete, the CLI overrides included (so
# headless mode already reflects --brief and --manifest), just before the
# first stage executes. Overrides append. Use for context loads or banner
# customization.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole campaign
# (house style, naming conventions, quality guardrails). These are injected
# into every per-skill kickoff, so a campaign-wide fact reaches every skill.
# Overrides append.
#
# Each entry is one of:
#   - a literal sentence, e.g. "All skills must cite their upstream source."
#   - a file reference prefixed with `file:`, e.g.
#     "file:{project-root}/docs/skill-style.md" (globs supported; file
#     contents are loaded and treated as facts).
#   - an entry prefixed with `!`, which loads nothing and drops each earlier
#     entry it names.
#
# Ships empty: these facts are campaign-scoped. Brief, Create and Test
# Skill each load their own persistent_facts, every project-context.md
# under {project-root} by default, and the kickoff script inlines each file
# listed here in full into every Tier A kickoff, so listing those files
# here puts them in each skill's context twice. To add them anyway, set in
# {project-root}/_bmad/custom/skf-campaign.toml:
#   [workflow]
#   persistent_facts = ["file:{project-root}/**/project-context.md"]

persistent_facts = []

# --- Workspace path ---
#
# Where the campaign keeps its state, backup, brief, batch input, archive,
# and decision log. Default: {forge_data_folder}/_campaign (an empty string
# means the same). Override to relocate campaign artifacts (e.g. a shared
# volume) without editing every step file. Resolved once in On Activation
# as {campaignWorkspacePath}: a bare path resolves from the skill root,
# which every update overwrites, so name the folder as
# {project-root}/<folder> or an absolute path.

campaign_workspace_path = "{forge_data_folder}/_campaign"

# --- Quality gate ---
#
# Campaign-wide quality bar, enforced on every skill. Precedence, highest
# first: the directive's `## Quality Overrides` (while the campaign runs),
# then the `quality_gate` of the campaign-brief.yaml Setup reads (from
# --brief or its opening question, field by field), then these values.
# Override here to change the org-wide default without forking the skill.
# The hard gate is not a setting: a skill passes it only when its test-skill
# run finds no Critical or High gap (a campaign brief may name only
# `zero-critical-high`).
#
# quality_gate_soft_target: every Tier A test run gets it as `--threshold`,
# and a completed skill scoring at or above it exports as `pass`. A missing
# export is a Medium gap: it lowers the coverage score and no longer counts
# against the hard gate.
# quality_gate_soft_fallback: a completed skill scoring below the target but
# at or above this exports as `fallback`; one below it, or with no score, is
# listed at Export and not exported. test-skill fails a Tier A skill below
# its threshold unless it scores at least 80 (its threshold fallback), so a
# soft_fallback below 80 only matters for Tier B skills, checked by their
# quick-skill (skill-check) score, or for a soft_target below 80.

quality_gate_soft_target = 90
quality_gate_soft_fallback = 80

# --- Optional template overrides. An empty string means the default named below. ---

# Lift the canonical template paths so orgs can substitute house-style copies
# without forking the skill. Each defaults to its bundled file under
# templates/, a path from the skill root. Keep a house-style copy outside the
# skill folder, which every update overwrites, and name it as
# {project-root}/<path to the copy>. On Activation step 3 halts the campaign
# (exit 2, `invalid-input`) on one that names no readable file, before Setup
# or a resume (`campaign status` skips it).

report_template_path = "templates/campaign-report-template.md"
kickoff_template_path = "templates/kickoff-template.md"

# Optional post-completion hook: a shell command, not an instruction. When
# non-empty, step-11 runs it from {project-root} once the campaign is
# finished: after the report and the final state write (current_stage 10),
# before the headless result envelope:
#   <on_complete> --report-path="<path-to-campaign-report.md>"
# --report-path is passed only when the report was written; a report that
# could not be generated leaves the hook called without it. Failures are
# logged to the decision log but never fail the campaign.
# Unlike BMad core, where on_complete is an instruction, this workflow hands
# the value to the shell, so an instruction such as "run Test Skill" fails.
# Empty = no-op.
on_complete = ""
