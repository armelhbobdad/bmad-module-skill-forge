# Machine-generated campaign brief: resume context for fresh sessions
# Written by campaign-state.py init from the parsed targets

# Campaign identifier
campaign_name: ""

# ISO-8601 timestamp of campaign creation
created_at: ""

# Target skills for this campaign run
targets: []
# Each target entry:
#   name: ""
#   repo_url: ""
#   tier: "A"           # A (full pipeline) or B (batch)
#   pin: null            # version pin, or null for latest
#   depends_on: []       # list of skill names this target depends on
#   plus any other field the target's source gave it, such as a language or
#   scope hint

# The quality gate values the seeding brief set, and only those. Each one wins
# over Setup's own value, so a soft value left out here comes from
# customize.toml when this brief seeds a campaign.
quality_gate: {}

# Optional path to the architecture document the verify (Stage 7) and refine
# (Stage 8) stages consume. Empty string means those stages discover it at
# runtime (docs/architecture.md, then _bmad-output/planning-artifacts/architecture.md).
architecture_doc_path: ""

# Operator-provided context or directives for this campaign
notes: ""
