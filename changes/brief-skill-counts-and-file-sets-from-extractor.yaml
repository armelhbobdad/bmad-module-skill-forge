type: changed
scope: skf-brief-skill
summary: |
  Brief Skill's analysis summary now shows the export count the scope-type recommendation uses, so a name two entry files export counts once in both instead of twice in the summary. For Java, Kotlin and Swift, whose public declarations are public in whatever file they sit, the analysis now parses every source file but the tests (`--all-sources`), as Analyze Source does, instead of the first five Java or Kotlin source files or a read by hand of a Swift package, and counts each file's declarations, so two packages' `Builder` classes count twice, the same number Analyze Source records for the unit. `skf-extract-public-api.py --mode quick` now writes `export_count`, `dependency_count` and `reexport_files` (the files the entry files pass names on from), and `skf-recommend-scope-type.py --extract-file` takes the file's `export_count`. The tier-A authoring surface of a monorepo package, and the files a headless `public-api` run includes, now come from the recipe runner's own `--print tier-a-candidates` and `--print public-files` output (`skf-extract-public-api.py --mode full -o <file> --print <set>`) instead of a filter typed into the shell. At Quick tier, or when the runner cannot run, the tier-A list is the analysis's `reexport_files` instead of a read of the package's barrel file by hand, and an empty list leaves `scope.tier_a_include` unset with a warning that says so. The analysis traces re-exports in Python, JavaScript and TypeScript only, so at Quick tier a package in another language now gets no tier-A list instead of one read by hand.
