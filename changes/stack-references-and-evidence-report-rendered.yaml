type: breaking
scope: skf-create-stack-skill
summary: |
  Stack Skill now renders the fixed parts of its reference files, its Library Reference Index and its evidence report with `skf-render-stack-metadata.py`, instead of retyping them from the run's files. The new `references` subcommand (`--mode code` or `compose`, which must match the extraction bundle's mode) prints the index rows in library order, each in its SKILL.md and its `stack-catalog.md` link form, and with `--out` writes each library's `references/<library>.md` (its title, version, import or export count, tier, every key export with its signature and source line or constituent, and its Migration & Deprecation findings) and each pair's `references/integrations/<a>-<b>.md` (its type, co-import file count, Confidence label with its compose suffixes, and its key files or, in compose mode, its evidence, reference and VS lines), leaving one `<!-- skf:fill ... -->` marker line for each part the run writes itself: the usage patterns, common imports, integration pattern and usage convention. A library name with a `/`, such as `@scope/pkg` or a Go module path, puts its files in subfolders (`references/@scope/pkg.md`), and `skf-validate-output.py --skill-type stack` now counts and checks the files in those subfolders too, instead of reporting a `library_count` or `integration_count` mismatch and skipping their structure checks. The new `evidence-report` subcommand writes `evidence-report.md` atomically from the bundle, the run's warnings and decisions, and the provenance map, which it bins by `signature_source` with `skf-render-metadata-stats.py`; a sink line it cannot read is named in the report, and a missing stats helper or an unreadable map writes "not computed" with the reason. A bad input to either exits `2` with one line on stderr and writes nothing, and a missing `skf-render-stack-metadata.py` now stops the write step at the reference files (phase `generate-output:references`) instead of at `metadata.json` (phase `generate-output:metadata`). A house-style copy of the stack template still shapes the prose and any section it adds, but no longer the reference files' header lines, key exports or key files.
migration: |
  A pipeline that branches on `error.phase` looks for `generate-output:references` where a missing `skf-render-stack-metadata.py` at the write step named `generate-output:metadata`, still `helper-missing` (exit `3`); reinstall SKF (`npx bmad-module-skill-forge install`) to clear it.
