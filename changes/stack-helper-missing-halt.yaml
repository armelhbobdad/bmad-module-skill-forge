type: breaking
scope: skf-create-stack-skill
summary: |
  Stack Skill's `SKF_STACK_RESULT_JSON` line now has a schema, `skf-stack-result-envelope.v1.json`, and the shared emitter builds and checks every line, a halt's included, so no step types one. A shared helper the run needs that resolves to no path now stops it with exit `3` and the new halt reason `helper-missing`, with an envelope, where some of these halts printed no envelope or exit code and others reported `resolution-failure`; a missing `skf-comention-pairs.py` halts too instead of being worked out by hand. A Verify Stack report with a verdict token outside the schema's set now stops the run with exit `2` and the new halt reason `unknown-verdict-token`, and cancelling at the no-manifests prompt exits `6` with `user-cancelled`. Every envelope gains `run_id`, `result_path`, `headless_decisions` and `warnings`, and a halt's gains `error` with the step and check it stopped at (`phase`) and its message. The run records each decision it takes without asking the moment its gate decides: the compose-mode suggestion and the scan scope in the first step, the scope gate, whose record names every library the default left out of the stack and why, and the review gate. The emitter names the per-run result file `create-stack-skill-result-<YYYYMMDD-HHmmss>.json` (UTC, `-2` and so on for a run that ends in the same second as another) in the version's forge folder and writes its `create-stack-skill-result-latest.json` copy beside it; the copy at the stack group root stays. The run keeps its state in a run folder under `_bmad-output/.skf-run/`, deleted when the run finishes or is cancelled and kept after any other halt: the import counts, extraction bundle and checked export records the later steps read from disk instead of from memory, and the compiled draft. The review gate shows the stats and the draft's path instead of the whole compiled SKILL.md (`[P]` shows it, and a headless run never does), feedback edits the draft, and the approved draft is staged as it stands. The scope is confirmed at one gate instead of two prompts.
migration: |
  A pipeline that branched on `resolution-failure` for a missing helper branches on `helper-missing` (exit `3` either way): reinstall SKF, or install `uv`, so the shared helpers resolve. One that globbed `create-stack-skill-result-*-*-*.json` for the old `-{pid}-{rand}` suffix reads `result_path` from the envelope or `create-stack-skill-result-latest.json` instead. A pipeline that validates envelopes against its own copy of a schema takes the installed `skf-stack-result-envelope.v1.json`. To review the whole draft before approving it, answer `[P]` at the review gate or open the path it shows.
