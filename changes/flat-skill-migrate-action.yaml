type: breaking
scope: skf-export-skill, skf-update-skill, skf-audit-skill, skf-test-skill
summary: |
  When Export, Update, Audit or Test Skill found an SKF skill still in the old flat layout, the agent moved it into the versioned layout by hand, one command at a time, with nothing to undo a half-done move and no check afterwards, and it also rewrote `.export-manifest.json` itself, which only the manifest helper may change. The four workflows now move it with one `skf-skill-inventory.py migrate` call: it names the version folder from the skill's `metadata.json` (`1.0.0` when it has none), moves the package and points `active` at it, moves the old flat provenance map, evidence report, extraction rules, test and drift reports and gap ledgers into the version's forge folder, checks the result and reports what moved and what it left in place. It leaves the export manifest alone, and when a move or the `active` flip fails it puts everything back. Update Skill then reads the skill from the version folder the migration made, and its `--from-test-report` lookup finds the test report the migration moved into the version's forge folder. Where the hand steps carried on, the move now stops before anything moves: when a version folder, or the `<version>.skf-migrate` folder a cut-off migration left, is already there, when a package entry is a link, or when the `version` in `metadata.json` names no version or is not written as its folder name (`1.0` or `v1.2.3`, whose folders would be `1.0.0` and `1.2.3`, which the export manifest would never match). Update Skill then ends `blocked` with `error.phase` `init:migrate`, Export Skill exits `3` with `resolution-failure`, Audit Skill exits `3` with `skill-not-found`, and Test Skill stops with `helper-failed` at phase `init:resolve`, each with the reason.
migration: |
  Follow the reason the workflow gives, then re-run: delete or move out of the way the version folder already in `<skills folder>/<name>/`, or move what `<name>/<version>.skf-migrate/<name>/` holds back into `<name>/` and delete that folder; replace a linked package entry, such as `references`, with the folder or file it points to; or set `version` in `<name>/metadata.json` to a full version written as its folder name, such as `1.0.0`. The troubleshooting guide's "A flat skill cannot be moved into the versioned layout" entry covers each reason. Skills already in the versioned layout are not affected.
