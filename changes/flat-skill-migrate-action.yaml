type: fixed
scope: skf-export-skill, skf-update-skill, skf-audit-skill, skf-test-skill
summary: |
  When Export, Update, Audit or Test Skill found an SKF skill still in the old flat layout, the agent moved it into the versioned layout by hand, one command at a time, with nothing to undo a half-done move and no check afterwards, and it also rewrote `.export-manifest.json` itself, which only the manifest helper may change. The four workflows now move it with one `skf-skill-inventory.py migrate` call: it names the version folder from the skill's `metadata.json` (`1.0.0` when it has none), moves the package and points `active` at it, moves the old flat provenance map, evidence report, extraction rules, test and drift reports and gap ledgers into the version's forge folder, checks the result and reports what moved and what it left in place. It leaves the export manifest alone, and when a move or the `active` flip fails it puts everything back. It refuses before anything moves when a version folder is already there, a package entry is a link, or the skill's `version` names no version, where the hand steps would have written over or misnamed files, and the workflow stops with the reason. Update Skill then reads the skill from the version folder the migration made, and its `--from-test-report` lookup finds the test report the migration moved into the version's forge folder.
