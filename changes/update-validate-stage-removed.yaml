type: changed
scope: skf-update-skill
summary: |
  Update Skill no longer has a separate validate stage: the merge step goes straight to the write step, which runs `skill-check` once per update, in one call that validates, fixes and runs the security scan against the written package. Before, the validate stage showed checks that had not run yet and could run `skill-check` a second time. After that call the write step checks each `[MANUAL]` section against the ones you approved and stops with `halted-for-manual-mismatch` (`error.phase` `write:verify-manual-integrity`) if `skill-check` changed one, and a body split never moves a section that holds a `[MANUAL]` block. The `active` link now moves to the new version only after those checks, so a `[MANUAL]` stop in the write step removes the new version and leaves the previous one active, where it used to leave the new version live with the changed section. A failed write of `metadata.json`, the provenance map, the evidence report or the context snippet stops with `halted-for-write-failure` (`error.phase` `write:artifact-write`). Without `skill-check`, the package structure is checked with `skf-validate-output.py`. The report's validation table now shows what the write step recorded in the evidence report, with `Diff` and `Security` rows, and the detect, re-extract and merge stages each print one progress line instead of a table the report repeats. The stages are renumbered: write is step 5, the report step 6 and the health check step 7.
