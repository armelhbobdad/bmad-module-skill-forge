type: changed
scope: skf-update-skill
summary: |
  For a skill whose scope type is `public-api`, Update Skill now adds to the provenance map, documents in SKILL.md and lists in metadata.json's `exports` only the new exports on the package's public surface: a name the recipe runner's `entry_point_diff` lists as public or as an extraction gap at that file, or a submodule the entry point exports by name. Before, every export of an added file and every new export of a changed file became a provenance entry and was documented, internals included, so a skill with broad include globs could document hundreds of internal names against a few dozen public ones. `skf-build-change-manifest.py records` marks each export `public` in `reextract-records.json` and prints the count it marks off the surface, and `apply` lists each name it leaves out in its new `not_public` summary key and in `not-public.json` in the run folder, with one warning for them all. When the runner gives no surface it can read (Quick tier, a runner failure or an incomplete run), the update adds every export as before, with a warning that says so. The scope type is the one metadata.json records, else the skill brief's `scope.type`. An entry the map already holds is still updated, an export the update removes from one file and finds in another is kept, and any other scope type, a repair from a test report and a degraded run add every export as before.
