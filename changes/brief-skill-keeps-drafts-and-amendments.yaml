type: fixed
scope: skf-brief-skill
summary: |
  An interactive Brief Skill run now finds the draft an earlier run saved for its target however the target is written (letter case, a trailing slash, `.git`, `owner/repo` or a relative path), where it used to miss a draft whose target was written another way. When a finished `skill-brief.yaml` covers the target, the run now offers right after the target `[U] Revise`, to review that brief and write it back, or `[N] New brief`. A new brief gathered from the target and written over an existing `skill-brief.yaml` now keeps that file's `scope.amendments`, the log of scope changes Create Skill and Update Skill write, instead of dropping them: the overwrite question says how many it holds, and a headless run that overwrites with `force` keeps them too. An entry whose change the new scope does not hold, such as a promoted path the new `scope.include` leaves out, is dropped with a warning, there and when a revised brief's scope leaves it out, so Update Skill offers that path again instead of treating it as in scope. A change made at the brief review is now saved to the draft, so an interrupted run resumes with it, and a rename moves the draft instead of leaving the old one to be offered again. An aside you mention while giving the target or the intent, which was noted but never reached the brief, is now shown in the summary and added to the brief's scope notes, where you can drop it at the review. The review menu no longer offers `[A] Advanced Elicitation` or `[P] Party Mode`, whose results never reached the brief.
