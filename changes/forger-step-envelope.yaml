type: changed
scope: skf-forger
summary: |
  A pipeline chain now records each step from the envelope line its workflow printed, in one `pipeline-journal.py step --envelope` call, instead of Ferris running the gate and copying each status, handoff value and output path out of the envelope by hand. For Analyze Source, Test Skill, Audit Skill and Verify Stack the call runs `pipeline-gate.py`'s rules with the next code in the plan and AN's plan `min`; for every other workflow it reads the envelope's `status`. Create Skill's `partial` (a skill compiled with no exports) now stops the chain with `zero-exports` before Test Skill, and an Export Skill `dry-run` stops it with `dry-run`, where both used to go on; Update Skill's `no-changes`, `detect-only` and `dry-run` go on. In a chain such as `VS[docs/arch.md] RA SS TS EX`, Create Stack Skill now composes from the document Refine Architecture refined, and Test Skill and Export Skill take the stack skill it wrote, where they used to start with no skill. A step that completes without the value it hands on stops with `handoff-missing`. `step` prints the gate's decision as `gate`, and `step --reason -` and `finish --halt-reason -` read the reason on stdin from a quoted heredoc, so a reason no longer needs its quotes replaced. The journal file and the pipeline result keep their shape, and `step --gate`, `--status`, `--set` and `--output` still work.
