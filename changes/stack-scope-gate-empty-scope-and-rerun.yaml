type: added
scope: skf-create-stack-skill
summary: |
  A headless Stack Skill run whose scope review finds no library in scope (none reached two importing files, or `scope_overrides` excluded every one) now stops with exit `2` (`empty-scope`) before it records a scope decision; its message lists each library left out with its reason and asks you to pass `scope_overrides` with `<name>: include` for each library the stack should cover. An interactive run in that state offers no `[C]`: it shows the libraries left out and takes names to add, a custom list or `[X]`. The ownership check on the stack's folder now runs at the first step, right after the stack name is set, so a folder SKF did not generate stops the run with exit `5` (`not-skf-output` or `flat-layout`) and a folder that holds another kind of skill with exit `4` (`write-failure`) before any library is counted, and its envelope names `error.phase` `init:ownership` or `init:not-a-stack` where it named `generate-output:ownership` or `generate-output:not-a-stack`; the check on the version folder still runs before the stack is written, with phase `generate-output:ownership`. When `stack_name` names a stack SKF already published, the scope review marks each library `kept` or `new` against that version, lists each published library the new scope leaves out with its reason, and in code mode keeps by default every published library still imported by at least one file, unless `scope_overrides` excludes it. The headless scope decision now always carries `prior_kept`, the published libraries kept that way (`[]` on a new stack and in compose mode), and a published library's `dropped` reason starts with `in v<version>: `.
