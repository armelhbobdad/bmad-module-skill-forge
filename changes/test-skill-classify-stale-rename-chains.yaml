type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer reports a Critical `fabricated-signature` gap for a documented name the source exports through a rename `classify-stale` did not read: a rename of a rename across files (`from .impl import _Impl as Impl` where `impl/__init__.py` renames `_CoreImpl`, in a compatibility `try`/`except` import too, or assigns `_Impl = _core._Impl`; `export { Internal as Entry } from './internal'`, where `internal.ts` renames `API_Entry` by an export list or by an import then a plain re-export), a generic `type Entry<T> = API_Entry<T>`, an annotated `export const Entry: typeof createEntry = createEntry` or Python `Impl: type[_Impl] = _Impl`, a one-line `try: from .impl import _Impl as Impl`, and a compatibility import inside a module-level `with` or `finally` block. Each such name is now `aliased`, an Info documented extra at its first rename's line, whose `renames` is the name the cited file declares where the chain ends (for a one-step rename, the name that line renames). `classify-stale` in `skf-verify-provenance-completeness.py` follows the chain through each file it resolves that declares the name or renames it by one of these forms, until it reaches the declaration a provenance entry cites; a chain that leaves those files, loops or ends at another declaration stays fabricated.
