type: breaking
scope: skf-campaign
summary: |
  Campaign validates every target before the first compile, whatever its source: a `--manifest` file, a `--brief` campaign-brief.yaml (the new `campaign-parse-manifest.py --brief`), or the list given at the Setup question. Setup now stops with exit `2` `invalid-input` on a `repo_url` that is no GitHub repository (another host, or a path inside a repository such as `/tree/main`), on a name that is no skill name (lower-case letters, digits and hyphens, at most 64 characters, as brief-skill requires), on a Tier A `pin` that is no X.Y.Z version (brief-skill builds a Tier A skill from a version only, as its `target_version`), on two targets with one name, and on a brief target whose `pin` is not a string. A brief or a pasted list used to pass unchecked, a duplicate name silently replaced the first, and a bad name or pin failed its skill part-way through the run. A `repo_url` given as an SSH URL or `owner/repo` is written to the campaign brief as `https://github.com/<owner>/<repo>`, the shape every later stage reads. A target with an empty name takes its repository's name. Strategy now rejects a Tier A skill that depends on a Tier B skill (exit `4` `circular-deps`, its `tier_inversions` named) before any skill is built: Tier B skills are built after the skill loop, so that skill used to stop at its dependency gate. An interactive Setup asks about each such dependency, and each `depends_on` name that is no target, from the script's output, whose entries name a `skill` and its `depends_on`.
migration: |
  Give every target a unique skill name (lower-case letters, digits and hyphens) and a GitHub repository URL, SSH URL or `owner/repo` as its `repo_url`. Write a Tier A pin as a full version (`1.10.0` or `v1.10.0`, not `1.10` or a branch name) and quote it in a campaign brief (`pin: "1.10.0"`), and make each dependency of a Tier A skill Tier A too, or drop the dependency.
