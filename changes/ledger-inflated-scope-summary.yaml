type: fixed
scope: skf-test-skill
summary: |
  When the inflation guard fires because the brief's `scope.include` union sweeps in internal infrastructure, and a stratified-scope or multi-entry skill's Export Coverage counts that union, Test Skill's gap ledger now records one Medium `denominator-inflation` gap at the skill brief, titled "undocumented names in the inflated scope.include union", instead of one Medium `missing-export` gap per undocumented name. It sits beside the guard's own `denominator-inflation` gap at the same brief and defers to it: correct the denominator as that gap says, then re-run Test Skill, and the names the corrected denominator counts that the skill does not document come back as gaps. Its issue gives the size of the union and lists up to 50 of the names, each marked when it is a type and given its file and line when the surface records one, then how many more. Before, a skill whose union counted dozens of infrastructure names got a "document this export" gap for each, which Update Skill's gap-driven mode would then add to the skill. Other skills, and a union the surface lacked, keep one gap per name. The Export Coverage score does not change.
