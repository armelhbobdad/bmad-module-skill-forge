type: fixed
scope: skf-test-skill
summary: |
  Test Skill's signature rules now compare a documented form bound to an overload set with the whole set, its stubs and its implementation, as they compare a form bound to nothing. A form is bound when its own citations name one declaration of its name, and the extraction records an overloaded name at its first `@overload` stub or TS bodiless signature, so such a form is bound to that stub. A bound form that matches the implementation, any stub or, position by position, the unions of the stubs' parameter types is no mismatch, and a mismatch is still reported at the bound declaration's file and line. A form of cognee's `export` returning `GraphSnapshot | ExportResult`, bound to its first stub (`-> GraphSnapshot`), therefore matches the implementation's `-> ExportResult | GraphSnapshot`. A form bound to a name overloaded in one Java, Kotlin, C# or C++ file reads the same and matches when it matches any of those overloads. Before, the rules compared a bound form with its bound declaration alone and never said whether that left out the set's own overloads. Read against the first stub alone, the cognee form is an untagged Critical `signature-mismatch` gap that would fail the hard gate; oms-cognee 1.6.2's judge listed it as undecided, and the skill's 99% pass rested on reading it through the implementation.
