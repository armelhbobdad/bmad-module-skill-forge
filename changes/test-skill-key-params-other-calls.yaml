type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory contract and signature comparison rules now say, in the same words, how a `Key params` or `Key parameters` cell's other calls are read: any call there but the row's own call with no prefix, whether of another name, of a method (a list of the row's class's methods included) or of a name the row's first cell lists, called with a prefix before the name or with empty parentheses, is read as in any other description cell, one the cell says the row's export runs included. So a call that passes an argument, such as `nodes_of_type(node_type)` on a `GraphSnapshot` row, `ZepSource(data, mode="hybrid")` on a `GraphitiSource` row, `forget(memory_only=True)` on a `cognee.update` row that says it runs that call or `.prune_system(graph=True)` on a `cognee.prune` row, is recorded whole in `usage_signature`, a bare leading `.` kept as its receiver, and an empty call, such as `.prune_data()` there or `get_cognee_version()` on a `cognee.__version__` row, is a mention with no form. Before, the files named only the row's own call, so on oms-cognee 1.6.2 readers split on seven names, `link_relations()`, `records()`, `to_dict()`, `.prune_data()`, `.prune_system(graph=True, ...)`, `get_cognee_version()` and `serve()`: a usage, `params`, `params ""` or no entry, the leading `.` kept or dropped. Such a call is now compared as a call, on a `method` entry with the member of that name its owner declares, under `{owner}.{name}`, as Test Skill compares a method form that names its owner, and on any other entry with its name's declaration: each argument it passes must exist, each required parameter must be passed, and a keyword-only one only by name. On oms-cognee 1.6.2 each such call matches its source, the method calls `nodes_of_type(node_type)` and `.prune_system(graph=True, vector=True, metadata=False, cache=True)` as well as `forget(memory_only=True)`, `recall(query_text, scope=["tools"])` and `ZepSource(data, mode="hybrid")`. So a skill that passed while a reader recorded such a call in `params`, a method's call included, can now stop at the hard gate on a `signature-mismatch`, such as for a keyword-only parameter passed by position, while a bare argument is now a value at its position, so one that is not the parameter's name no longer stops it, and the totals can move either way. The signature score also now matches a mismatch to the documented form it quotes whether or not it writes a usage's bare leading `.`, so a partial usage's mismatch is filed against that usage and keeps its partial grade.
migration: |
  If Test Skill now stops at the hard gate on a `signature-mismatch` for a call written in a `Key params` cell, pass each argument as the callable takes it, a keyword-only parameter as `name=value`, or write the parameters with their types, as in `fetch(url: str)`, which reads as a signature, then run Test Skill again.
