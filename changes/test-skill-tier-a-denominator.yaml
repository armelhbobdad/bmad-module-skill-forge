type: fixed
scope: skf-test-skill
summary: |
  On a stratified-scope, specific-modules or multi-entry skill whose brief lists `scope.tier_a_include` files, Test Skill now checks the stored `stats.effective_denominator` against the tier A set it re-derives from the source, when each name sits at the file that defines it (Forge tier and above, the fallback per-file scan, or Quick tier output that traces every name to its defining file). When the two differ by more than 25% in either direction, a Medium `metadata-drift` gap titled `denominator drift: effective_denominator disagrees with the brief's tier_a_include set` asks you to recount by re-running Create Skill, which stores the runner's tier A count when `effective_denominator_decision.store` holds and the brief's `scope.notes` documents the stratification, and otherwise drops the stored count. Until then a stratified-scope or multi-entry skill counts the tier A set and a specific-modules skill its `scope.include` set; an incomplete extraction, which can miss tier A names, keeps a stored count above the set. Before, a stale stored count stayed the denominator after the brief gained or changed its tier A list, so Export Coverage can now rise or fall on such a skill. A stored 0 the set counts any name against raises the same gap, with no percentage; only the gap is new, since a stored 0 was never the denominator. When the deflation and inflation guards both fire, the `scope.include` set stays the denominator and the `metadata-drift` and `denominator-inflation` gaps now name one fix: add or edit `scope.tier_a_include` in the brief to list the files that define the authored names (on an umbrella barrel, those files rather than the barrel), since the `scope.include` union is itself inflated. No guard gap asks you to set `stats.effective_denominator` by hand any more: Update Skill's next recount drops such a value. `surface.json` `guards.deflation` gains `basis` (`tier_a_include`, `scope.include` or `all`).
