type: changed
scope: skf-analyze-source
summary: |
  Analyze Source now proposes composite units once it knows how the units import each other, and carries each approved composite into its brief. The import graph comes from the shared helpers instead of hand counts: which unit imports which, from how many files and through which files, which units are imported together in 3 or more files, which import each other in a cycle, and which external dependencies each unit's files import. A Maven, Gradle, Composer or Swift unit is matched by the packages, namespaces or targets it declares, so imports between such units count too. Each unit's exports come from the ast-grep recipe runner for the languages it has recipes for (Python, JavaScript and TypeScript, Rust, Go), and are read by eye where ast-grep is missing or the language has no recipe, such as Java, Kotlin or Swift. Composite merges are proposed after that graph is built, in the same pass that flags stack skill candidates, so a group of units is never both. A monorepo whose facade package re-exports its members, whose members share one runtime contract, or whose members are private building blocks now gets a merge proposal on the interactive path too, and a headless run accepts it, so it writes one brief instead of one per package. The analysis report records the approved composites in `confirmed_composites`, and each composite's brief lists every constituent's path in `scope.include`.
