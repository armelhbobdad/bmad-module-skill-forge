type: changed
scope: skf-brief-skill
summary: |
  An interactive Brief Skill run asks fewer questions. A target you name when you start it, such as `@Ferris BS https://github.com/colinhacks/zod`, skips the target prompt, and a `skill-brief.yaml` path named there starts the review of that brief. The offer to resume an in-progress draft now comes right after the target, before any other question. The version, supplemental documentation URLs, source authority and skill name are no longer asked one at a time: the summary shown before the analysis marks each value you did not give with `(default)` (the authority comes from your GitHub login, as in a headless run), and you change any of them there. A first brief shows one example description beside the proposed one instead of asking whether to show examples first. Scope definition shows the scope type's defaults and what it detected in one message and no longer asks whether the scope looks right, so the brief review is the one scope confirmation: it shows the scripts and assets intent as `detect (default)`, and when no version was detected it marks the 1.0.0 version `(default)` and, for a GitHub repository, notes that Create Skill at Forge tier or above will look for tag `1.0.0` or `v1.0.0`. Headless and `[auto]` runs read, write and halt as before.
issues: [1136]
