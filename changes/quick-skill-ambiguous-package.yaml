type: breaking
scope: skf-quick-skill
summary: |
  The package resolver now asks every registry of the npm, PyPI, crates.io chain for a package name, not only until one resolves it. The first registry in that order that gives a GitHub repository is the pick, and a name another registry also answers for gets the new status `ambiguous`, with those registries in `name_found_in` and the other candidates in `also_found_in`: an interactive run shows every candidate and asks which project you mean, and a headless run keeps the pick and records an `also_found_in` warning in its result envelope. A registry that could not be read (an error other than a timeout, such as a blocked or failing npm) counts as an answer too. Before, the run compiled whichever repository the first registry to resolve the name gave, with no word of the others, so a bare `numpy` compiled an unrelated npm project in silence. The resolver also reads repository names with dots and `/tree/<ref>/<folder>` URLs, so `next`, `three` and `socket.io` resolve to `vercel/next.js`, `mrdoob/three.js` and `socketio/socket.io` instead of an unrelated PyPI project or a failed lookup, and it reads PyPI's `project_urls` labels in any letter case, so `numpy` and `pandas` resolve to their PyPI projects with a Python language hint (`language=python` on a batch line) or a `==` pin; without one, npm's `numpy`, `pandas` or `requests` stays the pick, and the gate or the warning names PyPI's. Every target now goes through the resolver's new `parse-target` step: `requests==2.31.0` pins a version looked up on PyPI only, npm, PyPI and crates.io page URLs are accepted, an npm dist-tag such as `next@canary` pins no version instead of halting on a missing tag, a URL on another host or a local path gets a message pointing to `/skf-brief-skill` instead of a failed lookup, a JavaScript, TypeScript, Python or Rust language hint looks the name up in that language's registry only, and a monorepo package's folder (npm's `repository.directory`, or the folder of a `/tree/` URL) becomes the default scope. A skill is now named after its package (`@babel/core` gives `babel-core`), else its `/tree/` folder or its repository, in lower case with hyphens, so `https://github.com/vercel/next.js` gives `next-js` instead of a `next.js` skill whose name fails validation, and two packages of one repository no longer write one skill folder. A pinned version's tag is now checked through `skf-github-probe.py`, which falls back to `git ls-remote` when `gh` is missing or logged out and also finds a monorepo package's tags (`astro@4.16.0`), so a tag is reported missing only when the tag listing lacks it, with the tags nearest the version, and a GitHub access failure is reported as one.
migration: |
  Pass the GitHub URL of the project you mean (for example `https://github.com/vercel/next.js`), or its npm, PyPI or crates.io page URL, instead of a package name that more than one registry answers for; in a batch file, a `language=` modifier on the line also picks the registry. A skill Quick Skill wrote before under a name with capitals, dots or underscores, or under its repository's name for a package named otherwise (`query` for `@tanstack/react-query`), gets the new name on its next run: rename the old skill to that name with `@Ferris RS` first so the run updates it instead of writing a second skill.
