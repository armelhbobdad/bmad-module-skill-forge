type: breaking
scope: skf-quick-skill
summary: |
  Headless Quick Skill now stops with exit code `3` (`resolution-failure`) when a package name resolves in one registry after an earlier registry of the npm, PyPI, crates.io chain also answered for it, because the name may then belong to two projects: the package resolver reports the new status `ambiguous` with those registries in `name_found_in`, and an interactive run asks which project you mean. An earlier registry that could not be read (an error other than a timeout, such as a blocked or failing npm) counts as an answer too. Before, the run compiled whichever repository the later registry named. The resolver also reads repository names with dots and `/tree/<ref>/<folder>` URLs, so `next`, `three` and `socket.io` resolve to `vercel/next.js`, `mrdoob/three.js` and `socketio/socket.io` instead of an unrelated PyPI project or a failed lookup, and it reads PyPI's `project_urls` labels in any letter case, so `numpy` and `pandas` resolve on PyPI once the lookup reaches it, with a Python language hint (`language=python` on a batch line) or a `==` pin; a bare name npm also holds, such as `numpy`, `pandas` or `requests`, still resolves on npm, so pass the GitHub URL or a language hint for it. Every target now goes through the resolver's new `parse-target` step: `requests==2.31.0` pins a version looked up on PyPI only, npm, PyPI and crates.io page URLs are accepted, an npm dist-tag such as `next@canary` pins no version instead of halting on a missing tag, a URL on another host or a local path gets a message pointing to `/skf-brief-skill` instead of a failed lookup, a JavaScript, TypeScript, Python or Rust language hint looks the name up in that language's registry only, and a monorepo package's folder (npm's `repository.directory`, or the folder of a `/tree/` URL) becomes the default scope. A skill is now named after its package (`@babel/core` gives `babel-core`), else its `/tree/` folder or its repository, in lower case with hyphens, so `https://github.com/vercel/next.js` gives `next-js` instead of a `next.js` skill whose name fails validation, and two packages of one repository no longer write one skill folder. A pinned version's tag is now checked through `skf-github-probe.py`, which falls back to `git ls-remote` when `gh` is missing or logged out and also finds a monorepo package's tags (`astro@4.16.0`), so a tag is reported missing only when the tag listing lacks it, with the tags nearest the version, and a GitHub access failure is reported as one.
migration: |
  Pass the GitHub URL of the project you mean (for example `https://github.com/vercel/next.js`), or its npm, PyPI or crates.io page URL, instead of a package name that more than one registry answers for; in a batch file, a `language=` modifier on the line also picks the registry. A skill Quick Skill wrote before under a name with capitals, dots or underscores, or under its repository's name for a package named otherwise (`query` for `@tanstack/react-query`), gets the new name on its next run: rename the old skill to that name with `@Ferris RS` first so the run updates it instead of writing a second skill.
