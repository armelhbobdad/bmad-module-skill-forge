type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory floor now reads an export table whose first header cell is `Query` or `Queries`, or is words split at `/` whose first names exports and each other names exports or props, such as `Component / Props` or `Function/Type`. Before, the floor read a table only when its whole first header cell was one listed word, so these tables gave no floor names and a reader could leave their exports out unchecked: for storybook, 73 names of a `Queries` and a `Component / Props` table were missing from the floor, and leaving them out recorded missing-export gaps and a lower Export Coverage with nothing flagging the drop. `validate-inventory.py --floor` now refuses an inventory that leaves out such a name, and a row that writes its name's signature in a fixed form pins it as any floor row does. A props table such as `Prop / Type` and a keyword table such as `Symbol / keyword` still give none. A `stale-documentation` gap now cites such a row, in a nested reference too, as the line that documents its name. An inventory that passed can now be refused.
migration: |
  If Test Skill halts with `inventory-invalid` on a name from a `Queries`, `Component / Props` or other compound export table, run it again: the skill needs no change for it. If a run now stops at the hard gate on a gap for such a name, or on a `signature-mismatch` for a form such a row now pins, document the name or correct the form in the skill (the run's `inventory-floor.json` gives each origin's file, line and `signature`), then run Test Skill again. If a name there is not an export, change that table's header rather than document it, and if a `signature` misreads the row, report it as a bug with the line and the `signature`.
