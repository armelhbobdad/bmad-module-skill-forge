type: fixed
scope: skf-refine-architecture
summary: |
  A long Refine Architecture run that lost its context could lose its headless mode, its output folder, its refinement rules, its record of findings dropped at an earlier review and its `on_complete` hook, since the run record in the RA state file (`ra-state-<project>.md`) kept only the run folder, the timestamp, the document and its project name. That record now also holds the document's content hash, the headless mode, the output folder, the refinement rules path, whether the document held an earlier pass, and the `on_complete` command, one `key=value` per line, so a path or a command with spaces reads back whole, and every step names that record where it reads a binding back. Gap analysis now saves the document's scope to the state file before it reads any skill, and each round of API-surface reads as the round returns instead of once every round is done, so a context loss in the middle keeps the scope and what was read, and on a runtime that cannot launch subagents it reads the skills itself, one at a time, saving each before the next.
