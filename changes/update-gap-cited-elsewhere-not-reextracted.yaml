type: fixed
scope: skf-update-skill
summary: |
  Update Skill's `--from-test-report` repair no longer re-extracts an export whose gap cites another file than the provenance map's entries of its name, as when the test compared another package's declaration: a gap on `definePreview` whose Source is Angular's `__definePreview`, while the map holds `definePreview` in `@storybook/react-vite`. In 4.0.0 such a blocking gap was re-extracted from the files its Remediation names: when one of them declared the exact name, the repair added a second provenance entry and merge replaced the correct export's documentation with that declaration; otherwise the run halted with `halted-for-remediation-path`. Such a gap now ends `unknown`, with `unknown_reason` `cited-elsewhere`, whatever its severity, and the run goes on without a halt: the provenance map and the export's documentation stay as they were, and merge now keeps the documented content of any gap-driven `MODIFIED_EXPORT` recorded `unknown` or `missing`, never rewriting it from the gap's text. The `provenance:` warning names the gap, the cited file and what its check there found (such as `missing` or `no-definition`), and where the map holds the name, with the fix: when the map is right, re-run Test Skill, and if the gap comes back, exclude the cited file in the brief's scope when the skill does not cover it; when an export moved, fix that map entry by hand, then re-run update-skill. When the check read nothing at the cited file, it says to give update-skill the source tree, re-install SKF, or fix what the check failed on, then re-run. One case is unchanged from 4.0.0: when the cited file declares the name itself, such as Vue's own `definePreview`, the check finds it there and the repair rewrites the export's documentation from that file, so before you run the repair on a monorepo skill, check that each gap's Source is a file of the package the skill documents. Each verification record `skf-build-change-manifest.py gap-records` writes now carries `citation_check` and `map_locations`, set for such a gap.
