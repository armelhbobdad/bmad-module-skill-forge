type: breaking
scope: skf-test-skill
summary: |
  Test Skill's `validate-inventory.py` now refuses an inventory whose split-body mismatch names no export the inventory lists. A `cross_check_mismatches` entry's `export` was checked only for being present, so a name no entry has, an empty string or a number passed and became a High `split-body-mismatch` gap titled with it, which Update Skill then took as the export to edit. Its `export` must now be an entry's `name` (a `method`'s bare name, or `{owner}.{name}` for a method entry that gives an `owner`), and any other is a violation naming the value, so the reader is dispatched again once with it, and the run halts `inventory-invalid` the second time. The section's Mismatches Found line, which read a count no step defined, now gives the number of `cross_check_mismatches` entries in the validated `inventory.json`, or 0 when its `references` is empty, as coverage-check then records no split-body gap. An inventory that passed can now be refused.
migration: |
  If Test Skill halts with `inventory-invalid` on a mismatch `export` that names no inventory entry, run it again: the skill needs no change for it.
