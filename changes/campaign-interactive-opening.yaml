type: changed
scope: skf-campaign
summary: |
  Campaign now renders each Tier A skill's kickoff message entirely in `campaign-render-kickoff.py`, so the model no longer rewrites parts of it for every skill. The brief summary lists the skill's target entry in `campaign-brief.yaml`, and Setup now writes every field a target's source gave it into that entry, so a language or scope hint in a seeded brief reaches the kickoff and the Tier B batch. The standing directive is copied byte for byte from the new `--directive-file`, whatever its encoding, or reads `No directive configured`. The persistent facts are piped from the customization resolver into the new `--facts-json -`, one bullet each, or read `None`: the script resolves `{project-root}` with the new `--project-root` and reads the files of each `file:` entry itself. A `file:` path with no glob character that names no file now stops the run with exit `2` `invalid-input` instead of dropping its facts without a word (a glob that matches nothing still adds none), and so does a template, state, directive or facts file the script cannot read; a missing or unreadable brief stops it with exit `8` `missing-brief`, as at the other stages. An interactive Setup now asks for its targets in one question: give a manifest or `campaign-brief.yaml` path, a pasted list or repository URLs, and Setup drafts the target table (tier `A`, the latest release and no dependencies unless you say otherwise, and the project name as the campaign name), shows it once for you to correct, then asks only about what is still missing or ambiguous. `--brief` and `--manifest` still imply `--headless`.
