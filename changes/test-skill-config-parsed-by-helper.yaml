type: breaking
scope: skf-test-skill
summary: |
  Test Skill now parses `_bmad/skf/config.yaml` and `preferences.yaml` with `skf-preflight.py`, the helper Setup Forge, Quick Skill and Ferris use, instead of reading them by hand. A `config.yaml` that is missing or does not parse, or a `sidecar_path` that is missing or still holds a placeholder, stops Test Skill when it starts (`helper-failed`, phase `on-activation:config`) with the helper's message and code, such as `CONFIG_MISSING`, where it used to go on; a missing `skf-preflight.py` stops it with `helper-missing` at the same phase. A missing `uv` now stops it at phase `on-activation:runtime` where it named `init:runtime`, still `runtime-missing`. These stops come before Test Skill reads `headless_mode` from `preferences.yaml`, so they print the `SKF_TEST_RESULT_JSON` line only under `--headless` or `-H`: a run made headless by `headless_mode: true` alone that lacks `uv` now shows the message alone, where it printed the line. A `preferences.yaml` that does not parse is named in one line and the run goes on with the defaults, so only `--headless` or `-H` makes that run headless.
migration: |
  If Test Skill now stops at phase `on-activation:config` naming `sidecar_path`, set `sidecar_path: _bmad/_memory/forger-sidecar` in `_bmad/skf/config.yaml` and run it again. A pipeline that branched on `error.phase` `init:runtime` for a missing `uv` branches on `on-activation:runtime` instead, and passes `--headless` (or `-H`) so a stop when Test Skill starts still prints its line.
