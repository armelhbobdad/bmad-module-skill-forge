type: changed
scope: skf-test-skill
summary: |
  Test Skill's documented inventory now records a function or a class the skill writes as a call with arguments in running text or a description cell, such as `add(componentName, options)` with no `await`, `new`, assignment or receiver before it, whole in `usage_signature`, and the signature check reads it as a call: each argument stands for the parameter at its position, so its names are not compared with the declaration's. Before, no rule placed such a call, so one reader recorded it as a usage and another as a list of bare names in `params`, which gave an argument named differently from its parameter a Low `signature-mismatch` gap in a TS/JS export and a Critical one, failing the hard gate, in a Python export. A call there that writes a parameter type, a return type or a `?` is still a signature, recorded in `params`.
issues: [1016]
