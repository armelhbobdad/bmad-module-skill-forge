type: breaking
scope: skf-setup, skf-quick-skill
summary: |
  Setup Forge and Quick Skill now look for every helper their stage files declare, and for `skf-resolve-customization.py`, when they start, and stop there, before any source is fetched or any skill file is written, when any of them is missing, naming each one: Setup Forge at phase `on-activation:helper-missing`, Quick Skill with exit `3` (`resolution-failure`), `details.cause` `helpers-missing` and `details.missing` listing the missing files. This covers helpers a run used to go on without, or needed only on some runs. In Quick Skill they include the security scan (`skf-security-scan.py`), description guard (`skf-description-guard.py`), content hash (`skf-hash-content.py`), skill inventory (`skf-skill-inventory.py`), metadata renderer (`skf-render-quick-metadata.py`), the atomic writer (`skf-atomic-write.py`), without which the active-pointer flip used to be skipped, the frontmatter validator (`skf-validate-frontmatter.py`) on a run with skill-check installed, the language detector (`skf-detect-language.py`) on a run with a language hint, and, on a single-target run, `skf-quick-batch.py`; in Setup Forge they are the ccc exclusion merger (`skf-merge-ccc-exclusions.py`) and the qmd classifier (`skf-qmd-classify-collections.py`) on any tier, and the envelope emitter (`skf-emit-result-envelope.py`) that renders the banner. A missing `skf-resolve-customization.py` used to print the `customization_resolver_unavailable` warning and go on with the bundled defaults; it now stops the run. A `--batch` run with `skf-quick-batch.py` missing exits `3` where it exited `2`.
migration: |
  Reinstall SKF (`npx bmad-module-skill-forge install`) so every helper resolves. A pipeline that branched on a step's `step <N>:helper-missing` phase, on a per-helper Quick Skill cause such as `github-fetch-missing`, or on exit `2` for a missing batch helper branches on `on-activation:helper-missing`, `helpers-missing` and exit `3` instead.
