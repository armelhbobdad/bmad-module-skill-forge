type: added
scope: skf-create-skill
summary: |
  Create Skill's `SKF_CREATE_SKILL_RESULT_JSON` line now has a schema, `skf-create-skill-result-envelope.v1.json`, and the shared emitter builds and checks every line. Each brief that finishes prints one on stdout, and every HARD HALT of steps 1 to 7 prints one on stderr, in every mode, where only some halts of a headless run printed one before. Each halt exits with a code: `2` for a missing, malformed or invalid brief, `3` for a missing forge configuration, source, helper or documentation, `4` for a failed write, `5` for a refused or broken package, and `6` when the user stops to refine the brief's scope. The line carries `exit_code`, `halt_reason`, `error`, `timestamp`, `run_id`, `result_path`, `headless_decisions` and `warnings`, and keeps `summary.halt_reason` and `summary.evidence_report` at a halt. The emitter writes the result files and stamps their name and timestamp from the clock. The run records each decision it takes without asking as the gate decides, in a run folder under `_bmad-output/.skf-run/` that is deleted when a brief finishes and kept after a halt: every gate a headless run passes by its default, the extraction review (`review-gate`) included, and the tier override in any mode.
