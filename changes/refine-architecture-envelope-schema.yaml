type: added
scope: skf-refine-architecture
summary: |
  `SKF_REFINE_ARCHITECTURE_RESULT_JSON` now has a schema, `skf-refine-architecture-result-envelope.v1.json`, and the shared emitter builds and checks every line, each halt's included, so a halt in any step prints the same shape even when the skill's own instructions are no longer in context. The envelope gains `previous_refined_path` (the name an earlier refined document was renamed to, or `null`), `previous_pass` (the input held an earlier Refine Architecture pass, which this run replaced), `unverified_count` (the technologies the architecture names that no skill covers), `run_id`, `result_path` (the per-run `refine-architecture-result-<YYYYMMDD-HHmmss>.json`, `null` on a halt), on a halt `error` with the step and gate it stopped at, `headless_decisions` (the [VS] report a headless run used or went without, the document scope it kept and the review it approved), and `warnings` when the run recorded one (`vs_report_not_read`, `malformed_ra_markers`, `legacy_blocks_set_aside`, `unknown_scope_skills`, `scope_fallback_all_skills`, `result_file_write_failed`); the result file carries both lists too. Two halt reasons are new: `preservation-failed` (exit `4`: the draft would lose or change a line of the architecture document, so it was not promoted) and `resolution-failure` (exit `3`: the shared emitter or the preservation script cannot run). The gap, issue and improvement counts come from the plan the preservation script applied, never typed. The result files take their name and timestamp from the clock, and a run that ends in the same second as another gets a `-2` suffix. A run keeps its working files and its decisions in a scratch folder under `_bmad-output/.skf-run/`, deleted when the run finishes and kept after a halt.
