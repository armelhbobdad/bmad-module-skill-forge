type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory reader now reads only the skill under test: its `SKILL.md`, the `references/*.md` files, `inventory-floor.json`, the inventory contract and the signature rules. It never opens another run's folder under `_bmad-output/.skf-run/`, a test report, a `test-findings-*.json` ledger or a `skf-test-skill-result-*.json` file. A halted run keeps its folder, and a reader that opened it could copy that run's inventory and cross-check mismatches into a run meant to test the skill afresh, so two runs could agree only because one copied the other. The reader also runs no SKF script, reads no script's code, and writes or deletes no file but `inventory-response.txt` in its run folder. A reader that ran `validate-inventory.py` itself could fix its draft until the validator accepted it, settle a reading by what the scripts accept rather than by the contract, and leave or delete files outside the run folder; validation is now the parent's alone, with the one retry it allows. The rules sit in the inventory contract the reader reads itself, so they hold whatever the reader's prompt says. Readings that were copied from an earlier run, or settled by the scripts' code, may now differ, and a first reading the validator refuses now takes that one retry instead of a fix made out of sight: when the validator refuses the second reading too, the run halts with `inventory-invalid`, which a hidden fix loop used to head off.
migration: |
  If Test Skill now halts with `inventory-invalid` on a skill that passed, read the violations the halt names, correct the SKILL.md or reference lines they point to (or report the reading as a Test Skill issue when the skill is right), then run Test Skill again.
