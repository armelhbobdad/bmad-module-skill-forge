type: changed
scope: skf-verify-stack
summary: |
  Verify Stack's report now lists each requirement recommendation once, under `### Prioritized Recommendations`, so its `## Recommendations` section holds as many recommendations as its recommendation count: the requirements section keeps its coverage table and the gap of each partly fulfilled requirement, and no longer repeats their recommendations. The final step shows the verdict, then that list in its order (about five of each kind, with how many more the report holds), then the suggested next workflow, instead of walking the findings twice. A Risky pair's recommendation names the bridge for that pair, one already in the stack or a named library, codec or adapter, and where the architecture document records it or must add it, or says no bridge could be named, and a Blocked pair's names the replacement or the bridge, in place of a stock sentence. The summary table shows a requirements count of 0 as 0, and `N/A (no PRD)` only when the requirements pass was skipped. The requirements step reads the PRD path from the report's `prdDoc`.
