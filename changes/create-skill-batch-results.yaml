type: changed
scope: skf-create-skill
summary: |
  With `--batch`, every brief now ends with its own result contract (`create-skill-result-<timestamp>.json` and `create-skill-result-latest.json` in that brief's version folder) and its own `on_complete` call, each with that brief's `-latest.json`, where only the last brief of a batch got either before. The health check still runs once, after the last brief. A brief that halts, or whose result contract could not be written, gets no `on_complete` call; the run says why. `on_complete` is run as a shell command from the project root, so it cannot name an agent skill such as Test Skill. A failing `on_complete` command still never fails the brief: it shows one `on_complete failed` line. The extraction inventory a run builds is now kept on disk beside the staging folder, as `_bmad-output/.skf-stage/<skill>.inventory.json`, and the later steps read it there instead of from the conversation, so a long run that loses earlier context still compiles from what it extracted. The new `skf-extraction-inventory.py` writes it from the recipe runner's and the script detector's own output, so no export, citation or count is copied by hand, and it counts the enrichment annotations and writes `extraction-rules.yaml`. When a free-text `scripts_intent` or `assets_intent` leaves detected files out, the evidence report names them. A whole-language reference now keeps its fetched language documentation in `_bmad-output/<skill>-docs/`, as a docs-only skill does, and compiles its Language Guide from those pages. Step 7 now copies the skill as validation left it in the staging folder, byte for byte, and replaces the version's package whole, so compiling a version again no longer leaves reference files of the earlier compile in it; a half-written or hidden file in the staged `references/` is left out.
issues: [585, 587]
