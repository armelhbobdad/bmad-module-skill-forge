type: fixed
scope: installer
summary: |
  `uninstall` now removes only what the installer wrote. Through an output folder entry of the manifest it removes only a regular `.gitkeep` file that still holds the installer's text, and it removes the `_bmad/skf` folder whatever `skf_folder` says, so a hand-edited, mis-merged or copied manifest can no longer make it delete a folder with what it holds, a file of yours or the project itself. Each output entry it keeps is named in a warning before the confirmation prompt, and the removal plan now names the path of each folder and file it removes, each IDE skills folder included, instead of a bare file count. The plan still leaves out the command files earlier releases left in IDE command folders, and the folders it removes because they are left empty.
