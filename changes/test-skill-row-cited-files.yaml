type: breaking
scope: skf-test-skill
summary: |
  Test Skill now reads a documented table row's cited files in its cells alone. For a name the source declares in several files, that scan picks the declaration a signature check reads and, when the name's documented forms cite none of those files, the declaring file of a stale homonym; it also finds a file that passes on another package's names. It read the `[AST:]` and `[SRC:]` citations on the line after each line that wrote the name, so a row also took the citations of the next row, which documents another export: a row with no citation could place the check at the file the next row cites, with no `candidates` for the judge, and a row that cited its own declaration could count a second file and leave the check unsettled. A table row outside a fenced block now reads no line after it, a line after the table included, as a form's own citations are already read, while a heading, a prose line and a line in a fenced block read the next line as before. For cocoindex, the `Settings` row no longer takes `python/cocoindex/setting.py` from the `ServerSettings` row after it. This can block a skill that passed: a check that listed candidates can now sit at the one declaration a row cites and record a Critical `signature-mismatch` gap there. A Gap Report can also gain a Medium `stale-documentation` gap where the next row's citation alone made a stale name an Info documented extra, or an Info observation of another package's `export *`.
migration: |
  If a skill now stops at the hard gate on a check placed at the declaration a table row cites, correct the form, or the row's citation when it points at the wrong declaration, then run Test Skill again. A row that relied on a citation written on the line after it, or after its table, takes that citation into one of its cells. Where a new Medium `stale-documentation` gap points at a table row whose name the source still declares, or passes on from another package, cite that file in one of the row's cells, then run Test Skill again.
