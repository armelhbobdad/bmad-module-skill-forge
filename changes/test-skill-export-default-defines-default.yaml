type: fixed
scope: skf-test-skill, skf-create-skill, skf-update-skill, skf-create-stack-skill, skf-audit-skill
summary: |
  The provenance line check now reads a column-0 `export default` line as the definition of the export named `default`, the name SKF's extraction records for a module's default export, whatever follows it (`export default storybookTest;`, `export default async function postinstall() {}`, an anonymous function or class, an object or any other expression). A correct citation of a default export no longer leaves an Info `provenance-unverified` gap in Test Skill's report, and a stale `default` whose cited file has that line is a documented extra, no longer a Critical `fabricated-signature` gap. A `default` entry at a wrong line now gets that line, so Create Skill, Update Skill and Create Stack Skill move it as they move any entry. A `default` entry an extraction left out, whose cited file has a column-0 `export default`, is now a baseline gap that Audit Skill and Update Skill read by eye, no longer a removed export. `export default foo` still defines `foo`, and CommonJS `module.exports =` still defines no `default`.
