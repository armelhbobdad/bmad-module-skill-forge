type: fixed
scope: skf-export-skill, skf-update-skill
summary: |
  Export Skill now keeps the `()` the prior `|api:` line gave each name it lists. SKF 5.0.0 through 10.0.0 set each name's `()` from the provenance map's `export_type`, which does not say how the line marks a name: an ast-grep recipe labels a const arrow function `function` where a by-eye read can label it `const`, and a component declared with `function` is labeled `function` though the line wrote it bare. So a re-export of a surface that had not changed could drop the `()` from a hook or helper and add one to a component. A name the prior line lists is now written with `()` or bare as that line wrote it, whatever its kind, and the map's `export_type` sets `()` only for a name new to the line. A line an export from those releases already wrote keeps its marks, so check the `|api:` line in the `context-snippet.md` of the active version of each skill they exported: to change a name's mark, edit that line and export the skill again, and later exports keep the edit while the name stays on the line and no Create Skill or Quick Skill run writes the skill a new snippet. A name that leaves the line, because the 300-token trim, a tier's smaller limit, a deprecation or its removal from `exports` drops it, comes back as a new name and takes its mark from its kind again. Update Skill regenerates the snippet by the same rule and no longer counts a listed name's kind change as a change to the line. If `snippet_format_path` points Export Skill at your own copy of `snippet-format.md` made before this release, that copy still tells Export Skill to give `()` to every name whose kind is a function: replace its `|api:` placeholder with the bundled file's wording, and delete its Line 4 bullet and its api line rule, which the bundled file no longer has.
