type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory floor now also pins the form in a table's `Props`, `Params` or `Parameters` cell that is exactly one code span, as `params` (with `signature_form: "partial"` under a partial label such as `Props (simplified)`), and a usage form, a call written after `await`, `new` or an assignment or through a receiver or module path, or a JSX element that sets a prop, as `usage_signature` and `return_type`. `validate-inventory.py --floor` refuses an inventory whose entry at that place does not carry it. Before, the reader chose how to record these forms, and two runs could compare different ones. An inventory that passed can now be refused.
migration: |
  If Test Skill halts with `inventory-invalid` because the inventory changes a form the floor now pins from a `Props`, `Params` or `Parameters` cell or a usage form, run it again; if the pinned form is wrong, correct it in the skill. If a run now stops at the hard gate on a `signature-mismatch` for a form the floor now pins, correct that form in the skill (the run's `inventory-floor.json` gives each origin's file, line and `signature`), then run Test Skill again. If that `signature` misreads what the skill writes at that line, the floor is wrong: report it as a bug, with the line and the `signature`.
issues: [888]
