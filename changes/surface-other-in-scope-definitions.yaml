type: changed
scope: skf-create-skill, skf-test-skill, skf-update-skill, skf-audit-skill, skf-brief-skill, skf-analyze-source
summary: |
  When two packages of a monorepo each define a public name, such as `composeStories` in Storybook's core and React renderer, Test Skill now compares the documented signature with the declaration the skill cites instead of reporting a false Critical `signature-mismatch` against the other package's, and its `scope.include` and `tier_a_include` sets count the name when any in-scope file that defines it matches. The recipe runner keeps every in-scope definition of a public name, in every language family, listing those beside its `public` row in the new `entry_point_diff.other_definitions` (`--mode denominator` reads them from `--extraction`), and a star re-export that the entry point's own export of the name shadows no longer moves that row. So `effective_denominator` can rise by the names that regain an in-scope file or drop where such a star counted one, and `curated_subset` can turn true when the basis leaves out a file that defines a counted name, which can change whether Create Skill and Update Skill store the count; `exports_public_api` does not change. The `root` and `subpaths` sets hold a name any root or subpath entry point gives. A `public-api` skill marks each such definition `public: true` and documents it, and Brief Skill lists its file. A re-export that names a workspace package (`from '@storybook/react'`) is still not followed.
