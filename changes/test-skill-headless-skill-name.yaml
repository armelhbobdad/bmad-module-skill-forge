type: breaking
scope: skf-test-skill
summary: |
  A headless `skf-test-skill` run given no skill name now halts with `halt_reason` `input-missing` (exit code 1 in its envelope) instead of waiting for an answer. Every halt now prints its `SKF_TEST_RESULT_JSON` envelope, the ones that printed none before included: `runtime-missing` (no `python3` or `uv`), `helper-missing`, `helper-failed`, `write-failed`, `input-invalid` (a `--tier` value that names no tier) and `indeterminate-surface` (zero exports or an empty stack surface). The `atomic-writer-missing` halt reason is gone: the shared emitter writes the result files, and a missing SKF helper halts `helper-missing`. The per-run result file now takes its name from the clock, `skf-test-skill-result-<YYYYMMDD-HHmmss>.json`, instead of `skf-test-skill-result-<run_id>.json`, and the `on_complete` hook's `--result-path` names that file. An interactive run given a name that does not resolve lists the skills there are to test, closest first, instead of pointing at create-skill.
migration: |
  Pass the skill name to every headless run (`/skf-test-skill <name> --headless`). Branch on `helper-missing` where a pipeline branched on `atomic-writer-missing`, and read `skf-test-skill-result-latest.json` or the envelope's `result_path` instead of building the per-run file name from the run id.
prs: [637]
issues: [594, 593]
