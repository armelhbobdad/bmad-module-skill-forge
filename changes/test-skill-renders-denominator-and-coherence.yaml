type: changed
scope: skf-test-skill
summary: |
  Test Skill's report records more of its counts by script. The Coverage Analysis section's `Denominator:` line, the provenance-map fold summary and the Denominator Candidates block of a stratified-scope or multi-entry skill now come from `reconcile-coverage.py render`, which takes `coverage-inputs.json` as `--coverage-inputs` for a stack's basis and a reference app's pattern-surface count (`load-coverage-inputs.py metadata` now keeps that count as `patternSurfacesDocumented`). In contextual mode, the Coherence Analysis counts and the Reference Validation and Coherence Score tables come from `aggregate-coherence.py render`, and the Integration Pattern Completeness table now comes last, under them; in naive mode the Structural Findings rows the scans find come from `gap-ledger.py render --from structure`. The model writes only the rows it judged, and a coherence render that fails halts the run `helper-failed` at the new phase `coherence-check:render`. The Completeness Score's Result line now says `PASS_WITH_DRIFT` for a pass under a workspace drift override, as the result file does, and its Scoring Notes say why. Its Weight Distribution line says `contextual (redistributed)` when a contextual run's weights were redistributed, where it said `full`. The Denominator Candidates block names the clause it audits, where a multi-entry skill's said `stratified-scope`.
