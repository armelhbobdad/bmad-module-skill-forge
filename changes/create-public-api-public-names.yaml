type: changed
scope: skf-create-skill
summary: |
  For a skill whose scope type is `public-api`, Create Skill now writes to the provenance map, documents in SKILL.md and `references/`, and lists in metadata.json's `exports` only the exports on the package's public surface, by the rule Update Skill adds new exports by: a name the recipe runner's `entry_point_diff` lists as public or as an extraction gap at that file, or a submodule the entry point exports by name. Before, every export the runner found became a provenance entry and was documented, internals included, so `public_api_coverage` read far above 1 (6.6 on cognee 1.6.2 with broad include globs, where the rule keeps 43 of 424 names). `skf-extraction-inventory.py init` marks each export `public` in the extraction inventory, `add` marks an export read by eye the same way, `provenance` leaves out each export marked `public: false` and `provenance --add-entries` adds no entry of one, `summary` counts and lists them in its new `not_public`, `set` drops them from `top_exports`, and one inventory warning, shown in the extraction summary, names each export left out with its file, which the evidence report lists in full. The extraction summary's zero-export check now also fires when every export is off the surface. When the runner's output gives no surface the rule can read (no entry-point diff, an incomplete run, or an entry point it could not trace), every export is documented as before, with a warning that says why; a run without the runner, and any other scope type, document every export as before.
