type: changed
scope: skf-create-skill, skf-update-skill
summary: |
  Create Skill and Update Skill now take the decision whether to store `stats.effective_denominator` in `metadata.json` from the recipe runner, which writes it beside the count (`counts.effective_denominator_decision`, with `counts.curated_subset`), and, for names counted without the runner's entry-point diff, from the runner's new `--mode denominator`. Only whether the brief's `scope.notes` documents the stratification is still judged. The rules are the ones both workflows applied before, with five differences: a count of 0 is never stored (Test Skill read a stored 0 as deflation), a monorepo's `scope.include` lists a curated subset when it leaves out a whole workspace or a file that defines a public name, a single package's `scope.include` lists one only when it leaves out a file that defines a public name (so a folder subset that holds every public name stores no count, and an update removes the count an earlier run stored), at Quick tier and on a hand count the arms come from the source tree instead of a reading by eye, and a remote source read by eye stores no count.
prs: [766]
