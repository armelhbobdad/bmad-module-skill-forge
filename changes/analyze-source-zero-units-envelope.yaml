type: breaking
scope: skf-analyze-source
summary: |
  When no unit is confirmed (every unit rejected, or every boundary dropped in a headless run), Analyze Source now ends like any other run: it writes `analyze-source-result-<YYYYMMDD-HHmmss>.json`, replaces `analyze-source-result-latest.json` with that record, which lists no brief, prints `SKF_ANALYZE_RESULT_JSON` with `brief_paths: []` and `unit_counts.confirmed: 0` (which the forger's AN circuit breaker reads as no skillable unit), and runs the `on_complete` hook and the health check. Before, it stopped with no envelope, ran no hook and left an earlier run's `analyze-source-result-latest.json` in place. The `on_complete` hook now also runs when an `[auto]` run ends with a coexistence `redirect` or `skipped` status, which before wrote its record without calling the hook. Every envelope now comes from the shared emitter and follows the new schema `skf-analyze-result-envelope.v1.json`: each one gains `result_path` (the per-run result file, null on a halt), a halt's gains `error` with the step it stopped at (`phase`) and its message, a redirect or a skip carries `report_path`, `brief_paths` and `unit_counts` too, and `headless_decisions` lists the `[auto]` merge-or-split decision and the choice of the documented language when a run made them. Every HARD HALT of a headless run prints its envelope, from activation on.
migration: |
  A hook or pipeline that reads `analyze-source-result-latest.json` (the `on_complete` hook's `--result-path`) as a run that wrote briefs checks the record first: its `status` (`redirect` and `skipped` write no brief) and whether its `outputs` hold an entry of type `brief`.
