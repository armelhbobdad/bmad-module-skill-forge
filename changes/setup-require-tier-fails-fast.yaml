type: breaking
scope: skf-setup
summary: |
  A run that misses `--require-tier` now fails fast. It no longer builds a ccc index that is due: the envelope's `ccc_index.status` reads `"skipped"` where it read `"created"`, `files_written` no longer lists `ccc_index` (a fresh index is still kept, as `"fresh"`), and the FORGE STATUS banner says the index waits for a run that meets the required tier. It no longer runs the QMD and CCC registry hygiene: it removes no orphaned QMD collection, even under `--orphan-action=remove`, and prunes no stale entry from `forge-tier.yaml`'s registries, so its `warnings` hold no `orphan_auto_resolution`, `orphan_removed: <name>`, `orphan_remove_failed: <name>` or `ccc_registry_stale_removed: <path>` entry. It still prepares the ccc settings, writes `forge-tier.yaml` with the detected tier and ends `tier_failure` as before.
migration: |
  A pipeline that relied on a run that misses `--require-tier` to build the ccc index, remove orphaned QMD collections or prune stale registry entries installs the missing tools (or lowers `--require-tier`) and runs `/skf-setup` again: a run that meets the required tier builds the index and runs the hygiene.
