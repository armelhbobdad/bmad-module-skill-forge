type: added
scope: skf-test-skill
summary: |
  `SKF_TEST_RESULT_JSON` now has a schema, `skf-test-result-envelope.v1.json`, and the shared emitter builds and checks every line, a halt's included, from a payload `build-result-context.py` derives from the report, the gap ledger and the scoring output, so no step types the envelope or the result contract. Every envelope gains `run_id` and `result_path` (the per-run result file, null on a halt), a halt's envelope gains `error` (`phase`, `reason`, and `path` when the halt names one), and `warnings` appears when the run recorded one, such as `customization_resolver_unavailable` when the customization resolver could not run; the result file gains `skill`, `timestamp`, `run_id`, `headless_decisions` and `warnings`. The envelope is a headless run's last line: the shared health check displays it after everything else. A skill run cannot set the exit status of the agent that runs it, so automators read `exit_code` from the envelope or from `skf-test-skill-result-latest.json`. The headless contract moved to the skill's `references/invocation-contract.md`, which also lists the `--headless`, `-H` and `--discovery-catalog=all` flags the workflow already took.
issues: [593, 600]
