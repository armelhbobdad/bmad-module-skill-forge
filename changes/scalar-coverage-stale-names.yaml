type: fixed
scope: skf-test-skill
summary: |
  On the scalar coverage branch, where a stratified-scope, specific-modules or multi-entry skill is measured against its stored `stats.effective_denominator`, Test Skill now reports a documented name the source does not export. The coverage step passes `reconcile-coverage.py` the surface (`--surface` and `--surface-set`), and when the surface was read from the source, `coverage.json` lists in `stale` each documented name the whole public surface lacks (the `all` set together with the denominator's set, so a nested package's name is not stale), with `staleApplicable` true. This holds whether or not the branch counts its set. The run grades each name as it does on the barrel branch: a Critical `fabricated-signature` gap when no file its provenance cites defines it, an Info `observation` for a documented extra the source still declares, else a Medium `stale-documentation` gap. Before, the scalar branch never listed a stale name. A documented name the denominator's set leaves out but the source exports, such as a Tier B name of a stratified skill, is not stale.
