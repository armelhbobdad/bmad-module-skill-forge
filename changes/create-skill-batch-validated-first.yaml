type: breaking
scope: skf-create-skill
summary: |
  `--batch` now checks every brief with the brief schema validator before the first one compiles, refuses a brief whose `name` an earlier brief of the batch already has (both would compile into one skill folder), shows the plan (the briefs to compile, and each refused brief with the validator's first message), and records a refused brief as failed instead of halting the batch on it later. A HARD HALT now ends only its own brief: the batch records it with its `halt_reason` and exit code and compiles the next brief, where it used to stop the run, with the brief still checkpointed so every later `--batch` run halted on it again. The paths after `--batch` name the briefs (a `skill-brief.yaml`, or a folder whose briefs are compiled), `forge_data_folder` when none is given. When the batch ends it writes `create-skill-batch-<timestamp>.json` and `create-skill-batch-latest.json` under `<skills_output_folder>/_batch/` (each brief's `status`, `exit_code`, `skill_package` and `error_code`), runs the health check once, and exits with the highest exit code among its briefs, `0` when every brief finished. The shared `skf-quick-batch.py` keeps each set of briefs' batch in a folder of its own, `_bmad-output/.skf-run/skf-create-skill-batch-<hash>/`, so a batch an ended session left goes on with the brief it was working on when it is run again with the same briefs, a batch of other briefs started from another terminal never touches it, and `batch-state.yaml` in the forger sidecar, with its `batch_active`, `current_index`, `completed` and `refused` fields, is no longer written. Run with no brief path, skill name or `--batch`, Create Skill now loads the only brief in `forge_data_folder` and names it in its opening banner, asks which one to compile when there are several, and in a headless run stops with exit code `2` (`brief-missing`) naming them, where it used to stop with "No skill brief found" whatever the folder held. The recipe runner now records each function's `params` and `return_type`, and compile writes the whole provenance map through the new `skf-extraction-inventory.py provenance` command (an entry for every export the extraction inventory holds, matched by ast-grep or read by eye, then the documentation and file entries through `provenance --add-entries`), so no entry is retyped and a signature is read by eye only where the runner could not parse it. The doc-rot step now also proposes a changelog, release or pull request line that names one of the skill's exports, such as a Keep a Changelog `### Removed` bullet with no correction keyword, ranks keyword hits and lines under a change section (a heading that is a change name as a whole, such as `### Removed`; GitHub's generated `## What's Changed` is not one) ahead of plain mentions when it cuts the list, and cites each `## CORRECTION` block in a provenance form the skill's citation rule allows (the temporal QMD collection, or the affected export's source line) instead of a bare file name. A team can now drop the bundled `persistent_facts` entry that loads every `project-context.md` by adding it with a leading `!` in `_bmad/custom/skf-create-skill.toml`.
migration: |
  A pipeline that read `batch-state.yaml` (`batch_active`, `current_index`, `completed`, `refused`) reads `create-skill-batch-latest.json` under `<skills_output_folder>/_batch/` instead, each brief's outcome in its `results[]`. One that relied on a batch stopping at its first failing brief reads each brief's `exit_code` and `error_code` there, or the per-brief `fail` events, since the batch now compiles every valid brief and exits with the highest failing code. A headless run that named no brief passes the brief's path or skill name, or `--batch`, when `forge_data_folder` holds more than one brief.
