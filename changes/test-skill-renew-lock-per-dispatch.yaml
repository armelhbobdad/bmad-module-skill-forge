type: fixed
scope: skf-test-skill
summary: |
  Test Skill now renews its run lock each time a subagent returns (or, in an environment without subagents, each time the main thread finishes the work a subagent would have done), and again before its discovery subagents start, not only just before it writes its results. The lock goes stale 60 minutes after it was taken or last renewed, and the inventory reader, the signature judges and the discovery subagents all ran before that one renewal, so on a large skill the lock could go stale partway through a run: a second run of the same skill version started then took the lock over instead of stopping with `another-run-active`, and the first run halted at the end with no result written, losing about an hour of work. A second run now stops at the start with `another-run-active` while the first one works. A run whose lock is taken over anyway, because one subagent or step ran past 60 minutes, halts with `another-run-active` as soon as that work ends while the other run still holds the lock, with an `error.phase` such as `coverage-check:run-lock`, rather than at the end; when the other run has already ended, or let its own lock go stale, the renewal takes the lock back and the run goes on.
