type: breaking
scope: skf-verify-stack
summary: |
  When Verify Stack cannot write a result file, `verify-stack-result-<YYYYMMDD-HHmmss>.json` or `verify-stack-result-latest.json` in the forge data folder, the run no longer stops with exit `4` (`write-failed`, status `error`). It finishes with exit `0` and status `success`, and its envelope's `warnings` list `result_file_write_failed` (`result_path` is null when the per-run file is the one that failed), so `verify-stack-result-latest.json` can still hold an earlier run's record. Exit `4` with `write-failed` at the result contract now means only that the shared emitter refused the result payload twice.
migration: |
  A pipeline that treated exit `4` as a missing result file now checks that the envelope's `warnings` hold no `result_file_write_failed` entry and that the `run_id` in `verify-stack-result-latest.json` matches the envelope's, before it reads that file.
