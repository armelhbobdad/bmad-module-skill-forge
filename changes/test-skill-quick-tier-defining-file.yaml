type: breaking
scope: skf-test-skill
summary: |
  At Quick tier, Test Skill now parses the entry points of every Python, JavaScript or TypeScript skill read from a local source with `skf-extract-public-api.py --mode quick`, as it already did for a skill Quick Skill built, instead of reading them by eye, and places each name at the file that defines it. Quick mode gives each Python, JavaScript and TypeScript export a new `defined_in` key when it reads files under `--source-root`: the file that defines the name, traced through each import, re-export, `export *` and star import to the end of its chain, or null when the chain leaves `--source-root`. `source_file` still names the entry file read, so the export list Brief Skill shows and Quick Skill's `metadata.json` do not change. A name an entry file passes on from a file the skill brief scopes out (outside `scope.include`, or dropped by `scope.exclude`) no longer counts in the `scope.include` set, as at Forge tier, so it is no longer scored as missing and no longer fires the deflation or inflation guard over a correct stored `stats.effective_denominator`. A name behind a statement the parser warns on, such as the entry file's own `export *` or a Python star import with no literal `__all__`, is still read by eye at the entry file, so it still counts in that set when its file is scoped out and can still fire either guard. A `scope.tier_a_include` glob over the files that define the names can now give a `tier_a_include` set at Quick tier. Export Coverage can move either way: the parser can list a name the read by eye left out, so a run that passed can fail.
migration: |
  Re-run Test Skill at Quick tier on each Python, JavaScript or TypeScript skill Create Skill built from a local source, then document each name it now reports as missing, or leave it out of the skill brief's `scope.include` (or add its file to `scope.exclude`) and re-run Create Skill.
