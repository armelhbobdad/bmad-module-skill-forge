type: fixed
scope: skf-test-skill
summary: |
  `validate-inventory.py --floor` no longer refuses the partial label of a second form a pinned row writes. A `Signature` cell such as `run(task: Task)` or `run(task: Task, ...)` is pinned by its first form, with no label, and the inventory contract gives the row one entry per form, the second labelled `"partial"` by its own `...`. The validator read that longer list as a copy of the pinned form and refused its label as one the floor does not pin, so a reader that followed the contract was re-dispatched and a second refusal halted the run with `inventory-invalid`. A list that a `...` makes longer than the pinned form, and that the entry labels `"partial"` where the pin gives no label, is now another form, which keeps its own label and never stands in for the pinned form's copy. Unlabelled, such a list is still the pinned form's copy, the whole list in the skill's order with the shared members spelled out and a `...` among them, and a labelled copy of the pinned form itself is still refused. The inventory contract now says so.
issues: [1043, 1028, 1029]
