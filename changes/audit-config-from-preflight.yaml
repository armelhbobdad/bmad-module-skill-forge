type: changed
scope: skf-audit-skill
summary: |
  Audit Skill now loads its config and the `headless_mode` preference through `skf-preflight.py` before its first question. A missing or malformed `_bmad/skf/config.yaml` stops the run with `helper-missing` (exit 3), and a forger sidecar folder that is missing or not set in the config with `forge-tier-missing` (exit 3), both at phase `on-activation:config` with the preflight's own message; a headless run prints the halt envelope. The forge tier now comes from `skf-forge-tier-rw.py effective`, so a `forge-tier.yaml` that cannot be read, is cut short or names no valid tier also stops with `forge-tier-missing` instead of running at a tier read by hand. The compile tier, the scope type, the docs-only and no-baseline checks and the two baseline doubts come from the new `skf-load-provenance.py baseline` command, and a `metadata.json` or provenance map it cannot read stops with `provenance-invalid` (exit 3) at phase `init:baseline`.
issues: [1132]
