type: breaking
scope: skf-audit-skill
summary: |
  Audit Skill now loads its config and the `headless_mode` preference through `skf-preflight.py` before its first question. A missing or malformed `_bmad/skf/config.yaml` stops the run with `helper-missing` (exit 3) where it used to go on, and a forger sidecar folder that is missing or not set in the config stops it with `forge-tier-missing` (exit 3), both at phase `on-activation:config` with the preflight's own message; a missing sidecar folder stopped at phase `init:forge-tier` before. A missing `uv` now stops it at phase `on-activation:config` where it named `on-activation:helpers`, still `helper-missing`. These stops come before Audit Skill reads `headless_mode` from `preferences.yaml`, so they print the `SKF_AUDIT_RESULT_JSON` line only under `--headless` or `-H`: a run made headless by `headless_mode: true` alone that lacks `uv` now shows the message alone, where it printed the line. The forge tier now comes from `skf-forge-tier-rw.py effective`, so a `forge-tier.yaml` that cannot be read, is cut short or names no valid tier now stops with `forge-tier-missing` where the run used to go on at a tier read by hand. The compile tier, the scope type, the docs-only and no-baseline checks and the two baseline doubts come from the new `skf-load-provenance.py baseline` command, and a `metadata.json` or provenance map it cannot read stops with `provenance-invalid` (exit 3) at phase `init:baseline`; an unreadable provenance map stopped at phase `init:provenance` before.
migration: |
  Reinstall SKF (`npx bmad-module-skill-forge install`) so the installed `skf-forge-tier-rw.py` and `skf-load-provenance.py` are the current ones: an older copy stops Audit Skill with `helper-missing` before it audits. If a run now stops naming `sidecar_path`, set `sidecar_path: _bmad/_memory/forger-sidecar` in `_bmad/skf/config.yaml`; if it stops on a damaged `forge-tier.yaml`, re-run Setup Forge to rewrite it. A pipeline that branches on `error.phase` looks for `on-activation:config` for a missing sidecar folder (was `init:forge-tier`) or a missing `uv` (was `on-activation:helpers`), and `init:baseline` for an unreadable provenance map (was `init:provenance`), and passes `--headless` (or `-H`) so a stop when Audit Skill starts still prints its line.
