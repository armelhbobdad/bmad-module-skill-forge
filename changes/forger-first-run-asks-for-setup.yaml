type: added
scope: skf-forger
summary: |
  On a first run, before Setup Forge has set a forge tier, a pick you start Ferris with that needs the tier now asks first, instead of running at once and stopping at its first workflow that needs the tier. Such a pick runs Analyze Source, Brief Skill, Create Skill, Create Stack Skill, Test Skill, Update Skill or Audit Skill, as every alias does. The greeting says no forge tier is set yet and asks once whether to set it first or to run the pick as given. For an alias or a chain, setting it first runs `SF <pick>`, the pick as one chain with SF ahead of it: an alias keeps its arguments (`SF forge-auto <url>`) and each code its bracket (`SF AS[cocoindex] US TS`). For a pick that names one workflow, such as `TS cocoindex`, `BS`, `US cocoindex --from-test-report` or `audit cocoindex`, it runs SF, then the pick as given, so the pick keeps its arguments, its flags and its own questions. A `TS` pick with `--tier=` sets its own tier and runs at once, and a bare repository URL first asks whether you mean `QS` or `forge-auto`, after which only `forge-auto` gets the tier question. A headless start asks nothing and stops with "No forge tier yet. Run SF first, or start the chain as `SF <pick>`." for an alias or a chain, or with "No forge tier yet. Run SF first, then `<pick>`." for one workflow.
