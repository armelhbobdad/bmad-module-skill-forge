type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory floor now pins the form a `Key params` or `Key parameters` cell writes, the column Create Skill's Key API Summary gives, on a row whose `Kind` cell names a function, method, class, generator or hook, such as `sync fn` or `abstract class`, when the cell opens with the row's name and its parameter group, such as `Mem0Source(data, mode="re-derive")`. Each such form is pinned with `signature_form` `"partial"`, since the header says the cell lists key parameters only. Before, the floor never read that column, so readers recorded different forms there, or the same form with and without the label, which decides Info against Critical for a left-out optional parameter: for cognee, 11 forms such as `read_manifest(directory) -> COGXManifest | None` were never pinned. A table with no `Kind` column, a row of another kind such as `tuple` or `type alias`, a cell that writes a value, an import or a type, such as `("json", None)`, `import { z } from "zod"` or `A | B`, a cell that writes a second form of the name and a compound `Key params / shape` column still pin nothing, and a cell whose form prose qualifies stays the reader's. `validate-inventory.py --floor` now refuses an inventory whose entry there does not carry the form with its label. An inventory that passed can now be refused, and a skill that passed can now block at the hard gate.
migration: |
  If Test Skill halts with `inventory-invalid` on a form from a `Key params` cell, run it again: the skill needs no change for it. If a run now stops at the hard gate on a `signature-mismatch` for a form such a cell now pins, correct the form in the skill (the run's `inventory-floor.json` gives each origin's file, line and `signature`), then run Test Skill again. If a `signature` misreads the cell, report it as a bug with the line and the `signature`.
