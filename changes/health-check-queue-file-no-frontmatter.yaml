type: changed
scope: all workflows
summary: |
  A health-check finding saved to the local queue is now its issue body exactly as drafted, with no YAML frontmatter, written by the new `skf-health-check-seen.py queue` subcommand as `{forge_data_folder}/improvement-queue/hc-<workflow>-<YYYYMMDD-HHmmss>.md` (UTC, with `-2`, `-3` and so on when two share a second, so no file is overwritten). The health check lists each file with the three commands that submit it, every argument quoted for a POSIX shell and `--repo` right after each subcommand: the label create, the create, and the create without labels for a reporter without push access. A finding the reviewer sees at the gate is the text the queue keeps. The command the health check printed before posted the queue file's YAML frontmatter as the top of the issue body and left the title for you to type; the printed commands now carry the title the helper built, which the dedup Action reads. A queue file written by an earlier version still opens with frontmatter: delete it before you submit that file.
