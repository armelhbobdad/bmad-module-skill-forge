type: breaking
scope: skf-test-skill, skf-create-skill
summary: |
  Test Skill now compares a component's documented signature by its props alone: `FC<P>`, `ComponentType<P>`, a `memo`, `forwardRef` or other wrapper over `P` and `(props: P) => JSX.Element` are one contract, and a component's return type is never compared, so writing one where the source declares another no longer raises a Critical `signature-mismatch` gap. This holds for React, Preact, Solid, Vue and Svelte components, class components included; a function that takes several positional parameters, such as `flexRender(Comp, props)`, is compared as a function. A component's own props are the ones its package writes, `VariantProps` of its own variants included. A prop it inherits from another package's type (`HTMLAttributes`, `ComponentProps<typeof Link>`), the `ref` a `forwardRef` adds and the `children` a `PropsWithChildren` adds need not be documented when optional, but a required inherited prop, such as a `Link`'s `href`, must be, and every prop a form writes must exist on the component's props. `| null` and `| undefined` on an optional prop, a props type name the source does not declare and the values in a usage example are not compared. A type never states optionality: a props list that states it for no member, with no `?`, no Required column and no default, has its optionality left uncompared. In an object type that writes `?` on any member, a member written without one is read as required, so a skill a lenient judge passed can now stop at the hard gate; a Default cell or a destructuring default marks only its own prop, so a props table whose Default cells are empty reads no prop as required. The judge is told a renamed prop is a mismatch, not a renamed-parameter difference, since callers set props by name. A partial label in a table's column header, such as `Props (simplified)`, now marks every row of that table partial. Every signature judge, the fallback per-file scan's subagents and a stack skill's reference judge included, reads these rules and the `difference` tags from one file, `signature-comparison-rules.md`, and Create Skill no longer says a component is always `(props: XProps) => JSX.Element`.
migration: |
  If a skill now stops at the hard gate on a component's `signature-mismatch` gap, write `?` on each optional prop of an object type that marks any (or give the table a Required column), list the required props it inherits, then run Test Skill again.
