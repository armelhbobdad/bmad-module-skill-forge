type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer reports a documented module as scoped out by the brief when a name the module passes on has the module's own name and is defined in a file the brief scopes out, such as cognee's `start_visualization_server` submodule, which imports the `start_visualization_server` function from `cognee/shared/utils.py`. The recipe runner's `entry_point_diff.outside_scope` row for a namespace's member now names the namespace (`namespace`), `load-coverage-inputs.py` carries it into `excluded.outsideScope`, and the gap ledger no longer takes such a member for the documented module: the module is an Info documented extra when the source still declares it, else the usual Medium `stale-documentation` gap, instead of a Medium gap that says to widen the brief's scope or remove correct documentation. When the source declares the documented name in the member's own file, the name is that member and the scoped-out gap stays. The member is still listed under Scoped Out by the Brief.
