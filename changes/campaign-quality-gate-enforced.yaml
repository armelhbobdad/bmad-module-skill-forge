type: breaking
scope: skf-campaign
summary: |
  Campaign now enforces its quality gate instead of only printing it. Each Tier A skill runs brief, compile and test with `--headless`: brief-skill gets the repository, the pin (as `target_version`), the skill name and the target's language and scope hints from `campaign-quality-gate.py resolve`, and test-skill gets `--threshold` from `quality_gate_soft_target` (after the directive's `## Quality Overrides`, resolved again right before the test) with `pipeline_alias` `campaign`. The skill loop no longer runs analyze-source for a Tier A skill: brief-skill scopes the named skill itself, as the forger's `forge` pipeline does, and analyze-source's briefs, named after the repository, were overwritten or never read. A skill completes only on the test verdict `PASS`: `FAIL`, `INCONCLUSIVE` and `pass-with-drift` now fail it, although test-skill reports `status` `success` for them. At Export, the new `campaign-quality-gate.py` classifies every completed skill as `pass` (at or above `quality_gate_soft_target`), `fallback` (at or above `quality_gate_soft_fallback`) or `fail`, and only `pass` and `fallback` skills are exported, headless included: the Export table shows each verdict and skill path (now recorded for Tier A skills too) and lists the skills it leaves out. The capstone composes only those skills, each by the skill folder its build wrote. The campaign report gains an Export Gate section, and the headless `SKF_CAMPAIGN_RESULT_JSON` envelope gains `export_verdicts` and `skills_excluded`, so a caller sees which completed skills were not exported. A Tier B skill is classified by the skill-check score quick-skill records, so one with no score is not exported. The directive's `## Skip List` now skips the skills it names in the skill loop and the Tier B batch, with formats for both sections in the directive spec. A `quality_gate` in a campaign brief now wins over the customize.toml values, as documented (Setup settles it with `campaign-quality-gate.py check --brief-file`), and `quality_gate_hard` accepts only `zero-critical-high` (Setup stops on another value with exit `2` `invalid-input`). The Tier B batch writes a line-to-skill map, `_batch-map.json`, joins quick-skill's results to skills by batch number, and batches skills an interrupted batch left `active`; a language or scope hint that holds a space is left off its batch line and logged, since quick-skill reads a hint as one word. The capstone gives `skf-create-stack-skill` its `skills`, `stack_name` and `architecture_doc_path` inputs headless and records the `quality_score` it reports. The Tier A kickoff message no longer shows the campaign-wide gate or a pipeline list: the skill loop states both per skill.
migration: |
  Set `quality_gate_soft_target` and `quality_gate_soft_fallback` to the bar you want enforced (in customize.toml, the campaign brief, or a directive `## Quality Overrides` line such as `- soft_target: 85`): a completed skill below the fallback is now listed at Export and not exported. test-skill already fails a Tier A skill below its threshold unless it scores at least 80, so a fallback below 80 changes only Tier B skills (or a target below 80), and a Tier B skill needs `npx skill-check` for a score. Replace any other `quality_gate_hard` value with `zero-critical-high`, and remove `## Skip List` entries you meant only as notes. A headless caller that read `skills_completed` as the exported count reads `skills_excluded` too.
