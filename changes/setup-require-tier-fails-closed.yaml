type: breaking
scope: skf-setup
summary: |
  A `--require-tier` value that is not exactly `Quick`, `Forge`, `Forge+` or `Deep` no longer switches the tier gate off. Setup passes it to `skf-detect-tools.py`, which rejects it before probing anything, and the run halts at `step 1:detect-tools` with a reason that names the valid tiers, with a did-you-mean hint (`Deep` for `deep`). Before, a wrong-case tier such as `--require-tier=deep` was dropped, and the run reported `success` even on a Quick-tier machine. The space form, `--require-tier Deep`, now works as well. An `--orphan-action` other than `keep` or `remove` halts before setup does anything, at `on-activation:orphan-action-invalid`. Setup now keeps its helpers' output in a scratch run folder under `_bmad-output/.skf-run/`, so a run that cannot create that folder halts at `step 1:run-folder`, where it used to succeed. Under `--headless` or `--quiet`, and in a forger pipeline, each of these halts ends the run `blocked`, with `error.phase` naming the halt; an interactive run halts with the same reason and no envelope. The envelope's `tier_override_invalid` warning now carries the did-you-mean hint the report shows: `tier_override_invalid: deep` becomes `tier_override_invalid: deep (did you mean Deep?)`. `--quiet` is now an alias of `--headless`, and a forger pipeline runs setup the same way: the envelope-only run is unchanged, and an orphan default taken under `--quiet` is still recorded as `quiet-default`.
migration: |
  Pass `--require-tier` with the exact tier name (`Quick`, `Forge`, `Forge+` or `Deep`) and `--orphan-action` with `keep` or `remove`; a pipeline that got `success` for a mistyped tier now gets `blocked` until the value is fixed. Keep `_bmad-output/` writable, and treat `error.phase` `step 1:run-folder` like any other blocked phase. Match the `tier_override_invalid:` warning by its prefix, not by its whole text.
issues: [594, 593]
