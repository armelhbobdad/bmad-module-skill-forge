type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer records a Medium `stale-documentation` gap for a name the source declares in several files when the name's own documented form cites one of them and other lines write the name only as a type argument of another export. The gap ledger picked the declaring file from the citations on every SKILL.md or references line that wrote the name, so a row such as `App[P, R]` added the file of the export it documents, two declaring files were cited, and the report asked the author to update or remove correct documentation. It now reads first the citations of the name's form at the place the validated inventory gives it, and reads the lines that name it only when that form cites none of the declaring files or two (a package and its same-named module still counting as one). For oms-cocoindex, `R`, whose form `R = TypeVar("R", default=Any)` cites only `python/cocoindex/query_handler.py`, is now an Info `Documented extra: R` at that file, its issue saying which form cites it, instead of a Medium `Stale documentation: R`. A documented extra the lines naming it placed at another file moves to the file its form cites, and when a brief scopes out a namespace's member named like the namespace, that file also decides whether the name is the member, which keeps its Medium gap, or the documented module.
