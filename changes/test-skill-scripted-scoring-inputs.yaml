type: changed
scope: skf-test-skill, skf-create-stack-skill
summary: |
  Test Skill now computes its remaining scoring inputs in scripts instead of by hand, so scores can shift slightly. At Forge, Forge+ and Deep tier it reads the source surface from the shared recipe runner, `skf-extract-public-api.py --mode full` with no match cap, so an internal match no entry point exports never counts as a missing export. `score-signatures.py` computes Signature Accuracy and Type Coverage (the source's interfaces, type aliases, enums and classes) from schema-checked subagent results and writes each wrong signature to the gap ledger. `load-coverage-inputs.py` makes every denominator count, guard, union and fold the coverage step used to count by hand, and `compute-score.py` applies the State 2 undercount deduction (10 points off Export Coverage when the provenance map and `metadata.json` disagree by more than 5%). At Quick tier the brief's scope now picks the denominator set and the deflation guard checks it, as at the higher tiers. Type Coverage counts only the types in the set the denominator counts, so a stratified skill's deferred types no longer lower it. A Forge, Forge+ or Deep run with no local source (only the skill's `metadata.json`, or a remote read) now skips Signature Accuracy and Type Coverage and moves their weight to the other categories, as a Quick-tier run does; before, its score could not be computed. A documented name now counts only as a whole name, so `get` written inside `getAll` no longer counts, and Stack Skill's pre-commit check (`skf-names-present.py`) matches the same way. The scripts hand each other their results through files in a run folder under `_bmad-output/.skf-run/`, removed when the run ends. A documented inventory that fails validation is now requested once more, and a second failure halts with the new `halt_reason` `inventory-invalid` (exit 1, with its result envelope on stderr).
