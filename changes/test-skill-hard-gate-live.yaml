type: breaking
scope: skf-test-skill
summary: |
  Test Skill's hard gate now works, and it blocks on any Critical or High gap. The coverage, coherence and external validation steps record every gap they find in a gap ledger, `test-findings-<run_id>.json` in the skill's version folder, each with the severity and category the Gap Severity table gives it, and the gate reads that ledger: a run with a Critical or High gap stops before scoring with `hard-gate-blocked` (exit 2, verdict `FAIL`). Before, the gate looked for gap lines no step wrote, so it never blocked. The severities change: a missing export is now Medium (it lowers Export Coverage and the threshold decides, where it was Critical), a wrong signature and a fabricated one (a documented export that the source does not export and the file the skill cites for it does not define) are Critical, and in a stack skill a broken reference is Critical, a `scripts/` or `assets/` file the skill names that is not there included, an inaccurate reference High and an incomplete integration pattern Medium. In an individual skill, a missing description, usage or API section, an unbalanced code fence and a usage example that awaits a sync function or skips the `await` of an async one are High, so they now block too, while a documented function no usage example or reference file names is Medium. A blocked run no longer stops without a record: it writes the Gap Report, writes a `FAIL` record with `halt_reason` `hard-gate-blocked` to `skf-test-skill-result-<run_id>.json` and `skf-test-skill-result-latest.json` (where an earlier run's verdict used to stay), runs `on_complete` and the health check, then exits 2. Each Gap Report entry now names its category as `Coverage (missing-export)` and so on, and the next step of a FAIL names Update Skill with `--from-test-report`. The result files gain `summary.gapCounts` (the gaps by severity) and `summary.hardGate` (`passed` or `blocked`), and the test report's frontmatter a `hardGate` key.
migration: |
  Re-run Test Skill on the skills you export. A run that now exits 2 with `hard-gate-blocked` lists its Critical and High gaps first in the Gap Report: repair them with `@Ferris US <skill> --from-test-report`, or by hand (add the missing section, close the code fence, fix the example's `await`), then test again. A pipeline that read `skf-test-skill-result-latest.json` after a hard-gate stop now reads that run's `FAIL` record, with `status` `error`.
