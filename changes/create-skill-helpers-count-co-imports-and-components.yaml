type: fixed
scope: skf-create-skill
summary: |
  Create Skill now counts co-imports and component stats with its helpers instead of by hand, so the numbers at Gate 2, in SKILL.md and in `metadata.json` can differ from before and stay the same from run to run. At Forge tier and above, for a library other than a component library, step 3 pipes `skf-scan-manifests.py scan` into `skf-count-imports.py count --threshold 2`, which matches imports on module boundaries (`react-dom` no longer counts as `react`) and leaves out the files the brief's `scope.exclude` names, and `co_imports` lists each dependency imported by 2 or more files with its file count; when the count cannot run, `co_imports` is empty and a warning says why. For a component library, the new `skf-detect-registry.py components` sorts the exports into Props contracts, components, shared types and shared exports, links each Props contract to its component (`naming-convention`, `co-location`, `generic-param` or `none`), maps the registry entries to the catalog with their variants, files and canonical contract, and counts the `component_stats` that `metadata.json` records. Only the variant props notes, a missing category and the integration point suggestions are still the model's.
