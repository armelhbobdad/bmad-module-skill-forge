type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer cites a sentence saying the skill does not cover a name as the line that documents a stale name. The gap ledger read every code span of a heading or a prose line for the line that documents a name, so a disclaimer such as "`load_env_file`, `describe_resolution` and `setup_logging` are among them but out of scope for this skill." could rank before the line that writes and describes the name, and a stale gap's Source, Issue and remediation sent the author to remove the accurate scoping sentence. A sentence that says "out of scope for this skill" or "not covered here", in any case and outside its code spans, now documents nothing unless it is a place the inventory floor lists, as `inventory-contract.md` already says; the other sentences of its line, and the other cells of its table row, still document their names. For oms-cognee 1.6.2, the scoped-out `Stale documentation: setup_logging` gap now cites `SKILL.md:183`, the `cognee.logger` row that binds `logger = setup_logging()` and describes it, instead of `SKILL.md:28`. A name written only in such a sentence is cited at the place the validated inventory gives it, else at `SKILL.md`, as any undocumented name is. Severity, score, gate and gap count stay the same.
issues: [1080]
