type: changed
scope: skf-analyze-source
summary: |
  The step-by-step Analyze Source asks one opening question instead of three: it first reads what the invocation already says (`--project-path`, `--intent-hint`, `--scope-hint`, or a path, a goal and folders to focus on or skip named in the message), then asks only for what is missing, and nothing when the path and the goal are known. With a stated goal, an interactive run now marks the units outside it `deferred` before mapping their exports, lists them in the report and lets you restore any of them; a headless run defers nothing, and `--intent-hint` still only ranks its recommendations. Each step now has one menu that also takes your feedback, where it used to ask an open question and then show the menu (the export mapping menu now offers `[X]` Cancel and exit too), and Recommend leads its menu with the confirmed, rejected and flagged units instead of asking for a final confirmation first; Advanced Elicitation, Party Mode and Discover Additional Source now feed what they change back into the decisions before the brief step, and a run cancelled at that menu resumes at the recommendations instead of skipping to the briefs. The `[D] Discover Additional Source` option of the export mapping and recommendation menus now runs one shared procedure that scans, names, maps and checks the new repository for composites with the same helpers as the rest of the analysis. Each unit's files are listed by the helper (what git lists, so ignored build output and installed dependencies never count) under the project path it was found in, and its language is read from that list; a folder path typed as `./packages/auth` or `packages/auth/` lists the same files as `packages/auth`.
