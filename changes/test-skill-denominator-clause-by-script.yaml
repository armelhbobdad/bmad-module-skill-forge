type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer picks the coverage denominator's clause by hand. `load-coverage-inputs.py surface` picks it from the brief, the extraction and `metadata.json` and writes it to `surface.json` as `denominator` (`clause`, `branch`, `surfaceSet`, `ladderStep`, `absentSet`, `rebuild` and the entry points' state it read, `barrel`). It takes the curated-subset verdict and the monorepo layout from the extraction (`counts.curated_subset`, the rule Create Skill stores `stats.effective_denominator` by, and `arms.monorepo`), and where no file gives them, what only the workflow can tell as four new flags: `--monorepo`, `--pattern-reference-intent`, `--curated-subset` and `--barrel` (an entry point read by eye, empty or missing). An extraction the per-file scan replaces that found no entry point now reads as one with none, as a complete run does, so the clause no longer depends on whether ast-grep is installed. A `specific-modules` or multi-entry skill that stores `stats.effective_denominator` is now measured against that stored count, under the deflation guard, as the source access protocol and Create Skill already said, where the coverage step had counted its name set instead, so its Export Coverage can change; a stored 0 is no denominator. A provenance map whose raw count equals `stats.effective_denominator` is no longer folded, and `canonical` now reports `skipped` and `residual`.
