type: breaking
scope: skf-verify-stack
summary: |
  Verify Stack drops the `integration_rules_path`, `coverage_patterns_path` and `output_folder_path` settings, and a `_bmad/custom/skf-verify-stack.toml` that sets them is now ignored. The integration rules hold the verdict obligations the shared feasibility report schema puts on the report's producer, so a house-style copy could break what Create Stack Skill and Refine Architecture read. Coverage now takes the skills a document names from the shared mentions helper, and the other names a skill goes by come from `persistent_facts`, so the bundled coverage patterns are no longer an override surface. The report always lands in `forge_data_folder`, where Create Stack Skill, Refine Architecture and the next Verify Stack run look for it. The `report_template_path` comment now names what a copy of the report template must keep.
migration: |
  Remove `integration_rules_path`, `coverage_patterns_path` and `output_folder_path` from `_bmad/custom/skf-verify-stack.toml` and `_bmad/custom/skf-verify-stack.user.toml`. Give the other names your documents use for a skill as a `persistent_facts` entry instead, for example "Our documents call the postgresql skill Postgres or PG.". To keep reports somewhere else, change `forge_data_folder` in `_bmad/skf/config.yaml`, which moves the report and the workflows that read it together.
