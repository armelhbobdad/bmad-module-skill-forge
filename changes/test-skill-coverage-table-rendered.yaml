type: changed
scope: skf-test-skill
summary: |
  The Coverage Analysis section of a Test Skill report is now rendered by `reconcile-coverage.py render` from the run's coverage, surface and signature files instead of being written by hand. On an enumerated (barrel) denominator the Export Coverage table lists every export the denominator counts, every stale name and every name whose signature mismatches, with a fixed Status (`FAIL` for a signature mismatch, `WARN` for a missing or stale export, `PASS` otherwise) and the file and line the source surface records as its Source Location. **Files Analyzed** counts the distinct files on the source surface. A scalar or stack denominator, which counts exports without naming them, shows one line in place of the table, and so does a docs-only run, which has no source surface. The Coverage Summary and Category Scores come from the same files, and the summary also lists the names the brief scoped out, a nested Python entry point's names and the names the stale-scope guard restored.
