type: breaking
scope: skf-rename-skill
summary: |
  Rename Skill's lock against two renames of one skill at once now works, so exit `5` `halted-for-concurrent-run` fires while another rename of the same skill holds a fresh lock. The lock file, `.skf-rename-<name>.lock` in the forge data folder, now names the run that holds it and when that run took it, through the shared run-lock helper. Before, it held the process id of a shell that was gone by the next step, so every later run read the lock as left behind, cleared it and went on, even while the first rename was still copying. A lock goes stale 60 minutes after it was taken or renewed, so a crashed run blocks the next rename of that skill until then, and the next run replaces a stale lock with a `run-lock-replaced` warning. A rename renews its lock before it copies anything and stops with `halted-for-concurrent-run` when its lock went stale while it waited at a prompt. Every stop after the lock releases it, a release never removes another run's lock, and `--dry-run` takes no lock. Each run keeps a run folder under `_bmad-output/.skf-run/`, deleted when the rename or the dry run finishes and kept after a halt or when the emitter could not print the run's envelope, and stops with `write-failed` (exit `4`) when it cannot create that folder or when the run-lock or envelope helper is missing. The result files `rename-skill-result-<timestamp>.json` and `rename-skill-result-latest.json` now carry the auto-decisions in a top-level `headless_decisions` list, no longer in `summary.headless_decisions`, and the per-run file name is the UTC time the shared emitter stamps. `versions_renamed`, in the envelope and in the result files' `summary`, now lists only the versions whose package the rename moved: a version folder without a package is still copied but no longer listed, and the report counts the versions and the rewritten files from what the rename did instead of repeating the version count. `manifest_rekeyed` is now true only when the rename re-keyed the skill's export manifest entry, and false when the manifest has entries but none for the skill. When the new name collides because an earlier rename to it stopped after re-keying the export manifest, the run now stops with `name-collision` in interactive runs too, instead of asking for another name, and names the old folders that rename left and the commands that finish it.
migration: |
  When Rename Skill stops with `halted-for-concurrent-run` and no other rename of that skill is running, delete the lock file the message names (`<forge data folder>/.skf-rename-<name>.lock`), or wait until the time the message gives, when the lock goes stale; then run the rename again. A pipeline that read `summary.headless_decisions` from a rename result file reads the top-level `headless_decisions` instead. A pipeline that read `versions_renamed` as every version folder the rename copied lists the renamed skill folder instead, and reads `manifest_rekeyed` as whether the manifest entry moved. After a `name-collision` that names leftover folders, delete them with the checked delete the message gives and run Export Skill, instead of renaming the old skill to another name.
