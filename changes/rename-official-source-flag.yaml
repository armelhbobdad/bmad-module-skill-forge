type: added
scope: skf-rename-skill
summary: |
  The new `--acknowledge-official` flag lets one headless run rename a skill whose `source_authority` is `official`, and the run records that decision in its envelope's `headless_decisions`. Without the flag, or the standing `force_source_authority_in_headless` setting (which now also accepts the TOML boolean `true`), the run still stops with `source-authority-blocked`, and the message names the flag. An interactive run now takes the current and new names given with the invocation, such as "rename cognee to cognee-ai", instead of asking for them again: it asks only for a name that is missing or that fails its check. A missing manifest or inventory helper now stops the run before its first question with exit code `4` (`write-failed`), where before the run read the manifest by hand or refused the skill with `not-skf-output`. The new-name check and the version listing, which the run used to do by hand when their helper could not run, now also stop with exit code `4` when their helper prints nothing. A `persistent_facts` entry that starts with `!` now drops the entry it names, so `persistent_facts = ["!file:{project-root}/**/project-context.md"]` in `{project-root}/_bmad/custom/skf-rename-skill.toml` stops Rename Skill from loading every `project-context.md`, which it loads by default.
issues: [594, 596]
