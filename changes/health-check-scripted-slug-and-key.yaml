type: changed
scope: all workflows
summary: |
  The health check's helper now derives a finding's section slug from the section's heading and its defect key from the name of the thing the fix would change, instead of the model typing both: the step writes the heading, copied as the step file writes it, and the name to a file that `skf-health-check-seen.py fingerprint --stdin` reads, and a heading that is not one of the step file's own, in any letter case or punctuation, exits 2. A value the helper refuses is fixed once; refused a second time, or when the file cannot be written, the finding is saved to the local queue with the fingerprint `N/A` and a reason of its own instead of the run looping. The slug drops the heading's `#`s and its numbering token (`### 5a. Live-Submit Path` gives `live-submit-path`), and the key may now name a script by its file name, its backticks or quotes, path, extension and line suffix dropped (`scripts/gate_eval.py:42` gives `gate-eval`). Some fingerprints shift by that rule: a defect reported before under a slug that kept the heading's numbering, or under a key written another way, is reported as a first sighting under a new fingerprint. A regression's `## Regression` line is now the helper's `opening_line`: `Regression of <url> (resolved <date>).` after a recorded fix, and `Regression of <url>, closed as completed since its report on <date>.` after an issue closed as completed, where the line used to give the day the defect was reported as the day it was fixed.
