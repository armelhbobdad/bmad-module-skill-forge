type: breaking
scope: skf-update-skill
summary: |
  Every `SKF_UPDATE_RESULT_JSON` line Update Skill prints, at a stop as well as at the end of a run, now comes from the shared emitter and follows `skf-update-result-envelope.v1.json`: a stop's line carries the `skf_update` wrapper with `skf_update.status` (a `halted-for-*` code or `blocked`) and `skf_update.error` (`phase`, `path`, `reason`), where before a stop printed a top-level `status` and `error` with no wrapper and fewer fields. Each gate records its headless decision in the run folder as it decides, so a stop reports the decisions taken before it. In a headless run, a document or code path found outside the skill brief's scope is no longer recorded as `skipped`: the brief records it as `deferred-headless`, and the `headless_decisions[]` entry of the gates `detect-changes.promoted-doc-prompt` and `detect-changes.scope-expansion` has `taken_action` `deferred-headless` in place of `S`, one entry per path, so the next interactive run asks about it. A `skipped` amendment an earlier headless run wrote (reason `headless: no user to prompt`) now counts as deferred too. The gate `init.degraded-rebuild`, which `--allow-degraded` records, is now in the schema. A run that finds no change now writes `update-skill-result-latest.json` and its per-run record in the current version's forge folder and runs `on_complete`; `--detect-only` and `--dry-run` write no result file and never run `on_complete`, whether or not they find a change. An `on_complete` failure no longer appears in `warnings[]`: the line and the result files are written before the hook runs, and the failure is reported to the user in one line. A `[MANUAL]` block that no longer matches what was approved is now caught before the new version is published, with `error.phase` `merge:verify-manual-integrity` (where before it stopped later with `write:verify-manual-integrity`), and a headless run that meets a `[MANUAL]` conflict (`merge:conflict-resolution`) now stops before it writes anything.
migration: |
  Read `skf_update.status`, and `skf_update.error.phase` and `skf_update.error.reason`, from every line, a stop's included, never a top-level `status`. Treat `taken_action` `deferred-headless` as a path left for a person, and run Update Skill once interactively to promote or skip each one. An `on_complete` hook now also runs after a run that found no change: read `summary.update_status` in the result file it is given to tell the two apart. To learn that the hook failed, check the hook's own exit status (or have the hook report its failure itself) instead of `warnings[]`. Treat `merge:verify-manual-integrity` as the same `[MANUAL]` mismatch as `write:verify-manual-integrity`.
issues: [593, 585]
