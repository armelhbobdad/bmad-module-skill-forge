type: fixed
scope: skf-create-skill, skf-brief-skill
summary: |
  Create Skill's documentation fetch now measures each fetched page with `skf-detect-docs.py page-metrics` and keeps a discovered subpage only when `skf-detect-docs.py filter-urls` finds it on the root page's own site, instead of counting words and link lines by eye, so a miscount no longer skips subpage discovery or fetches subpages for nothing. `filter-urls` also reads a gzipped sitemap, and leaves a page out only when a whole path segment is `blog`, `changelog`, `pricing`, `about` or `careers`, so a section such as `about-the-rest-api` keeps its pages. A subpage that fails to fetch no longer leaves a stub page in the docs corpus. A Deep run fetches its temporal context through the new `skf-fetch-temporal.py`, which writes the same issue, pull request, release and changelog files from the same upstream data on every run, reads the notes of each release, which the release loop as written never handed to its formatter, and keeps the last good files when a refresh fetches nothing but failure notes. Enrichment now searches only the skill's own temporal and docs collections, so another skill's issues or docs no longer annotate it, and a skill with only a docs collection is enriched as well. Component-library extraction runs its recipes through `skf-extract-public-api.py` in one call, and a docs-only skill now keeps its fetched pages in `_bmad-output/<skill>-docs/` at every tier, as it already did at Deep tier. On Windows, `skf-write-skill-brief.py` now reads the brief context it is piped as UTF-8, so an accented letter in a description or an amendment's reason is no longer garbled.
