type: fixed
scope: skf-test-skill
summary: |
  Test Skill now compares a documented signature with the declaration the skill cites. For a name the source surface records in more than one file, such as a function each framework package of a monorepo defines, the signature check read whichever file sorted first, so a skill that documents another package's declaration got a false Critical `signature-mismatch` gap. `score-signatures.py plan` now takes `--skill-dir` and plans the check at the file that the skill's `[AST:]` or `[SRC:]` citation names on a line naming the export. When the citations name none of those files or several, the check lists each declaration as `candidates`: the judge reports one mismatch, at the closest candidate, only when the documented signature matches none of them, and names that candidate in the mismatch's new optional `file` key, which becomes the gap's Source. `score-signatures.py score` reads the plan (`--plan`), takes a mismatch's `file` only when the plan offered it for that check (any other is a warning) and keeps one mismatch per check. A surface record with no file no longer takes the check from one with a file. The judge is also told that a documented signature matching the implementation of an overload set, or any of its overloads, is no mismatch; no script checks this.
