type: changed
scope: skf-brief-skill, skf-verify-stack, skf-refine-architecture, skf-export-skill, skf-drop-skill, skf-rename-skill, skf-quick-skill, skf-test-skill, skf-campaign, skf-analyze-source
summary: |
  The summary a workflow shows just before its closing health check no longer says the workflow is complete, so the health check's `Workflow complete.` is the only completion line a run prints: a summary that read as the end made agents stop there and skip the health check. Brief Skill and Verify Stack drop their closing "complete" line, Test Skill drops its closing **Test report finalized.** line, Refine Architecture drops its closing message (its summary already shows the saved path, and the re-run hint moves into its next steps) and opens with **Refine Architecture: Refined Document Ready**, and Export Skill, Drop Skill, Rename Skill, Quick Skill, Test Skill and Campaign open with a summary title (**Export summary** in place of **Export Complete**). Export Skill's dry-run note is headed **Dry Run: Nothing Written**, Campaign's note when its report fails reads **The campaign report could not be generated** in place of **Campaign finished, but the report could not be generated**, and Analyze Source's message when no unit was confirmed no longer says the analysis is complete.
