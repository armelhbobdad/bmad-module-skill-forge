type: breaking
scope: skf-analyze-source, skf-audit-skill, skf-brief-skill, skf-campaign, skf-create-skill, skf-create-stack-skill, skf-drop-skill, skf-export-skill, skf-quick-skill, skf-refine-architecture, skf-rename-skill, skf-test-skill, skf-update-skill, skf-verify-stack
summary: |
  `on_complete` stays a shell command in 13 workflows and an instruction in Setup Forge and Verify Stack. Each `customize.toml` comment and the docs now say that, unlike BMad core, where `on_complete` is an instruction, these workflows hand the value to the shell, so an instruction such as "run Test Skill" fails; Create Skill's failure line says so when the hook exits 127. Every command-style workflow runs the hook from your project root and quotes the path it passes, so a project path with a space stays one argument, and Quick Skill's hook gets a 60s timeout. Stack Skill's hook now receives `--result-path=<version folder>/create-stack-skill-result-latest.json` and is skipped, with a line that says so, when the run wrote no result file, so a Stack Skill hook that refuses arguments it does not know, such as a bare `curl` call, now fails. Verify Stack deletes its run folder before it carries out the instruction, shows a failure on one line and goes on, and runs the health check even when the instruction started another workflow.
migration: |
  If your Stack Skill `on_complete` command refuses arguments it does not know, call it from a script that ignores its arguments or reads `--result-path`.
