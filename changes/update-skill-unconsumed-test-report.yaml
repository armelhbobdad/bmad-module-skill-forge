type: changed
scope: skf-update-skill
summary: |
  Update Skill with `--from-test-report` now routes each gap by its category, not its severity, so a missing export that Test Skill rates Medium and that cites no source line still gets a targeted re-extraction from the files its remediation names; when none of them holds the export, it is recorded without a source line, as a Medium gap may be, and the run does not stop. Each gap Update Skill has no repair for adds `test-report: not routed: <id> (<category>)` to `warnings[]`. A run without `--from-test-report` now looks for the skill's newest test report first: when that report failed, or passed only under workspace drift, is newer than the skill and was not applied by an earlier repair, an interactive run offers to repair its gaps (`[G]`, the default for a failed report) or to check the source for changes (`[S]`, the default for a drift pass), and a headless run checks the source and adds `unconsumed-test-report: <report path>` to `warnings[]`. When no source file changed, the report then names `--from-test-report`, or for a drift pass a new test against the pinned commit, instead of saying no action is required. So that a repaired skill reads newer than the report it applied, `metadata.json` `generation_date` is now written to the second, and the update block of `provenance-map.json` records that time as `last_update` and the applied report's run id as `test_report_run_id`. In a normal run, scripts now work out which files and exports changed, one category after another; an authoritative document such as `AGENTS.md` that the skill brief's scope already includes is now tracked without a prompt, as Create Skill tracks it, and one an earlier headless run skipped is asked about again in an interactive run.
issues: [583, 589]
