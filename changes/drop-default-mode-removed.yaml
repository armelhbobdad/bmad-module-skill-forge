type: breaking
scope: skf-drop-skill
summary: |
  Drop Skill no longer reads the `default_mode` setting: the drop mode now comes only from the `mode` argument (`--mode deprecate` or `--mode purge`) or, in an interactive run, from the question Drop Skill asks. A `--headless` run with no `mode` argument now stops with exit `2` (`input-missing`) even when an override sets `default_mode`, and the result record's `headless_provenance.mode_source` no longer takes the value `customize.toml.workflow.default_mode`. Any non-empty `forbid_purge_in_headless` now blocks a headless purge (exit `6`, `headless-purge-forbidden`), where before only the exact string `"true"` did: a TOML `true`, `"yes"`, and even `"false"` or `false`, now turn the guard on, and only an empty value leaves it off. The guard checks the `mode` argument alone. The halt that asks for a mode, and the purge guard's halt, no longer point at `customize.toml`, which every update overwrites: the guard's message says to re-run with `mode=deprecate`, or to empty `forbid_purge_in_headless` in the team or personal override that sets it. A failing `on_complete` hook is now shown as a line of its own after the result, instead of being dropped.
migration: |
  Remove `default_mode` from `_bmad/custom/skf-drop-skill.toml` and `_bmad/custom/skf-drop-skill.user.toml`, and pass `--mode deprecate` or `--mode purge` on every headless drop. To keep the headless-purge guard off, remove `forbid_purge_in_headless` from those overrides or set it to `""`; to turn it on, set it to any other value, written quoted, such as `"true"`: an override file that fails to parse (an unquoted `True`, `yes` or `on` included), the personal `.user.toml` as much as the team file, makes the run ignore both overrides with a `customization_resolver_unavailable` warning, which leaves the guard off.
