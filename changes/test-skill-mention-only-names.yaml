type: changed
scope: skf-test-skill
summary: |
  Test Skill no longer counts a name the skill writes only as a mention as an export it documents, whatever the prose says of it. A name bare in prose, a bullet list or a description cell, in an import, an `__all__` or other export list or a comment, or after a heading's first word (`cognee.low_level` in "Data primitives: `cognee.low_level`") gets no inventory entry unless the inventory floor gives it a place. It records no Medium `stale-documentation` gap asking Update Skill to remove accurate text, as 74 of oms-storybook-react-vite's 75 did on its latest run, and no Info documented extra, but it is no longer checked against the source either, so a stale one records no gap. Where Export Coverage counts the inventory's names (the barrel branch, and the scalar branch when it counts its set or looks the documented names up), a name the source exports and the skill writes only as a mention now counts as undocumented and lowers Export Coverage, with a Medium `missing-export` gap (`missing-type` for a type): in a rehearsal with three readers per reference skill, all three leave out eight exports oms-uitripled's latest run counted as documented, such as `Button` and `Card`, and oms-storybook-react-vite's `storybookTest`. A stack skill's count and the verified count of a padded declared count still find such a name in the skill's text, and a docs-only run counts it as no item. A name a place writes a form, `methods`, `properties` or `fields` of, or writes in a heading that opens with it, an export table's first cell or a fenced declaration of it, keeps its entry, which with no form sits at that heading, row or declaration, never at a prose line that names it first. This narrows the type-mention and not-covered rules, which counted a code span that is the name, or prose that describes it.
