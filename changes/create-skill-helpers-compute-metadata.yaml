type: changed
scope: skf-create-skill
summary: |
  Create Skill's helpers now compute what its steps used to work out by hand. Step 5a records `doc_sources` in the staged `metadata.json` with one `skf-detect-docs.py record-sources` call, which keeps each detected page's hash, adds the README entry and leaves every other field as it was. Step 6 fixes drifted `stats` and `confidence_distribution` values and records `validation_status` through `skf-render-metadata-stats.py --check --fix --validation-status`, checks the frontmatter with `skf-validate-frontmatter.py` when skill-check is unavailable, and step 5 sanitizes the description with `skf-description-guard.py sanitize`. The report's headline confidence is the helper's `primary_confidence` (the largest bin, the weaker label on a tie). Registry entries and recorded auto-decisions get their `created_at`, `indexed_at` and `timestamp` from the helpers' clock, as the full UTC time to the second (for example `2026-11-14T10:00:00+00:00`) where a run used to write the date, and the cache and embed checks read `skf-forge-tier-rw.py read --fresh-within-hours`, so a collection's age is measured, not guessed. The doc-rot scan no longer scans `issues.md` and `targeted-issues.md` (it lists them in `scanned_skipped`), so changelog and release-note candidates the cap used to drop for issue lines are kept. The ccc index check reads `skf-merge-ccc-exclusions.py --check-index`, which calls an index verified when the source language has at least 10 chunks, or at least 5% of a smaller index, so some runs report a different index verdict than before.
