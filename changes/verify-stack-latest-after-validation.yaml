type: changed
scope: skf-verify-stack
summary: |
  Verify Stack now writes only its timestamped report, `feasibility-report-<slug>-<timestamp>.md`, while it runs, and copies it to `feasibility-report-<slug>-latest.md` only after the finished report passes the feasibility-report check, so a run that halts leaves the last finished `-latest` copy in place for Stack Skill, Refine Architecture and campaign instead of a partial report. Without `--previous-report` it compares against the newest earlier report whose run finished (its `stepsCompleted` lists `synthesize` and it passes the feasibility-report check), never a partial one. Integration evidence now comes from scripts instead of reading each SKILL.md in context: Check 4 quotes the literal citation, substring and line, that `skf-scan-skill-md-structure.py cross-reference` finds, and a citation of the repository or folder a skill was built from also counts (a skill named `oms-cognee` is cited where another skill's SKILL.md says `cognee`) unless another skill shares that name, so some pairs move from `Plausible` to `Verified`. Two technologies that match one skill no longer form a pair. The circular-dependency check reads the same citations, and a skill changed during the run is found by its `metadata_hash` (`skf-enumerate-stack-skills.py --expect-hashes`) instead of a modification time; its pairs are reported `Risky`, with a re-run recommendation. Coverage matches technologies against the repository and folder names the enumerate helper reports, and the requirements pass reads the summaries step 3 writes for every covered skill instead of each SKILL.md. The pair counts, the requirement counts and `recommendationCount` now come from `skf-coverage-tally.py` and `skf-verdict-rollup.py`: each circular-dependency row counts as `Risky`, so a stack where two skills cite each other, or more skills cite each other in a circle, reports `CONDITIONALLY_FEASIBLE`, and `recommendationCount` counts the recommendations the report lists: one per Missing or Replaced technology, per Blocked, Risky or Plausible row, for no integration pair, and per unmet requirement. A failed write of the report in any stage now stops the run with exit `4` `write-failed`. The run keeps its inventory and working files in `_bmad-output/.skf-run/skf-verify-stack-<timestamp>/`, deleted when the run finishes and kept after a halt.
issues: [587, 593, 598]
