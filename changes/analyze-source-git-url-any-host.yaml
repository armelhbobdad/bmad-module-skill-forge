type: fixed
scope: skf-analyze-source
summary: |
  An `AN[auto]` run (forge-auto included) given an https clone URL on a host other than GitHub, GitLab or Bitbucket, such as a self-hosted `https://git.example.com/team/repo.git` or an Azure DevOps `/_git/` URL, now analyzes it as a repository, named after the repository. Before, any such URL was treated as a documentation site: the run wrote a docs-only brief named after the host and reported success, and an interactive run stopped saying the URL was a documentation URL. Any other `http` or `https` address on such a host is now checked with git first, by an `[auto]` run and an interactive one alike. An address git reads as a repository, which on most hosts is the repository's main page (a self-hosted GitLab, Gitea, Codeberg or GitHub Enterprise page), stops the run with a request for its clone URL, its address without `https://` or its SSH address. The run also stops when the server asks for credentials, such as a private repository's page, saying SKF reads no documentation behind a login, and when git gets no answer from the address in 20 seconds, asking for the repository's clone URL or SSH address, or a documentation URL that answers. A repository browser page git cannot read at that address, such as a Bitbucket Data Center `/projects/<p>/repos/<r>` page, a SourceForge or Launchpad code page or a link to a file or folder inside a repository, is still read as documentation: give its clone URL.
