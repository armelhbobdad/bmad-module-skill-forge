type: breaking
scope: all workflows, skf-forger
summary: |
  A headless run under `claude -p` no longer stops partway because a step left a subagent running when its turn ended. Under `claude -p` a run stops when the agent's turn ends, so a Test Skill run that started a subagent in the background and ended its turn exited `0` five minutes in, with no `SKF_TEST_RESULT_JSON` line and its `.test-skill.lock` left behind. Every workflow, and Ferris, now runs each subagent in the foreground, waits for every long-running command to exit, and never ends its turn while either still runs. `ccc index` runs in the foreground with the shell's longest timeout; a first Setup index that outlasts it is reported as a failed index, and the troubleshooting guide says to run `ccc index` in a terminal, then re-run Setup. The docs and every workflow's headless contract no longer tell callers to read a `-latest.json` result file to learn a run's outcome: a caller reads the run's own `SKF_*_RESULT_JSON` line, since a run that printed none has no result to read, whatever the process exit code (it was cut off, or could not write its result), and its `-latest.json` file may then describe an earlier run. Ferris halts a pipeline with `no-result` when a workflow in it printed no result line. Campaign fails a skill whose Create Skill run printed no line (`no-result`), and records an export whose Export Skill run printed none as failed with `no-result`, or with `result-unreadable` when its line cannot be read.
migration: |
  An automation that reads a `-latest.json` result file to learn a headless run's outcome reads the run's own `SKF_*_RESULT_JSON` line instead and treats a run that printed none as failed. A Campaign that relied on Create Skill finishing with no line, on an install missing the shared emitter, installs SKF again with `npx bmad-module-skill-forge install`.
