type: fixed
scope: skf-test-skill
summary: |
  Test Skill now compares a documented signature with a same-named function that no entry point exports when the skill cites that function's file for the name. The signature check used to read only the declarations the package's entry points export, so a skill that documents two functions sharing one name got the second one's correct forms reported as Critical `signature-mismatch` gaps against the first, which blocked the hard gate. The surface now lists such a declaration in `otherDeclarations`, and the signature plan adds it to the check's `candidates` beside the exported one, so a form matches when it matches either, and a mismatch found there is recorded at its file and line. It joins no count. For cognee, the lightweight `run_pipeline` that `from cognee.pipelines import run_pipeline` loads through a lazy re-export is now compared with its own declaration, not with the dataset orchestrator the `pipelines` namespace exports.
