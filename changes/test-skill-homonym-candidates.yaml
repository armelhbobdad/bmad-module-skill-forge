type: breaking
scope: skf-test-skill
summary: |
  Test Skill now compares a documented signature with the declaration its own citation names. The signature check compared every documented form of a name with the declarations the package's entry points export, so a skill that documents two functions sharing one name got the second one's correct forms reported as Critical `signature-mismatch` gaps against the first, which blocked the hard gate. The documented inventory now gives each form its place, `at` (`"<path>:<line>"`, a line of SKILL.md or a listed reference that writes the name), and validation refuses an inventory that leaves a form's place out. The signature plan reads the `[AST:]` and `[SRC:]` citations at that place (its line; the next non-blank line, unless that line writes the name or, in a fenced block, is a comment; for a form in a fenced block, the comment lines just above it and, when the block holds no other place of the name, a comment on the block's first non-blank line and the first non-blank line after the block, unless that line writes the name) and binds the form to the one declaration of its name they name, at its line or in a range that holds it (a citation with no line names every declaration in its file): an exported one, or a same-named one no entry point exports, which the surface now lists in `otherDeclarations`. A bound form is compared with that declaration alone, and its mismatch is recorded there; a form whose citations name no declaration, or two, is compared as before. For cognee, the lightweight `run_pipeline` that `from cognee.pipelines import run_pipeline` loads through a lazy re-export is compared with its own declaration once its form cites it, not with the dataset orchestrator the `pipelines` namespace exports. This can block a skill that passed: a form whose citation names one declaration no longer matches through another.
migration: |
  If a skill now stops at the hard gate on a form compared with the declaration its own citation names, correct the form, or the citation when it points at the wrong declaration, then run Test Skill again.
