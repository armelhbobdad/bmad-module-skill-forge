type: fixed
scope: skf-create-skill
summary: |
  On a Deep-tier run, Create Skill now keeps the documentation pages it fetched for a source skill's `doc_urls` in `_bmad-output/<skill>-docs/`, the folder its `<skill>-docs` QMD collection is indexed from. It used to delete that folder right after indexing, so the next `qmd update` on the machine left the collection with no files while `forge-tier.yaml` still listed it: Deep-tier searches of it found nothing, and every Deep-tier setup reported it as empty and advised a `qmd collection remove` that the skill's next Create Skill run undid. Below Deep tier, where Create Skill registers no collection, a source skill's folder is still removed once its pages are extracted, unless the skill is a whole-language reference. A collection that is already empty is refilled by the skill's next Deep-tier Create Skill run that fetches at least one of its documentation pages. Like a docs-only skill's folder, the kept folder stays when the skill is dropped or renamed.
