type: breaking
scope: skf-test-skill
summary: |
  When the threshold fallback accepts a run at the 80% floor (a score of 80% or more under a higher target, with no cap fired), Test Skill no longer writes `evidence-report-fallback.md` beside the test report. Its findings were the Gap Report again and its summary repeated the score, it had no run id in its name, and nothing read it. Instead, `build-result-context.py settle` adds a `### Threshold Fallback` subsection to the test report's Completeness Score section, right after the Result block (on a degraded run, the Access Degradation Notice still follows it): the attempted threshold, the achieved score, the accepted floor, the threshold source, the latest earlier test report beside this one (or none found) and a pointer to the Gap Report, which lists the run's gaps. The report frontmatter loses `evidenceReportPath`, the result file's `summary` loses `evidence_report_path`, and `settle` no longer takes `--evidence-report`. `threshold_fallback` and `original_threshold` are unchanged.
migration: |
  Read a fallback's details from the test report's Threshold Fallback subsection and its gaps from the Gap Report, and stop reading `evidenceReportPath` from the report frontmatter and `summary.evidence_report_path` from `skf-test-skill-result-latest.json`. An `evidence-report-fallback.md` an earlier run left in a version folder still counts as SKF's file and can be deleted.
