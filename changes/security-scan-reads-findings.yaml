type: changed
scope: skf-quick-skill, skf-create-skill, skf-update-skill, skf-create-stack-skill
summary: |
  Quick Skill, Create Skill, Update Skill and Create Stack Skill now report what the security scan finds. skill-check 1.2.0 runs the scanner without `--ci`, writes its `--format json` output before the scan starts and counts as findings only codes like `[E001]`, which snyk-agent-scan 0.6 never prints for a risk, so a scan that found a prompt-injection risk read `pass`, and so did one whose analysis failed on a rejected token (HTTP 401) or the daily limit (HTTP 429). The four workflows now run skill-check with `--no-security-scan` and run the scan through the new `skf-security-scan.py`, which, when `SNYK_TOKEN` is set, runs `uvx snyk-agent-scan@0.6.11 --json --skills <package>` and reads the scanner's own JSON report. Each risk it reports is recorded as an advisory warning with its score and evidence, and `security_result` reads `warn`. `pass` now means the scanner analysed the package and reported no risk. An analysis error, a scanner that fails or runs past 110 seconds, or no `uvx` reads `skipped` with the reason. The scan now runs whether or not skill-check is available, so with `SNYK_TOKEN` set the skill package is sent to Snyk's analysis server in that case too. Create Stack Skill's `skill-check-unavailable` warning no longer says the scan was skipped, Create Skill no longer suggests putting `SNYK_TOKEN` in `.env`, which neither tool reads, and the CLI tool report lists `snyk-agent-scan` as `optional, runs through uvx`.
issues: [892]
