type: fixed
scope: installer
summary: |
  The tool check that `install`, `update` and `status` run no longer runs tessl. Since v3.0.0 it ran `tessl --version`, which could start tessl's own update check and update download and, on a tessl that had never run, accepted tessl's Terms and saved tessl's default preferences, usage sharing on, in `~/.tessl/preferences.json` without asking. `tessl config set shareUsageData false` turns usage sharing off. The check now reads tessl's version from the name of the binary tessl installs, `tessl-<version>-<platform>` in tessl's `versions` folder: the file `~/.local/bin/tessl` links to, which is also the one the npm and Homebrew `tessl` launchers run (their own package version can differ), or on Windows the file `tessl\bin\tessl.exe` was copied from. tessl no longer reads `installed, version unknown` when it is slow to start. A tessl installed with winget, or an npm or Homebrew tessl whose binary is not installed at `~/.local/bin/tessl` (`%LOCALAPPDATA%\tessl\bin\tessl.exe` on Windows), reads `installed, version unknown`.
