type: breaking
scope: skf-audit-skill, skf-test-skill, skf-verify-stack, skf-campaign
summary: |
  A template setting that names a missing file now stops the run in its first step or sooner, naming the setting and the path, and in Test Skill and Verify Stack so does a copy that lacks what the steps fill in. Audit Skill stops before its first question with the new halt reason `template-missing` (exit `3`) when `drift_report_template_path` names no readable file. Its envelope names `error.phase` `on-activation:template` and the template path. Test Skill checks `test_report_template_path` before any stage runs and stops with `input-invalid` when the file is missing or lacks its title line or a section heading, which it used to meet only after scoring, or lacks the `<!-- Populated by` comment under a section heading, which it used to accept. Verify Stack stops in its first step (`error.phase` `init:report-template`) with `resolution-failure` (exit `3`) when `report_template_path` names no readable file, and with `schema-violation` (exit `5`) when the report it creates from the copy fails the feasibility-report check, which it used to meet only at its last step, or has no table under `## Evidence Sources`, which it used to accept. Campaign checks `report_template_path` and `kickoff_template_path` as it starts and stops with exit `2` (`invalid-input`) on one that names no readable file, before Setup or a resume (`campaign status` skips the check); a bad report template used to surface only at the end. Campaign's `customize.toml` now ships its real defaults, `{forge_data_folder}/_campaign` and the bundled `templates/` files, and says a bare path resolves from the skill folder.
migration: |
  If Audit Skill stops with `template-missing` at `error.phase` `on-activation:template`, point `drift_report_template_path` in `_bmad/custom/skf-audit-skill.toml` or `.user.toml` at a readable copy, or reinstall SKF when it names the bundled `assets/drift-report-template.md`. If your `test_report_template_path` copy lacks the `<!-- Populated by` comment under one of its six section headings, copy that comment from the bundled `templates/test-report-template.md` under the heading, or Test Skill stops before any stage runs. If your Verify Stack `report_template_path` copy has no table under `## Evidence Sources`, copy the table's header and separator lines from the bundled `assets/feasibility-report-template.md` under that heading, or Verify Stack stops in its first step.
