type: fixed
scope: skf-create-skill, skf-test-skill, skf-update-skill, skf-audit-skill, skf-brief-skill, skf-analyze-source
summary: |
  The recipe runner (`skf-extract-public-api.py --mode full`) now counts a TS/JS export whose name starts with `_`, as the Source API Surface Definition and quick mode do. Such a name a package's entry points export, such as storybook's `__definePreview`, which `export * from './preview'` passes on, is now an export and a public name like any other: counted in `exports_public_api` (and, in scope, `effective_denominator`), an extraction gap when no recipe found it, and a signature Test Skill checks. Before, every `_` name was dropped, so such a name was neither public, internal nor a gap, and a wrong documented signature for it went unchecked. Python, Rust and Dart `_` names stay private: Python's by the Source API Surface Definition, Rust's because such an item is hidden (a `#[doc(hidden)] pub mod __private`) or unnamed (`pub const _`), and Dart's because the language keeps it private to its library. A skill that does not document a TS/JS `_` export can now show it as a missing export in Test Skill, Analyze Source and Brief Skill read it among the runner's exports, and Update Skill and Audit Skill take it from the runner rather than reading it by eye. Denominator mode (`--mode denominator`) now counts in `exports_internal` a `_` export of any other language too (TS/JS, Java, Kotlin and the rest) when no public name has it. Quick mode is unchanged.
