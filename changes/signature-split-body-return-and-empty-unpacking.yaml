type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature rules now give one reading for two cases judges read either way. In the split-body cross-check, a return type one documented form writes that leaves out a member of the other form's union disagrees with it, whichever form writes it, so `-> Node` against `-> Node | None` is a High `split-body-mismatch` gap, while a parameter type that names some of the members of the other form's union, such as `node_name: list[str]` against `node_name: list[str] | None = None`, still agrees. In a Python call, a `*items` argument with no parameter left to pass (none a caller may pass by position from its position on, and no `*args`), or a `**mapping` argument with none left that a caller may pass by name and no `**kwargs`, passes arguments the declaration does not take, and a parameter a literal, variable or `name=value` argument of the call already passes is not left. So a documented `f(*items)` against `def f()`, or `f(a, **options)` against `def f(a)`, is a Critical `signature-mismatch` gap even though the call runs when its unpacking is empty, and a High `split-body-mismatch` gap against another documented form that writes that declaration, while `Settings(**config)` still matches `__init__(self, host, port)`. Before, one judge passed such a skill and another stopped it, so a skill some runs passed can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `split-body-mismatch` gap, follow the gap's remediation: edit the file it names so it writes the return type or call of the form it says to take, whether or not a source settled it. If it stops on a `signature-mismatch` gap for a call whose `*items` or `**mapping` the declaration cannot take, drop that unpacking from the call. Then run Test Skill again.
