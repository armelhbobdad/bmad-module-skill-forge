type: changed
scope: skf-create-stack-skill
summary: |
  Stack Skill's code mode now counts the files that import each dependency with the shared `skf-count-imports.py` helper instead of a hand-run grep, so the count matches on module boundaries and reads a distribution name as its import name: `react-dom` no longer counts as `react`, and `PyYAML` counts the files that import `yaml`. A ranking, the recommended scope and the stack version (taken from the most imported library) can differ from an earlier run where the old count was wrong. A dependency the helper cannot count with confidence (a guessed import name that matches no file, no import name, or an ecosystem it has no import rules for) is listed below the threshold with its reason instead of counting 0, and a headless run keeps the same recommended scope an interactive `C` accepts (the runtime libraries imported by 2 or more files). The detection summary now splits runtime and dev-only dependencies from the scanner's own data, the no-manifest message lists the manifest files the scanner looks for (no longer `*.csproj`), and code-mode integration pairs take their co-import files and lines from the same counts, through `skf-pair-intersect.py intersect --counts`, instead of a second grep. At Forge+ and Deep, CCC semantic search no longer adds co-import files to a pair, since the counts already hold every file that imports both libraries: it only picks the files that best show each integration, so no integration is labelled `ccc-augmented` any more.
