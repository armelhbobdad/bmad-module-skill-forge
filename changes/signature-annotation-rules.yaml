type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature judge now compares only what a documented form writes. A call example (`RecursiveSplitter()`, `embed(text, model=m)`) is compared as a call, so leaving out an optional parameter is no difference, an ellipsis (`(...)`, `(tasks, data, ...)`) claims nothing about the parameters it stands for, and a list of bare names (`connect(host, port)`) does not claim to be complete; a form that writes a type or a default still does, so an optional parameter it leaves out stays an `omitted-optional` difference. Optionality is stated only by a default, a `?` or an optional marker, never by a type, so a parameter list that states it for no parameter has its optionality left uncompared: `connect(host, port)` and `connect(host: str, port: int)` both match `def connect(host: str, port: int = 5432)`. A default's value is not compared, only the optionality it marks. A parameter written without a type is not compared on type (bare `*args` matches `*args: P.args`), the names of `*args` and `**kwargs` are not compared, and parameters after `*` are compared by name rather than order. A return type the form does not state, a type the source leaves unannotated and type arguments either side leaves out (`dict` against `dict[str, Any]`) are not compared, so a function documented with no parameters and no return type no longer raises a Critical `signature-mismatch` gap against `-> None`; a TypeScript or JavaScript parameter with a literal default (`pageSize = 20`) still has that literal's type. A blank `return_type` states none, while Go's result list and the type before a C, C++ or Java name count as a stated return type. A documented parameter type that names some members of the source's union is no mismatch, since calls that follow it are valid, and neither is a keyword-only `*` the form adds. Equivalent spellings are no mismatch: `Optional[X]`, `Union[X, None]` and `X | None`, a union's members in any order, `List[X]` and `list[X]`, a `typing.` prefix, `Array<T>` and `T[]`, a type alias against the type it names, and type variables renamed consistently. A Python `*args` or `**kwargs` counts as optional, like a TypeScript rest parameter, but in a language without keyword arguments an optional parameter left out before one the form writes is a mismatch, since it shifts the caller's positions. A documented return type that matches what the function's body demonstrably returns, where the declared annotation says otherwise, is no longer a Critical `signature-mismatch` gap, since the skill documents what callers get: the judge tags it `annotation-contradicted` with the body line that returns it, and Test Skill's scoring script checks that the documented signature states a return type and writes the source's parameters, and that the line falls between the declaration and the next one and, read from the local source the script is now given with `--source-root`, starts with `return` (or is a one-line declaration's own expression body). It then records an Info `observation` titled `Annotation contradicted: {name}` that blocks nothing and asks for no change to the skill, only that the annotation be reported upstream; a case whose facts do not check stays a Critical gap, and where no such line exists (a Rust tail expression, say) or the judge cannot name it, the declaration decides. The coherence check's reference judge and the split-body Source, which tag nothing, read such a return type as agreeing with the source. Once a parameter list marks any parameter optional, a parameter written without a default, a `?` or a marker is read as required, so a skill a lenient judge passed on such a list can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap whose documented parameter list marks some parameters optional and not others, write the default or `?` the source declares on each optional parameter, then run Test Skill again.
