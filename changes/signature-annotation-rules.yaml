type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature judge now compares only what a documented form writes. Optionality is stated only by a default, a `?` or an optional marker, never by a type, so a parameter list that states it for no parameter has its optionality left uncompared: `connect(host, port)` and `connect(host: str, port: int)` both match `def connect(host: str, port: int = 5432)`. Once any parameter states it, one written without a default, a `?` or a marker is read as required. A default's value is not compared, only the optionality it marks. A parameter written without a type is not compared on type (bare `*args` matches `*args: P.args`), the names of `*args` and `**kwargs` are not compared, and parameters after `*` are compared by name rather than order. A return type the form does not state, a type the source leaves unannotated and type arguments either side leaves out (`dict` against `dict[str, Any]`) are not compared, so a function documented with no parameters and no return type no longer raises a Critical `signature-mismatch` gap against `-> None`; a TypeScript or JavaScript parameter with a literal default (`pageSize = 20`) still has that literal's type. A blank `return_type` states none, while Go's result list and the type before a C, C++ or Java name count as a stated return type. Equivalent spellings are no mismatch: `Optional[X]`, `Union[X, None]` and `X | None`, a union's members in any order, `List[X]` and `list[X]`, a `typing.` prefix, `Array<T>` and `T[]`, a type alias against the type it names, and type variables renamed consistently. A Python `*args` or `**kwargs` counts as optional, like a TypeScript rest parameter, but in a language without keyword arguments an optional parameter left out before one the form writes is a mismatch, since it shifts the caller's positions. A documented type that matches what the function's body does but contradicts its declared annotation is a Critical mismatch, since the declaration decides, and the gap's Issue cites the body line, so the reader sees that the source contradicts itself; a skill a lenient judge passed on such a call can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate because a documented type matches the function's body but not its declared annotation, document the declared annotation (and report the source's annotation upstream), then run Test Skill again.
