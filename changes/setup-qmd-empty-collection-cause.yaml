type: fixed
scope: skf-setup
summary: |
  On Deep tier, setup now reads the folder of each registered QMD collection that holds no indexed files, with one `qmd collection show` for each of them and none for the other registered collections. The FORGE STATUS banner gives the ones whose folder is gone `qmd collection remove <name>` alone, keeps both routes for a folder that is still there (`qmd update` then `qmd embed -c <name>` when it holds files its pattern matches, `qmd collection remove <name>` when it holds none), gives no advice for a folder outside the project, since QMD's index is shared by every project on the machine, and keeps the `qmd collection show` advice when the folder could not be read. Under `--headless` or `--quiet`, each `qmd_collection_empty` warning in the `SKF_SETUP_RESULT_JSON` envelope names its cause: `(folder missing)`, `(folder present)`, `(folder in another project)` or `(folder unknown)`. Setup still removes none of them.
