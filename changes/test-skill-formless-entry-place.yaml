type: fixed
scope: skf-test-skill
summary: |
  Test Skill's inventory contract now gives a name the skill writes with no form one place. An entry with no compared form, such as a type or class entry, gives its place as `at`, as one with a form does (a `method` and a form that writes only a return type aside), so a stale name's gap cites the line that documents it on every run: oms-uitripled's `UILibraryContextValue`, written only as `type UILibraryContextValue = {` in a fence, cited `references/setup.md:90` on one run and a bare `SKILL.md` on the next, depending on whether the reader added an `at` the contract did not ask for. A place that writes a name with no form, members or fields, such as a mention, an import or a heading, now gives no entry when another place gives the name one, unless the inventory floor gives that place, and of several such places of a name the skill documents, where no other place gives it an entry, the first alone gives one, so readers no longer list such places differently. This does not change which names count as documented. The contract's example now shows a class and a type entry with an `at`.
