type: lead
summary: |
  SKF 12.0.0 has three breaking changes. The health check now searches with `gh issue list`: with `health_check_autosubmit: true`, allow it where your rules allowed `gh search issues`, or headless runs queue findings locally instead of filing them. `install` and `update` now exit 1, changing nothing, when a selected IDE's skills folder has a `shared` entry holding anything SKF cannot tell it installed: move or rename your own `shared` skill, or delete the leftover files listed. A docs-only update that could compare none of its documents now stops `blocked`, not `no-changes`: re-run once they are reachable, or re-create the skill. Expect a one-time new version from a docs-only skill's first update after an unhashed document becomes reachable, and from an update that, with the source unchanged, restates in SKILL.md the pitfalls of a joined `|gotchas:` value a later export would drop.
