type: breaking
scope: skf-verify-stack
summary: |
  Verify Stack's verdicts and report now keep the shared feasibility-report contract. A run that finds no integration pair between two or more covered technologies reports `CONDITIONALLY_FEASIBLE` instead of `FEASIBLE` (report `overallVerdict`, envelope `overall_verdict`), with a recommendation to describe the integrations in prose, because they were never checked. A pair is capped at `Plausible` only when neither skill cites the other literally: protocol tokens inferred from prose no longer cap a pair at `Plausible`, and a pair whose skills name no protocol is no longer flagged `Risky` (conflicting protocols with no adapter still are), so a pair with a literal citation can reach `Verified`, and a re-run can change per-pair and overall verdicts. `--previous-report` naming the `-latest` report copy (or a link to it) now stops a headless run with exit `5` `previous-report-collision`, and an interactive run asks for another path, because the run overwrites that file before it compares; before, the run was compared with itself and every finding came out unchanged. `skf-report-delta.py` compares each skill's evidence tier (`T1`, `T1-low`, `T2`, `T3`), which the report now records in a table under `## Evidence Sources`, and exits `2` with code `UNKNOWN_TIER` on any other tier token, a forge tier such as `Deep` included, instead of skipping it. The delta now reads both reports' coverage and verdict tables itself, so a previous report it cannot read is named in the delta section instead of compared. `skf-verdict-rollup.py` takes a required `coveredCount` in place of `continuedPastZeroState`. The project slug in the report file name comes from `skf-validate-feasibility-report.py`, the rule Refine Architecture and Stack Skill use to find the report, so a name with accents or punctuation can get a new slug.
migration: |
  Re-run `@Ferris VS` to refresh your feasibility reports. Pass a timestamped report from an earlier run as `--previous-report`, not the `-latest` copy, or leave the flag out to compare against the newest earlier report. A pipeline that proceeds only on `FEASIBLE` now needs the architecture document to describe in prose how its technologies interact. A caller of `skf-verdict-rollup.py` passes `coveredCount` (the coverage tally's `covered_count`) instead of `continuedPastZeroState`, and a caller of `skf-report-delta.py` passes evidence tiers, not forge tiers.
