type: added
scope: skf-campaign
summary: |
  Campaign now records what its Export stage did for each skill. After each `skf-export-skill` call, Export writes the outcome to `_campaign-state.yaml` through the new `campaign-state.py set-skill --export exported|failed` (with `--export-halt-reason` and `--export-exit-code` for a failure), as a skill's new optional `export` field. The headless `SKF_CAMPAIGN_RESULT_JSON` line gains two optional fields, `skills_exported` (the skills Export exported) and `export_failures` (each skill whose export failed, with its `halt_reason` and `exit_code`), both null when the Export stage did not run, and the Export Gate table of `campaign-report.md` gains an Export column. A failed export still ends the campaign with `status` `success`, so a CI job that needs every skill exported checks `export_failures`; before, the only trace of a failed export was a line in the decision log, and the report and the envelope showed only the gate verdicts.
