type: fixed
scope: skf-setup
summary: |
  On Deep tier, setup no longer counts a registered QMD collection that holds no indexed files as healthy. QMD lists such a collection with `Files: 0` when no file in its folder matches its pattern, for example after that folder was deleted, and it answers no search. The FORGE STATUS banner now names these collections and says how to clear each one: `qmd collection show <name>` gives its folder; when that folder is gone or holds no file its pattern matches, re-indexing cannot refill the collection, so `qmd collection remove <name>` removes it and the next Deep-tier setup drops its registry entry; only when the folder does hold such files do `qmd update`, which re-indexes every collection on the machine, and then `qmd embed -c <name>` fill it. The banner no longer calls the registry empty when it holds only such collections. Under `--headless` or `--quiet`, the `SKF_SETUP_RESULT_JSON` envelope's `warnings` lists each one as `qmd_collection_empty: <name>`. Setup removes none of them.
