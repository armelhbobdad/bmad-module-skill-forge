type: fixed
scope: skf-setup
summary: |
  On Deep tier, setup no longer counts a registered QMD collection that holds no indexed files as healthy. QMD lists such a collection with `Files: 0` when no file in its folder matches its pattern, for example after that folder was deleted, and it answers no search. The FORGE STATUS banner now names these collections on their own line with the commands that index what their folders hold, `qmd update` and then `qmd embed`, and does not call the registry empty when it holds only such collections. Under `--headless` or `--quiet`, the `SKF_SETUP_RESULT_JSON` envelope's `warnings` lists each one as `qmd_collection_empty: <name>`. Setup removes none of them.
issues: [1245]
