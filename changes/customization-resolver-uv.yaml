type: breaking
scope: all workflows, skf-forger
summary: |
  Every workflow now runs BMad core's customization resolver through `uv run`, with `--project-root`, instead of a bare `python3`. Customization overrides in `_bmad/custom/<skill>.toml` and `_bmad/custom/<skill>.user.toml` therefore start to apply where the resolver used to fail silently (a bare `python3` missing or older than 3.11), so a setting such as `forbid_purge_in_headless` now takes effect. When the resolver still cannot run, for example in a project without the BMAD Method installer's customization script, the run prints `[activation/warn] customization_resolver_unavailable: <reason>`, uses the bundled `customize.toml` alone, and reports `customization_resolver_unavailable: <reason>` among the run's warnings: in the result envelope and result file, or in Campaign's decision log. Ferris (`skf-forger`) runs the same resolver with `--key agent`, so `_bmad/custom/skf-forger.toml` and `_bmad/custom/skf-forger.user.toml` can give him `activation_steps_prepend`, `persistent_facts` and `activation_steps_append` (his roster values stay as shipped); when it cannot run he opens his greeting with the same warning line.
migration: |
  Review `_bmad/custom/<skill>.toml` and `_bmad/custom/<skill>.user.toml`, since their settings now apply, and install `uv` if runs warn `customization_resolver_unavailable`.
