type: fixed
scope: skf-test-skill
summary: |
  Test Skill now compares the documented signature of a documented extra, a name the skill documents that no entry point exports but the extraction records in a scoped-in file (the recipe runner leaves out a Python name with a leading `_` and a TS or JS declaration its module does not export). The signature plan covered only the names the entry points export, so on oms-cocoindex 1.0.0 it checked 42 of the 67 documented signatures and Signature Accuracy read 100%, while no judge read the 25 extras' declarations, such as `detect_code_language`'s, and a Critical mismatch among them could not fail the hard gate. `load-coverage-inputs.py surface` now writes each such declaration under a new `internalDeclarations` key, which adds no name to a set and nothing to Export Coverage or Type Coverage. `score-signatures.py plan` files the extra's check at that declaration, and `score` counts it in Signature Accuracy like any other documented signature, so a Critical mismatch adds a Critical `signature-mismatch` gap at the declaration. Each such declaration also ends the span of the declaration before it in its file, as an exported one does, so for an exported name too a citation past it no longer binds a form to that earlier declaration, and an `annotation-contradicted` mismatch whose `evidence_line` lies past it is graded Critical, not Info. Type Coverage is unchanged, and the extra's Info observation now says its signature was compared with its declaration in the source.
