type: breaking
scope: skf-test-skill
summary: |
  Test Skill now compares the documented signature of a documented extra, a name the skill documents that no entry point exports but the extraction records in a scoped-in file (the recipe runner leaves out a Python name with a leading `_` and a TS or JS declaration its module does not export). The signature plan covered only the names the entry points export, so on oms-cocoindex 1.0.0 it checked 42 of the 67 documented signatures and Signature Accuracy read 100%, while no judge read the 25 extras' declarations, such as `detect_code_language`'s, and a Critical mismatch among them could not fail the hard gate. `load-coverage-inputs.py surface` now writes each such declaration under a new `internalDeclarations` key, which adds no name to a set and nothing to Export Coverage or Type Coverage. It leaves out a declaration where the stale-documentation lookup never looks, such as a test helper in `tests/` or `conftest.py`, or a file in a `scripts/` or `examples/` folder right below the package root, unless the provenance map cites that file for the name: a name declared only there stays stale documentation, and its signature is not compared there. `score-signatures.py plan` files the extra's check at that declaration, and `score` counts it in Signature Accuracy like any other documented signature, so a Critical mismatch adds a Critical `signature-mismatch` gap at the declaration. A method form the skill documents on such an extra, under `{owner}.{name}`, is compared and counted the same way, its check placed at the extra's declaration. When two files of the skill document the extra, or a method of it, differently, the split-body gap now cites the side that declaration contradicts, where it said no source settled the pair and could ask to edit the side that agrees with the source. Each such declaration also ends the span of the declaration before it in its file, as an exported one does, so for an exported name too a citation past it no longer binds a form to that earlier declaration, and an `annotation-contradicted` mismatch whose `evidence_line` lies past it is graded Critical, not Info. Forms that were never compared now are, so a skill that passed Test Skill can now stop at its hard gate. Type Coverage is unchanged, and the extra's Info observation now says its signature was compared with its declaration in the source.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap, such as one at a documented extra's declaration, first check that the gap's Source is the declaration the skill documents and not an unrelated internal helper of the same bare name. If it is such a helper, add an `[AST:]` or `[SRC:]` citation of the right file on the line that documents the name, so the next test compares that declaration, instead of letting `@Ferris US <skill> --from-test-report` rewrite the form from the helper. Otherwise correct the form the gap quotes as `documented_sig`, then run Test Skill again.
