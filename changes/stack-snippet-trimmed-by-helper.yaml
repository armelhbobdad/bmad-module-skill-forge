type: added
scope: skf-create-stack-skill
summary: |
  Stack Skill now writes and trims its `context-snippet.md` with the new `skf-render-stack-metadata.py snippet` subcommand, instead of trimming it by hand and measuring it after each cut. The run writes only the gotchas text; the helper builds the root, `|IMPORTANT:`, `|stack:` and `|integrations:` lines from the extraction bundle (libraries by import count, or export count in compose mode, pairs by co-import file count, `|integrations: none` for a stack with no pair), and while the snippet is above its token budget (`--budget`, 120 by default, counted as `len(text)//4`) it drops the gotchas line, strips the library versions, keeps the top 8 libraries and then the top 5 pairs, each cut list ending `, ...+N more`. It prints `tokens`, `trims_applied` and `over_budget`, and the run records `snippet-over-budget` when the last cut still leaves it above the budget. `skf-validate-output.py --skill-type stack` now reports a context snippet with no `|stack:` or `|integrations:` line as a `medium` issue, and takes `--forge-version <dir>`, which checks that the forge data version folder holds `provenance-map.json` and `evidence-report.md`, and `--active-link <skill_group> --expected-version <version>`, which checks that `<skill_group>/active` resolves to that version (a Windows junction included); each miss is a `medium` issue under `validation.stack_workspace`. The validation step passes these flags and records each workspace or link issue as an error, so it no longer checks those files and the link by hand unless the validator is missing. A house-style copy of the stack template no longer shapes the context snippet's lines: the helper writes them in the bundled form, and only a run whose installed helper has no `snippet` writes them from the copy.
