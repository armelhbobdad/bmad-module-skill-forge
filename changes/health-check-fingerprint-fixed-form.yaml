type: fixed
scope: all workflows
summary: |
  A health-check finding now gets one fingerprint whether SKF runs from a checkout, a CLI install or a plugin. The model typed the workflow and the step file the fingerprint hashes, so one defect could get several fingerprints: a doubled `src/skf-skf-` prefix, an installed path in place of the checkout one, `references/<file>.md`, a display name for the workflow. `skf-health-check-seen.py fingerprint` now takes the workflow as its folder name, one of the 15 that end in the health check and the one whose `references/` folder holds the step file, writes the step file as `src/<workflow>/references/<file>.md` from any path to it, and exits 2 for a file that is not in that folder, so the issue records both fields in that form. A finding filed earlier under another step-file form gets a new fingerprint. `lookup --repo` treats a seen-cache record of an issue on another repository as no record, so a project that files findings elsewhere is neither suppressed nor linked by it, and gh is never asked about that issue. The SKF version in an issue's Environment table now comes from the helper's new `version` subcommand, which reads the install the helper belongs to, so it is now found in a checkout and a plugin install as well as a CLI install; a bmad-method custom-module install, with neither `VERSION` nor a `package.json` named `bmad-module-skill-forge` beside `_bmad/skf`, still reports `N/A`. A plugin install, with neither `_bmad/skf/` nor `src/` in the project, now finds the helper from the SKF module root, so its findings get fingerprints and are submitted on your approval as a CLI install's are, instead of being saved to the local queue with the fingerprint `N/A`. A fixed finding is now recorded with `record --action resolved`, an issue or pull request URL or an empty one, instead of a hand edit of `~/.skf/health-check-seen.json`.
