type: fixed
scope: skf-create-skill, skf-test-skill, skf-update-skill, skf-audit-skill, skf-brief-skill, skf-analyze-source
summary: |
  When several package entry points export one name and the first of them by path is out of scope, the recipe runner (`skf-extract-public-api.py --mode full`) now records the name where an in-scope entry point defines it, so `entry_point_diff.public` carries the in-scope file and line, Test Skill finds the name's kind and signature line there, and `effective_denominator` counts it. In a storybook skill whose brief scopes in only the `react-vite` framework, `defineMain` was recorded at the Angular framework's file, out of scope, with no kind or signature line. An entry point's own explicit export still wins over a name its `export *` passes on. A name whose only exporting entry point is out of scope, defined in a file out of scope, is now an `entry_point_diff.outside_scope` name, outside `effective_denominator`, even when a recipe found the same name in another file, which is another definition; before, it was neither an extraction gap nor outside scope. Brief Skill's tier A candidates leave out the files of `outside_scope` names, and Analyze Source reads the same public names and counts. The first Audit Skill re-index after the upgrade can list as added the names the runner now reads at their in-scope file.
