type: changed
scope: skf-test-skill
summary: |
  Test Skill now records a documented name outside the coverage surface that the source still declares as a documented extra: an Info `observation` gap titled `Documented extra: {name}` at the line that declares it, which Update Skill's `--from-test-report` leaves alone. Such a name used to be a Medium `stale-documentation` gap that Update Skill routed and could delete. Only a run of a Python or TS/JS source finds one, at the Forge, Forge+ or Deep tier, with `analysis_confidence` `full`, `workspaceDrift` not `overridden`, a provenance map and a coverage surface that a complete extraction built: `classify-stale` in `skf-verify-provenance-completeness.py` now adds a `defined_at` to each name it does not find fabricated, the line of a Python or TS/JS file that declares the name at column 0 (an import, a re-export, a `require(...)` or `import(...)` binding and an indented local never count, and a module or package named after the name declares it). It reads the files the name's provenance entries cite, then the package those entries lie in, leaving out tests, vendored copies, installed and built output, `docs`, `examples` and `benchmarks`, and lists every file there that declares the name in a new `declared_in`. Exactly one file must declare it, or, when several do, Test Skill takes the one that the skill's own `[AST:]` or `[SRC:]` citations name on a line that names it. A fabricated signature stays a Critical gap, and a name the source no longer declares, one that several files declare when the skill cites none or more than one of them, a dotted name, a name the brief scopes out (`excluded.outsideScope`) and every stale name of any other run stay Medium `stale-documentation` gaps. A name the skill documents from a Python sub-package that the standard barrel leaves out (`excluded.nestedEntries`) is a documented extra too while the source still declares it, and signature scoring still compares its documented signature.
