type: fixed
scope: skf-campaign
summary: |
  When Create Stack Skill, Verify Stack or Refine Architecture printed no result line during a campaign, Campaign recorded the stage the same way as one it skipped on purpose. It now records the run through the new `campaign-state.py set-campaign --no-result <field>`, with the halt reason `no-result`: the stage summary shows `failed (no-result)` and the decision log names the missing line and the exit code, while the state still holds null for the field, as for a skip. Campaign also reads the line one of these runs prints on stderr when it halts, so a halt keeps its own halt reason instead of counting as no line. A stage skipped on purpose (no skill to compose, no architecture document) is still shown as skipped, and the campaign still goes on.
