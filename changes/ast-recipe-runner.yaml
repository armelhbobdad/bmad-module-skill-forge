type: fixed
scope: skf-create-skill
summary: |
  At Forge, Forge+ and Deep tiers, Create Skill now extracts a source in a language the ast-grep recipes read (Python, JavaScript or TypeScript with `.vue` files, Rust or Go) through one script, `skf-extract-public-api.py --mode full`, which runs every recipe over the files in scope and records each export's file, line, recipe and node kind, instead of the model running each recipe, applying the brief's globs, merging the matches and copying node kinds by hand, so every run records the same exports and lines. A brief in another language, such as Java, Kotlin, C#, Ruby, Swift or PHP, is extracted by source reading (T1-low), as at Quick tier. Before, extraction followed an outdated copy of the extraction protocol that sent a scope of 100 files or fewer to `find_code` patterns, which also return methods, nested definitions and private names, and cited a decorated class at its decorator line. `**` in `scope.include` and `scope.exclude` now also matches no folder at all, as it already did in the authoritative-files scan (`src/**/*.ts` matches `src/index.ts`, and `**/test_*` leaves out a top-level `test_x.py`), so a new run can put a different set of files, and of exports, in scope than an earlier one. `exports_public_api`, `exports_internal` and `effective_denominator` in `metadata.json` come from the same script's reading of the package's entry points, and a recipe that reaches its head cap is reported in the extraction summary and the evidence report instead of dropping exports silently. At validation, the provenance verifier's `fix` rewrites mismatched citation prefixes and moves the source lines that have one answer, and a node kind to repair comes from the verifier's `kind-at` lookup.
