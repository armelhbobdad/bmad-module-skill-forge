type: fixed
scope: skf-update-skill
summary: |
  Update Skill's `--from-test-report` repair now says why it could not check a new or modified export the provenance map already holds, and what to fix. When the map holds several entries of the export's name, or the spot-check of its entry ends `unknown` or `missing` (the entry's file is gone), the repair leaves its entries as they were, as before, and its `provenance:` warning now gives the cause of an `unknown`, such as `ambiguous`, `no-definition`, `several-definitions` or `unchecked-language`. For a gap of a severity other than Medium, Low or Info, the warning also names the gap and the one fix a re-run acts on: fix the entry by hand (its `source_file` and `source_line`), or, for several entries of the name, give the gap a `file:line` Source at the definition when that file holds only one of them. Before, the warning gave only the export and the outcome, while the gap-driven step said every such gap is read from the source or halts the run; it now says these entries stay unchanged, with that warning. Each verification record `skf-build-change-manifest.py gap-records` writes now carries its `gap_id`, and an `unknown` one its cause in `unknown_reason`.
