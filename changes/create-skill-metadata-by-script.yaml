type: changed
scope: skf-create-skill
summary: |
  Create Skill now writes `metadata.json` through `skf-extraction-inventory.py metadata` instead of typing it field by field. `generation_date` is a real UTC time to the second, `description` is read from the staged `SKILL.md`, `tool_versions.skf` is read from the installed module, and `exports[]` always lists the extraction inventory's exports less those marked `internal: true` or `public: false`, each name once (a docs-only skill lists its documentation items, a reference app none). `tool_versions.ast_grep` and `ast_node_count` come from the ast-grep run: the recipe runner's version and match count, or, when the recipes ran without the runner, the number of exports ast-grep matched and the version `ast-grep --version` gives (`unknown`, with a warning, when there is none); `tool_versions.ast_grep` is null when ast-grep did not run. The run only sends the fields it decides: the version, the language, the source location and the QMD version.
prs: [765]
