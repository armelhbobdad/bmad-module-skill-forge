type: added
scope: skf-forger
summary: |
  Ferris now keeps a pipeline's state on disk as it runs: a journal, `pipeline-journal.json`, in the run's own folder under `_bmad-output/.skf-run/`, written when the chain starts and after every workflow, with the plan and its bracket values, the alias, the arguments and what each workflow hands the next. When a pipeline stops, its summary names the next action, and the next time you start Ferris he offers it: after an interruption or an error, to pick the chain up at the step it stopped on with that plan, so a resumed `forge-auto` still tests at 90 and skips no step; after a quality halt, its repair route instead, such as `US <name> --from-test-report` and then `TS` and `EX` at the recorded threshold after a `FAIL`. The offer goes away once you test or export that skill yourself, another pipeline records its result, or you ask Ferris to drop it, and `WS` shows it as the one next action for that skill. `pipeline-result-latest.json` keeps its fields and its `summary.status` values, and gains `run_id`, `summary.alias` and `summary.steps`, one entry per step of the plan in a fixed shape; a chain whose journal step fails still writes it. Ferris also runs a code, alias or chain given with the invocation at once, such as `@Ferris TS cocoindex`, instead of first showing the menu, and a start with `--headless` that names nothing to run stops with the form to use instead of ending at the menu.
