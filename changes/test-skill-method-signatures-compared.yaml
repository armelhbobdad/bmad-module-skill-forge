type: breaking
scope: skf-test-skill, skf-update-skill
summary: |
  Test Skill now compares each method form the skill documents (an inventory `method` entry that names its `owner`) with the member of that name its owner declares in the source, or a base class there, and counts it in Signature Accuracy. Before, no method form was compared, so a wrong one passed, even one written in a single file where no split-body pair could catch it. A method is checked only when the source surface records its owner, under the name `{owner}.{name}`, never mixed with a function of the same name, and its gap is titled `Signature mismatch: {owner}.{name}`. A wrong method form now raises a Critical `signature-mismatch` gap, so a skill that passed Test Skill can now stop at its hard gate. A member that no declaration in the source tree gives the owner, such as one inherited from another package's class, is left uncompared and counts as matching. Update Skill's `--from-test-report` run does not repair such a gap, since a method is no export of the provenance map: it lists the gap as not repaired, with the reason, and writes nothing for it.
migration: |
  For a skill that now stops at the hard gate on such a gap, correct by hand the method form the gap quotes to the signature its Source cites, then run Test Skill again.
