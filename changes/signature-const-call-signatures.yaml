type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature rules now say that a const annotated with an interface or object type literal that writes call signatures, such as storybook's `export const actions: ActionsFunction = (...args: any[]) => ...`, declares each call signature that type has, as a const annotated with a function type declares that type's parameters, and that several of them are one overload set whose implementation is the const's value. A form that matches any of them, such as `actions` documented as `(handlerMap: Record<T, string>, options?: ActionOptions) => ActionsMap<T>`, the first of `ActionsFunction`'s call signatures, is therefore no mismatch; before, a judge that compared it with the arrow's own `(...args: any[])` could raise a Critical `signature-mismatch` gap on that form and fail the hard gate, while another judge passed the same skill. For such a const whose type has one call signature, a form that matches only the arrow's own list is now compared with that signature, and one that differs from it in more than its parameter names, such as one that leaves out a parameter the signature requires, can be a Critical gap, so a skill some runs passed can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap over a const annotated with an interface or object type literal that writes call signatures, write the form as one of those call signatures takes it, as the gap's `source_sig` gives it, then run Test Skill again.
issues: [1085]
