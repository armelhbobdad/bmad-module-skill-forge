type: breaking
scope: skf-drop-skill
summary: |
  When Drop Skill cannot write the export manifest, it now stops with exit `4` and `manifest-write-failed` in every mode, before it deletes or rebuilds anything, and writes no result file. Before, it went on to report "Drop operation complete.", recorded `status: "success"` in `drop-skill-result-latest.json` and exited `0`, and a headless run printed a success envelope after the error one. A missing `skf-manifest-ops.py` or `skf-rebuild-managed-sections.py` now stops the run with `write-failed` (`error.phase` `on-activation:helpers`) before its first question, where it used to stop later with `manifest-write-failed` (step 2) or `context-rebuild-failed` (step 1); a missing `skf-emit-result-envelope.py`, which Drop Skill did not use before, stops it the same way. Drop Skill now keeps its envelope payloads in a run folder under `_bmad-output/.skf-run/`, deleted when the run ends without an error and kept after a HALT, so a run that cannot create it stops with exit `4` and `write-failed` (`error.phase` `on-activation:run-folder`) where it used to go on. The `SKF_DROP_SKILL_RESULT_JSON` envelope and the result files now come from the shared emitter, checked against the new `skf-drop-skill-result-envelope.v1.json` schema: the per-run file name carries the UTC time read from the clock, the envelope adds `result_path`, `error` and, when the run recorded one, `warnings`, the result file adds `run_id`, `warnings` and the `headless_decisions` a headless run took (the drop mode and the confirmation), and a headless `--dry-run` of a purge lists the folders it would delete in `would_delete`, next to `forge_left_in_place`. `on_complete` is skipped when the result record could not be written (`result_path` is `null`, and `warnings` says why).
migration: |
  Treat exit `4` with `manifest-write-failed` as a failed drop: nothing changed, so fix the cause (permissions, a full disk, or a manifest another process changed) and run the drop again. Keep `_bmad-output/` writable, and match `write-failed` where you matched `context-rebuild-failed` or `manifest-write-failed` for a missing script; when `write-failed` names a missing script, re-install SKF. A pipeline that reads the envelope keeps every field it read before; to preview a purge, read `would_delete` from a `--dry-run --headless` run.
