type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature rules now say which declaration a type name means when the skill and the package between them document or export more than one declaration under it, such as cognee's base `DataPoint` and `ExtendableDataPoint`, which `cognee.low_level` exports as `DataPoint`. A form that writes that name bare means the one of them that the file of the declaration the form is compared with reaches by that name, as the source's own use of it does: the one that file imports (a star import included), declares or has in scope without an import (its own package or namespace) under that name, or names through a module or namespace it imports (`engine.DataPoint`). A form that writes the name through a module or namespace path means the one that path names, whatever that file reaches (`cognee.low_level.DataPoint` is `ExtendableDataPoint`). When that file reaches none of them by that name, the bare name means the type that file declares under it other than as an alias (a local `interface Options`), as before, and when it declares none, the one the skill documents under it, or any of them when the skill documents none or several; a judge that does not read the source matches a form that writes that name bare with any of them. A documented `-> DataPoint` therefore matches a source returning the base class it imports as `DataPoint`; before, a judge that read the name as the skill's `ExtendableDataPoint` could raise a Critical `signature-mismatch` gap on that form and fail the hard gate, while another judge passed the same skill. A form that writes the name in the skill's sense where that file reaches another of them (`-> DataPoint` for a declaration typed `ExtendableDataPoint`, in a file that imports the base `DataPoint`) now reads as the one that file reaches and is a Critical gap, so a skill some runs passed can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap over a type name under which the skill and the package between them document or export more than one declaration, write the type the source writes there, as the gap's `source_sig` gives it (for example `ExtendableDataPoint`), or name the declaration meant through its module path (`cognee.low_level.DataPoint`), then run Test Skill again.
