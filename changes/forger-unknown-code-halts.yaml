type: breaking
scope: skf-forger
summary: |
  Ferris now hands the whole pipeline invocation to `parse-pipeline.py` and stops before any workflow runs when it does not parse: an unknown code such as the `TX` in `BS CS TX EX`, which used to be dropped so that the chain ran `BS CS EX` and exported an untested skill, an alias without the argument its first workflow needs (`forge-quick` alone, or `forge <repo-url-or-path>` with no skill name), an argument an alias does not take, a flag other than `--pin`, `--headless` or `-H`, or a malformed threshold bracket such as `TS[min:80%]`, which used to pass on as a target. Interactively Ferris names the problem and asks for the corrected invocation; a headless run halts and writes a `failed` pipeline result to `pipeline-result-latest.json`, with the reason in `summary.halt_reason`, as it now also does for the removed `onboard` alias and when the parser prints no JSON. The documented alias forms parse with their arguments, which the parser returned as unknown codes before: `forge-auto <repo-or-doc-url>` (with `--pin <version>`), `forge <repo-url-or-path> <skill-name>`, `forge-quick <package-or-url>` and `maintain <skill>`. Bracket keywords match in any case (`TS[MIN:80]`, `AN[AUTO]`), and a `min:N` on a code other than `AN` and `TS`, such as `EX[min:80]` or `CS[min:80]`, is ignored with a warning: only `AN` (a unit count) and `TS` (a test threshold) take one.
migration: |
  Fix the invocation the halt names and run it again: correct the code, give the alias its argument (`forge-quick cognee`), put a target in brackets (`CS[cocoindex]`), write a threshold as `TS[min:80]`, or drop the extra argument, flag or `min:N`.
