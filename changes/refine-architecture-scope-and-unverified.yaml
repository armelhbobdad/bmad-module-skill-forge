type: changed
scope: skf-refine-architecture
summary: |
  When Refine Architecture works out the document's scope itself (no `--scope-skills`) and leaves some skills out, it now shows which skills are in and out of scope before it reads their APIs, and you can bring a skill in by typing its name or take one out with `-<name>`; type `C` to keep the scope. A headless run keeps the derived scope and logs that decision. The Refinement Summary gains a `Not verified (no skill)` row that names the libraries, databases and services the architecture mentions but no skill covers, since nothing checked what the architecture says about them, and a `VS Coverage` row when a Verify Stack report was used. A skill covers a technology when its name appears in the technology's name, or when its name or the repository or folder it was built from equals it; a repository or folder name found only inside a longer name (`ai` in Azure AI Search, `core` in ASP.NET Core) does not count. When the `Not verified (no skill)` row names any technology, the next steps say to create their skills with Create Skill or Quick Skill (`@Ferris CS` or `@Ferris QS`) and run Refine Architecture again before Stack Skill; the final report shows the same next step. The final report no longer repeats the count table the review just showed: a headless run reads the counts in its result line.
