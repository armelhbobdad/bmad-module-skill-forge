type: changed
scope: skf-refine-architecture
summary: |
  When Refine Architecture works out the document's scope itself (no `--scope-skills`) and leaves some skills out, it now shows which skills are in and out of scope before it reads their APIs, and you can bring a skill in by typing its name or take one out with `-<name>`; type `C` to keep the scope. A headless run keeps the derived scope and logs that decision. The Refinement Summary gains a `Not verified (no skill)` row that names the libraries, databases and services the architecture mentions but no skill covers, since nothing checked what the architecture says about them, and a `VS Coverage` row when a Verify Stack report was used. When the `Not verified (no skill)` row names any technology, the next steps say to create their skills with Create Skill or Quick Skill (`@Ferris CS` or `@Ferris QS`) and run Refine Architecture again before Stack Skill; the final report shows the same rows and next step.
