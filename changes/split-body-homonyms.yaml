type: changed
scope: skf-test-skill
summary: |
  Test Skill's split-body cross-check no longer compares two forms of one name that belong to different declarations of it, such as a core function and a renderer's function of the same name, or a runner a lazy re-export passes on beside the orchestrator a namespace exports. Forms whose own citations name two declarations (for the inventory reader, which has no surface: two files the skill presents as different things, a re-export naming none), or that the signature plan binds to two, are two exports: each is compared only with the forms of its own declaration, a form attributed to neither is a mismatch only when it contradicts both, and the signature check still holds each form to its own declaration. When the source declares the name again outside the surface's records, a split-body mismatch's Source no longer picks a side by comparing both forms with the one declaration the surface records: it stays at the reference file and says no source settled it. Before, two correct forms of two same-named functions could be read as a High `split-body-mismatch` gap, which blocks the hard gate and tells Update Skill to rewrite one file to match the other.
