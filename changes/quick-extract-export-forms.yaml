type: fixed
scope: skf-quick-skill, skf-brief-skill, skf-test-skill
summary: |
  The Quick-tier export scan (`skf-extract-public-api.py --mode quick`) reads more export forms, and names in `warnings` the statements whose names the entry file alone cannot give. It now lists Python names re-exported with `from ... import` (a nested package's absolute imports of its own modules included), `async def` functions and every public name the module's `__all__` lists, a tuple or one built with `+=` or `.extend()` included; Rust `pub use` re-exports, `#[macro_export]` macros and `pub async fn`, `pub unsafe fn` and `pub extern "C" fn` items, with `pub const fn f` listed as `f` instead of an export named `fn`; and JavaScript and TypeScript `export async function`, `export let` and `var`, every name of `export const a = 1, b = 2`, `export abstract class`, `export declare`, `export function*`, `export * as ns`, `export default <name>` and TypeScript's `export = <name>`, and CommonJS `module.exports` (Express's `exports = module.exports = <name>` included) and `exports.<name>` assignments. A statement whose names the entry file alone cannot give (`export * from`, a star import from the package, an `__all__` built from another module's `__all__`, `pub use x::*`, `module.exports = require(...)`, a `module.exports` set inside an `if` or a block) is now named in the result's `warnings`, as are an anonymous `export default` and a destructuring `export const`; an indented Rust `pub fn` (a method) is no longer listed as a top-level export, and a regular expression such as `/\/*$/` no longer hides the exports after it. Quick Skill's Key Exports, the export list Brief Skill shows when it analyzes a target, and Test Skill's Quick-tier coverage of a Quick Skill all come from this scan.
issues: [584, 592]
