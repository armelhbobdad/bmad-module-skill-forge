summary: |
  A stale name's gap in Test Skill's Gap Report now cites the line that documents the export when the skill writes it module-qualified, not an earlier line whose code span only mentions the bare name, such as a confidence note or a "not covered here" disclaimer. A heading or an export table's first cell whose code span or text is a dotted path from a module the skill's code blocks import, ending in the name (`cognee.run_migrations`), once a leading `new ` and everything from `(`, `<` or `[` are cut, now ranks with a heading of the name, and a code span that calls the name after an assignment, `await`, `new` or such a module (`await cognee.wait_for_background_tasks()`, `x = get(key)`) ranks with a code span of the name. oms-cognee's `run_migrations` and `wait_for_background_tasks` gaps used to cite a Confidence bullet in `SKILL.md` and a disclaimer in `references/full-api-reference.md`, and their remediations asked to remove the documentation there; their Source, Issue and remediation now name the `cognee.run_migrations` Key API row (`SKILL.md:148`) and the row that writes `await cognee.wait_for_background_tasks()` (`SKILL.md:157`). Within each rank the first file, then the lowest line, still wins, and a call with a space or type arguments before its `(`, a type's method row (`Client.connect()`) and an instance's call (`client.connect(url)`) still document nothing. Scores, the hard gate and the gap count are unchanged.
