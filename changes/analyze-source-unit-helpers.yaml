type: changed
scope: skf-analyze-source
summary: |
  The step-by-step Analyze Source chain now takes each unit's export record, scope globs and component-library evidence from SKF's helpers instead of working them out by hand. Java, Kotlin and Swift units are counted by the parser over every source file of the unit, its tests left out (`strategy_used: "parser"`, `confidence: "T1"`), where before their exports were read by eye. Each unit's export record is written by a script from the extractor's output, so the model no longer copies the extractor's JSON into it, and a subagent is launched only for a unit that has something left to read (an extraction gap, a file the parser could not fully read, or a unit read by eye) or when the ccc search runs. The recommendation card and each brief carry the `scope.include` and `scope.exclude` globs that `skf-detect-language.py scope-patterns` computes for the unit (for a composite, the union of its constituents'), in place of suggested includes and excludes inferred by hand. Component libraries are classified from the demo-file count and the scored registry candidates of `skf-detect-registry.py`.
