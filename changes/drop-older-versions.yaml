type: added
scope: skf-drop-skill
summary: |
  Drop Skill's scope question adds `[O] Older versions` (`version=older` in a headless run), which drops every version in the export manifest except the active one and the ones already deprecated, in one run with one confirmation and one context-file rebuild. Each version gets its own purge check, `active` link repair and final-state check, and the manifest marks them all deprecated in one write. When no such version is left, an interactive run asks again and a headless run stops with exit `2` (`input-invalid`). In a purge of several versions, the envelope's `forge_left_in_place` is a list of the forge folders left in place instead of a single path.
issues: [1160]
