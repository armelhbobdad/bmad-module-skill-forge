type: breaking
scope: skf-update-skill
summary: |
  Update Skill with `--from-test-report` now stops before anything is written, with status `halted-for-remediation-path` (headless `error.phase` `re-extract:targeted-reextraction`), on a gap rated Critical or High, or with no severity it recognizes, for an export the provenance map does not have when the gap has no `file:line` Source that points at the line defining the export and its Remediation names no file to read. The message lists each such gap with `files_scanned: 0`. With `--dry-run` the run stops the same way instead of exiting `dry-run`. If such a gap reaches the provenance write anyway, because that check was skipped, the run stops there with status `blocked` (headless `error.phase` `write:provenance-map`) and writes neither `metadata.json` nor `provenance-map.json`. Before, a real run rewrote `SKILL.md` and only then stopped, with no documented status, which left the skill half repaired; a dry run reported success.
migration: |
  For each gap the message lists, give it a `file:line` Source that points at the line defining the export, or name the source file that defines the export in the gap's Remediation, or lower the gap to Medium, Low or Info if an entry without a source line is acceptable; then re-run Update Skill.
