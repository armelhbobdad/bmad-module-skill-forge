type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory floor now pins the form a floor table's row writes in a column whose header joins Signature to another word at `/`, such as `Signature / Purpose` or `Props / Signature`, as it pins a `Signature` cell: the code span the cell opens with, a description after it left out, labelled partial when the Signature part carries the label, as `Signature (simplified) / Purpose` does. Before, the floor read a form column only when its whole header was one listed word, so these forms stayed the reader's and two runs could record different forms there, or none: for storybook, 18 forms such as `fn<T>(implementation?: T): Mock<T>` and `argsHash(args: Args): ArgsHash` were never pinned. `validate-inventory.py --floor` now refuses an inventory whose entry there does not carry the form. A `Props / Usage` or `Props / Type` column and an `Arguments`, `Args`, `Usage`, `Syntax` or `Example` column are still not read, and the inventory contract now says so. An inventory that passed can now be refused.
migration: |
  If Test Skill halts with `inventory-invalid` on a form from a `Signature / Purpose` or other compound Signature column, run it again: the skill needs no change for it. If a run now stops at the hard gate on a `signature-mismatch` for a form such a column now pins, correct the form in the skill (the run's `inventory-floor.json` gives each origin's file, line and `signature`), then run Test Skill again. If a `signature` misreads the cell, report it as a bug with the line and the `signature`.
