type: breaking
scope: all workflows
summary: |
  The health check now searches for an open issue that matches a finding with `gh issue list --repo <repository> --search` instead of `gh search issues`, whose `--repo` cannot name a host. A headless run with `health_check_autosubmit: true` whose allow rules still name `gh search issues` has that call refused, so it saves its findings to the local queue, with a reason saying a `gh` call was refused, instead of filing them.
migration: |
  In `permissions.allow`, replace `Bash(gh search issues *)` with `Bash(gh issue list *)`, or a scoped `Bash(gh search issues --repo OWNER/REPO *)` with `Bash(gh issue list --repo OWNER/REPO *)`. For a `health_check_repo` written `HOST/OWNER/REPO`, also replace `Bash(gh auth status)` with `Bash(gh auth status --hostname HOST)`, with HOST as `gh auth status` lists it: in lower case, `github.com` for any `*.github.com` name and `TENANT.ghe.com` for `api.TENANT.ghe.com`.
