type: changed
scope: all workflows
summary: |
  `skf-health-check-seen.py fingerprint` now exits 2 when a finding's step file is a workflow's last step, `references/health-check.md`, that only loads the shared health check, and the new `queue` refuses a draft that names one. That step holds no instruction of its own, so a defect that bites there is reported against the step file that was running when it bit, or against `shared/health-check.md` when it is in the shared health check itself. Update Skill's, Quick Skill's and Verify Stack's last steps do more than load it (Update Skill's lock release, source-tree close and run-folder removal, Quick Skill's headless `done` event, Verify Stack's line when the health check cannot load), so the helper still takes them, and the health check now reports a finding about what they do against that step.
