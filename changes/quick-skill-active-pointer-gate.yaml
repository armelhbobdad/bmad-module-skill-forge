type: added
scope: skf-quick-skill
summary: |
  When the skill's `active` pointer names a build another workflow made (a Create Skill build, for example), Quick Skill now asks whether to point it at the new quick skill or keep it, instead of moving it without asking. A headless or `--batch` run keeps it, records the new `finalize.active-pointer` decision in `headless_decisions`, and reports `summary.active_pointer` as the new value `kept-prior-active`, and its completion summary and `outputs` then leave out the pointer. A pointer on another quick skill is moved, and a missing one created, as before.
issues: [1175]
