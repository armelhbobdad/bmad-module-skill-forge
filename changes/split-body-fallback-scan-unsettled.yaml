type: changed
scope: skf-test-skill
summary: |
  After a fallback per-file scan, Test Skill's split-body cross-check no longer settles a pair by the one declaration the scan recorded. That scan never looks for a same-named declaration no entry point exports, yet its `surface.json` wrote `otherDeclarations` as `[]`, which the split-body Source read as "there is none", so a correct form documenting another function of the same name (such as cognee's lightweight `run_pipeline`) could be named the contradicted side, with a remediation citing the recorded declaration as settling it. `surface.json` now writes `otherDeclarations` as `null` when no runner extraction looked for them (no extraction, or one the fallback scan replaces, with or without the runner's JSON), and the one declaration decides only when the list is a list. Such a `split-body-mismatch` gap stays High, with its Source at the reference line and a remediation that says no source settled it, as a full extraction of the same tree already gives. A full extraction still writes a list, `[]` when it finds none.
