type: breaking
scope: skf-update-skill
summary: |
  Update Skill's lock against two updates of one skill at once now works, so `halted-for-concurrent-run` fires while another update of the same skill holds a fresh lock. The lock file, `.skf-update.lock` in the skill's forge data folder, now names the run that holds it and when that run took it. Before, it held the process id of a shell that was gone by the next step, so every later run read the lock as left behind, cleared it and went on, even while the first update was still running. A lock goes stale 60 minutes after it was taken or last renewed, and the next update replaces a stale lock with a `run-lock-replaced` warning. An update renews its lock before it writes the skill and again before it writes the skill's metadata. When its lock went stale while it waited, for example at a confirmation prompt, it stops there with `halted-for-concurrent-run` (`error.phase` `merge:run-lock` or `write:run-lock`, `error.reason` starting `run-lock-lost`), since another update may have changed the skill in the meantime. Every stop after the lock was taken releases it, and a release never removes another update's lock. When another update holds the lock, a headless halt's `error.reason` names that run, since when, the lock file and when the lock goes stale, never a PID. `--detect-only` and `--dry-run` still take no lock.
migration: |
  When Update Skill stops with `halted-for-concurrent-run` and no other update of that skill is running, delete the lock file the message names (`<forge data folder>/<skill>/.skf-update.lock`), or wait until the time the message gives, when the lock goes stale; then run the update again. When it stops because its own lock went stale while it waited (`run-lock-lost`), run the update again, first deleting the new version folders the message names, if any. A pipeline that read a PID from `error.reason` reads the run that holds the lock there instead.
