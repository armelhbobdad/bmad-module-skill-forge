type: changed
scope: skf-create-stack-skill
summary: |
  Stack Skill in compose mode now treats the library pairs an architecture document names together as candidates, not integrations. A pair the document names only in separate list items or table rows (a Tech Stack table and a Components list that name every library, say) is dropped with a `comention-list-only` warning. A pair named together in one passage (a sentence, list item, table row or diagram line), or in a lead-in sentence and the list under it, becomes an integration only when that passage says how the two libraries work together (data flow, wrapping, configuration or events), and the integration's architecture reference quotes it; the others are dropped with a `comention-unconfirmed` warning. With no architecture document, a pair is a candidate only when one skill's own docs name the other or the two share a domain keyword, never because they share a language, and only the top 20 pairs are analyzed. A candidate is kept only when that docs line says how the two work together (a documented contract, which the integration cites) or when both skills' descriptions and exports show how the shared domain links them (marked `[inferred from shared domain]`), so two libraries that do the same job, such as two validators, are never paired; the others are dropped with an `infer-unconfirmed` warning. Expect fewer integrations with better evidence in compose-mode stacks; the evidence report lists each pair dropped.
