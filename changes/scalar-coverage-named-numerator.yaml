type: fixed
scope: skf-test-skill
summary: |
  On the scalar coverage branch, Export Coverage now counts only the documented names in the denominator's set when that set can be trusted. Before, the numerator was every documented name the skill writes, so each documented extra offset an undocumented export: a skill of five exports that documents three of them and two names the source does not export read 100% with nothing missing. It now reads 60% and lists the two undocumented names. `load-coverage-inputs.py surface` writes a new `denominator.setCounted`, true only for a scope set (not `all`) whose every name sits at the file that defines it: a complete runner extraction (neither `incomplete` nor truncated), the fallback per-file scan, or quick output that traces each name. On such a set, `coverage.json` reports `numeratorSource` `surface`, lists the undocumented names in `missing` and gives the set's name and size (`surfaceSet`, `surfaceSetSize`); the denominator stays the stored count, with a warning when the two differ. The ledger records a Medium `missing-export` gap per missing name at the file the surface records for it (or, as on the barrel branch, one summary gap at the brief when the inflation guard fired on that `scope.include` set), plus one gap for the rest when the stored count exceeds the set's names, and the Coverage Analysis section shows the per-export table and a new `Coverage Warnings` line. Over `all`, a set read by eye or from an incomplete extraction, or an empty set (which warns), the numerator is looked up as before, the verified numerator count still replaces it when inflated, and one gap covers the count. Export Coverage can drop on skills whose set is counted.
