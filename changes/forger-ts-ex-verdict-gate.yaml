type: breaking
scope: skf-forger
summary: |
  Forge pipelines (`forge-auto`, `forge`, `forge-quick`, `maintain` and chains such as `QS TS EX`) now export a skill only when Test Skill settles on `PASS`, the one verdict whose `next_workflow` is `export-skill`. A test that ends `INCONCLUSIVE` or `pass-with-drift` now stops the pipeline before `EX` with the verdict as the halt reason, and so does every `FAIL`, including a `FAIL` that a post-score cap forced while the score still cleared the threshold, which used to go on to `EX`. Ferris no longer compares the test score with a threshold of its own: a `TS[min:N]` bracket reaches Test Skill as `--threshold=N` (`forge-auto` passes `--threshold=90`), and a score between 80% and a higher threshold that Test Skill settles as a fallback `PASS` goes on to export. The new `pipeline-gate.py` script takes these decisions, and those of the `AN`, `AS` and `VS` circuit breakers, from the result envelope the step just printed, never from an earlier run's `-latest.json` file; a step that prints no envelope stops the pipeline.
migration: |
  When a pipeline stops at `TS`, open the test report it names. For `FAIL`, run `@Ferris US <name> --from-test-report`, then `@Ferris TS[<name>] EX`. For `INCONCLUSIVE`, add evidence (install skill-check, or move up a tier with `@Ferris SF`) and test again. For `pass-with-drift`, test again against the pinned commit without `--allow-workspace-drift`. Export a skill the test did not pass only by running `@Ferris EX <name>` yourself after reviewing it.
