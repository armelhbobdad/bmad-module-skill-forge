type: breaking
scope: skf-test-skill
summary: |
  At every place Test Skill's inventory floor pins a form, the partial label is now the floor's. The floor now also pins `signature_form` `"partial"` on a form whose parameter group holds an ellipsis item, a `...` or `…` standing in for members the skill does not show, in a `Signature` cell, an export table's first cell, a heading or a cited declaration, such as cognee's `add(data, dataset_name="main_dataset", user=None, node_set=None, ...)` heading; a rest `...args` and a `*args` pin no label. `validate-inventory.py --floor` now refuses an entry that labels a pinned form `"partial"` where the floor pins no label, at that place or with no `at`, while a labelled copy at another line that writes the name stays valid. Before, the validator read an entry's label only where a column header such as `Signature (simplified)` gave one, so one reader could label a complete pinned form partial and turn a left-out optional parameter's Critical `signature-mismatch` into an Info observation while another reader did not. The inventory contract now says so. An inventory that passed can now be refused, and a skill that passed can now block at the hard gate.
migration: |
  If Test Skill halts with `inventory-invalid` on a `signature_form` the floor does not pin, run it again: the skill needs no change for it. If a run now stops at the hard gate on a `signature-mismatch` for a pinned form the skill presents as partial only in words, put the label in its column header, such as `Signature (simplified)`, or write the full form, then run Test Skill again.
