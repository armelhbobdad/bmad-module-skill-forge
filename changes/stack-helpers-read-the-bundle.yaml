type: added
scope: skf-create-stack-skill
summary: |
  Stack Skill's helpers now read the extraction bundle themselves, so no step copies its data by hand. `skf-render-stack-metadata.py pair-tiers` and `metadata` take `--bundle <extraction-bundle.json>` in place of `--input`, `pair-tiers` on a code-mode bundle taking the qualifying pairs from `--pairs`, and `skf-skill-inventory.py version primary --bundle <extraction-bundle.json>` picks the primary library from a code-mode bundle; steps 4 to 7 call them on the bundle file instead of piping a payload they built. `metadata` also prints `hubs` (each library with 3 or more partners, with its partners) and `library_order` (by partner count, then import count in code mode or tier in compose mode, then name), which step 5 shows and step 6 compiles from, and step 4 counts the libraries at each tier with it. The provenance map's `detection_method` now comes from each pair's `qualifier` by a fixed table (`grep-co-import` gives `co-import grep`, and the three compose qualifiers their schema values), and `provenance` refuses a missing qualifier, an unknown one or one of the other mode with exit `2`, so a run can no longer write a detection method outside the schema; the bundle's pairs no longer carry `detection_method` or `hubs`. `skf-enumerate-stack-skills.py` entries carry the skill's `metadata_name`, `version` and `source_authority`, so step 2 no longer reopens each constituent's `metadata.json`, and `enumerate --bundle-entries <names>` prints each compose-mode bundle entry (`confidence` its `evidence_tier`) and the names it did not find, which step 4 writes to the bundle and halts on.
