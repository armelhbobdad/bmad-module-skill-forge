type: changed
scope: skf-test-skill
summary: |
  Test Skill's split-body cross-check, at the Forge tier or above, now settles two more kinds of pair. When the source declares a name more than once and, on a pair that is not a method's, one form matches one or more of those declarations while the other matches none, the `split-body-mismatch` gap's Source and the Reference Consistency table's Contradicted Side name the side that matches none, and its remediation names that side to edit and the form to take, citing each matching declaration by file and line. Update Skill's `--from-test-report` run takes only that form: it adds no citation. A pair of a method's forms whose owner neither declares nor binds the method is now settled by the member of the first class in its method resolution order to declare or bind it, a base class in the source tree. Before, both pairs said no source settled them and had Update Skill copy the other side's form into the reference file, even over a reference form the source agrees with. The gap stays High and blocks as before. A pair still stays unsettled, with that copy, when the owner has no record in `surface.json`, when a method of that name is declared for the owner outside its class body (a Go receiver method, a function assigned to `prototype`), when the first class in that order to declare the method is another package's, when the method is overloaded (in Java, Kotlin, C# and Swift, by a base too), or, for a name declared more than once, when the surface was built without the runner's extraction (`otherDeclarations` `null`).
