type: added
scope: skf-verify-stack
summary: |
  Verify Stack now writes the report's table rows from the rows it counted instead of typing them a second time. `skf-coverage-tally.py --render` prints the Coverage Analysis rows from the coverage rows file, with `none` in the Source Section or Skill Match cell of a technology that has none, and the canonical `| lib_a | lib_b | verdict | rationale |` rows from `verdict-rows.json`, which now holds each pair's rationale, with one `cycle` row per circular dependency; each cell stays on one line, a `|` in it escaped. The coverage tally now refuses a Covered row that names no skill, or a Missing or Replaced row that names one, so a rows file it counts also renders. The overall verdict now comes from `skf-verdict-rollup.py --report`, which reads the counts from the report's frontmatter itself. A count a step left out, or left at the template's `null` or empty value, now stops the run with exit `5` (`schema-violation`, phase `synthesize:rollup`) instead of counting as `0`. So does a report whose `stepsCompleted` does not list `coverage`, `integrations` and `requirements`, since the template starts `coveragePercentage` and the pair counts at `0`. A missing shared report reader stops it with exit `3` (`resolution-failure`, the same phase). When subagents are unavailable, the integration step reads the skills' `SKILL.md` files one at a time instead.
issues: [598, 592]
