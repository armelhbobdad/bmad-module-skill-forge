type: breaking
scope: skf-update-skill
summary: |
  Update Skill with `--from-test-report --allow-workspace-drift` no longer writes anything read from a source checkout that is not at the skill's pinned commit: no provenance line, and no signature, parameter list, return type or node kind. Before, it recorded them under the pinned commit, so citations and signatures described the wrong code. When any gap needs something from the source, as every new or changed export does, the whole run now stops before anything is written, with status `halted-for-workspace-drift` (headless `error.phase` `re-extract:workspace-drift`); the message lists those gaps with what each one needs, the pinned commit and the `git checkout` command. When no gap needs the source (removals, provenance line fixes, structural fixes and metadata patches), the run repairs the gaps as before: a line check that would have moved a line records `unknown` instead, a node kind it would have looked up in the source stays as it is with a warning, and `warnings[]` gets `workspace_drift_overridden`.
migration: |
  When the halt appears, check out the pinned commit it names (`git -C <source> checkout <commit>`) and re-run `--from-test-report` without `--allow-workspace-drift`. For a skill built at Forge tier or above from a remote repository, you can instead run a normal Update Skill (without `--from-test-report`), which records the commit it reads as the new pin, and then run Test Skill again; if that update warns `workspace-clone-not-updated`, first run the two `git` commands its report gives to move SKF's clone to the new commit. For a skill built from a local folder, only the checkout works: a normal update keeps its pin.
prs: [551, 618]
issues: [530, 557]
