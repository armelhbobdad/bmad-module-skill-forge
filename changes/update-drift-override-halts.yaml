type: breaking
scope: skf-update-skill
summary: |
  Update Skill with `--from-test-report --allow-workspace-drift` no longer writes a provenance line read from a source checkout that is not at the skill's pinned commit. Before, it recorded those lines under the pinned commit, so citations pointed at the wrong code. When any gap needs a new line, the whole run now stops before anything is written, with status `halted-for-workspace-drift` (headless `error.phase` `re-extract:workspace-drift`); the message lists those gaps, the pinned commit and the `git checkout` command. When no gap needs one, the run repairs the gaps as before: a line check that would have moved a line records `unknown` instead, and `warnings[]` gets `workspace_drift_overridden`.
migration: |
  When the halt appears, check out the pinned commit it names (`git -C <source> checkout <commit>`) and re-run `--from-test-report` without `--allow-workspace-drift`. For a skill built at Forge tier or above from a remote repository, you can instead run a normal Update Skill (without `--from-test-report`), which records the commit it reads as the new pin, and then run Test Skill again; if that update warns `workspace-clone-not-updated`, first run the two `git` commands its report gives to move SKF's clone to the new commit. For a skill built from a local folder, only the checkout works: a normal update keeps its pin.
