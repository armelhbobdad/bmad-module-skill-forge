type: breaking
scope: skf-update-skill
summary: |
  Update Skill with `--from-test-report --allow-workspace-drift` no longer writes anything read from a source checkout that is not at the skill's pinned commit: no provenance line, no signature, parameter list, return type or node kind, and no count of the public API. Before, it recorded them under the pinned commit, so citations, signatures and stats described the wrong code. When any gap needs something from the source, as every new or changed export does and as a rescope (a gap that takes an export out of the skill's scope) does, the whole run now stops before it changes the skill, with status `halted-for-workspace-drift` (headless `error.phase` `re-extract:workspace-drift`); the message lists those gaps with what each one needs, the pinned commit and the `git checkout` command, and it names the scope amendment each rescope already wrote to the skill brief, which stays there. When no gap needs the source (provenance line fixes, structural fixes and metadata patches), the run repairs the gaps as before: a line check that would have moved a line records `unknown` instead, a node kind it would have looked up in the source stays as it is with a warning, the stats keep the public API counts `metadata.json` records, and `warnings[]` gets `workspace_drift_overridden`.
migration: |
  When the halt appears, check out the pinned commit it names (`git -C <source> checkout <commit>`) and re-run `--from-test-report` without `--allow-workspace-drift`. For a skill built at Forge tier or above from a remote repository, you can instead run a normal Update Skill (without `--from-test-report`), which records the commit it reads as the new pin, and then run Test Skill again; if that update warns `workspace-clone-not-updated`, first run the two `git` commands its report gives to move SKF's clone to the new commit. For a skill built from a local folder, only the checkout works: a normal update keeps its pin. When the message names a scope amendment in the skill brief, remove it before you re-run, since the re-run adds it again, or when you drop the repair.
