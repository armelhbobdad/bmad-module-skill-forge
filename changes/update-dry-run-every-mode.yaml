type: fixed
scope: skf-update-skill
summary: |
  Update Skill with `--dry-run` now writes nothing in every mode. Before, a repair from a test report (`--from-test-report --dry-run`) went on to rewrite the skill in place, and a skill built from documentation only skipped the dry-run exit; now both stop after re-extraction with status `dry-run`. `--detect-only` and `--dry-run` no longer amend `skill-brief.yaml` either: each decision they would record there (a promoted or skipped document, a scope change, a rescoped export) is listed in the report and in `warnings[]` as `proposed-amendment:`. A skill built from documentation only is now checked for changes: its tracked documents are fetched and compared with their recorded hashes, as Audit Skill does, only the documents that changed are fetched again, and the update records their new hashes in `metadata.json`, where before every such update reported no change. An update now records, before its first write, what it is about to change, and a stop after that point puts the skill back as it was: a repair restores the skill, its provenance map, evidence report and skill brief from the copy it took first, and any other update removes the new version folders it created, so a re-run no longer stops at "version already exists". One stop keeps the new version: a `[MANUAL]` block that changed after the update made the new version the active one, which the stop leaves active for you to repair, as its message says. When an update was interrupted (its run lock went stale), the next update of the skill undoes what it left and says so in `warnings[]` (`interrupted-run-cleaned`). A `[MANUAL]` section you chose to remove or edit at a merge conflict no longer stops the update when it writes: the merged `SKILL.md` is checked against the sections you approved, before the new version is published. A rescoped export's scope amendment is written to the skill brief only when the repair writes.
