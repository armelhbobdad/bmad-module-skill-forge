type: fixed
scope: skf-test-skill
summary: |
  Test Skill can now record the documentation errors a Deep-tier run asks for: an import path whose module does not export the name, and a type member that differs from its declaration. The coverage check asked for an Info `Not checked by script: {name}` observation for each such error, but no one held both the skill's import lines or documented members and the source: the parent never loads the skill, each signature judge got only a check's `params`, `return_type` and `usage_signature` forms, and a name the skill documents only by members got no check at all. On oms-cognee 1.6.2, 12 such names, `SearchType` and `RememberResult` among them, got no check, and all 39 judge results had no place for such an error. At the Deep tier `score-signatures.py plan --doc-errors` now gives each check the skill's import statements of its name (`imports`: a fenced Python `from M import` or TS/JS `import { } from` statement; other forms, such as a CommonJS `require` or a Rust `use`, give none) and its documented `fields`, `properties` and `methods` (`members`), and gives a name documented only by these a check that Signature Accuracy never counts when a surface record of it names a file. The judge compares them with the source by a new `signature-comparison-rules.md` paragraph and returns each that differs in `doc_errors`, and `score` records each as the Info observation at the documenting line, so no record is written by hand. A member documented beside a form the skill's citations bind to another declaration of the name is compared with that declaration, and a documented method is looked up as a method form's member is, so an object's method is read on its class. A malformed item is dropped with a warning. Forge-tier plans, every score and the fallback per-file scan are unchanged.
