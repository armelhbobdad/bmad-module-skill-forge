type: changed
scope: skf-test-skill
summary: |
  Test Skill's coherence check now loads only the instructions of its mode: the naive checks live in `references/coherence-naive.md` and the contextual ones in `references/coherence-contextual.md`, and `coherence-check.md` routes to one of them, then writes and records the Coherence Analysis section as before. A stack skill's integration points, its code or compose mode and each entry's wiring evidence now come from the new `skf-scan-skill-md-structure.py integration-scan`, which reads the stack template's Cross-Cutting Patterns and Library Pair Integrations entries and leaves out the Hub Library Connections list, so a stack whose integration patterns were miscounted by hand can get a different coherence score. Only a library pair needs wiring evidence now: Create Stack Skill writes a cross-cutting pattern with no `file:line` citation or `[from skill: ...]` line, so the check no longer marks every one incomplete. `aggregate-coherence.py` refuses (exit 2) an `integration.json` whose `incomplete_patterns` do not number `patterns_documented - patterns_complete` or lack a `pattern`, an `issue` or a line, and copies them into `coherence.json` as `incompletePatterns`. `gap-ledger.py` records each incomplete integration pattern from there (`--from coherence`) and each split-body mismatch from the inventory and a settlements file (the new `--from split-body --settlements`), with fixed titles and Sources, where the model used to type both into the ledger. The naive branch's findings JSON, which nothing read, is gone.
