type: fixed
scope: skf-export-skill, skf-update-skill
summary: |
  Export Skill now keeps a gotcha that the current SKILL.md states, even when the evidence report records no T2-future annotation. Before, such a gotcha was marked `[CARRIED]` on one export and dropped on the next. A gotcha now counts as current when the evidence report's T2-future annotations state it, or when SKILL.md states it in a gotchas, deprecation, migration, breaking-change or import-correction section, in a `## Key API Summary` row that says deprecated or removed, or as an `await` call in its Quick Start. The `|gotchas:` line now holds at most 3 pitfalls, separated by `; `: the prior pitfalls still stated come first, then new ones. `[CARRIED]` now marks a single pitfall that nothing current states, and that pitfall is dropped, with a warning, on the export after. The `|api:` line now has a fixed order, so it no longer changes from one export to the next. The order is the prior `|api:` names, then the `## Key API Summary` rows, then the metadata.json `exports`. A name appears only when `exports` lists it and SKILL.md does not mark it deprecated or removed. The line holds 10 names at Deep tier and 5 at the other tiers. The first export after this change can rewrite a skill's `|api:` line once. The `#quick-start` and `#key-types` anchors now stay on SKILL.md when SKILL.md has the heading, and point into `references/` only for a split-body skill whose SKILL.md lacks it. Update Skill follows the same rules when it regenerates a snippet. It also regenerates a snippet whose anchors are wrong. A gap-driven repair still leaves the snippet alone when only the `|api:` order would change.
