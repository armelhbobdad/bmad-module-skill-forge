type: fixed
scope: skf-campaign
summary: |
  An interrupted campaign now resumes at the right stage, including one interrupted during the Tier B batch: `campaign resume` takes its stage from the new `campaign-state.py resume`, which sends a skill left `active` back to its own stage (the skill loop for Tier A, the batch for Tier B, whose script batches the interrupted skills again) and otherwise continues after the last completed stage, never past the report stage. Every write to `_campaign-state.yaml` now goes through `campaign-state.py`, which validates the state before and after the write, copies only a valid state to `_campaign-state.yaml.bak`, stamps `last_updated`, `started_at` and `completed_at` from the clock in UTC, and writes atomically, so a bad write can no longer overwrite the last good backup. Strategy records its stage only after the plan is confirmed, so a campaign cancelled at the plan shows the plan again when it resumes, and the cancel message now says to re-run `campaign` and choose overwrite to change targets. A Tier B skill pinned to a branch is batched as `<repo>/tree/<branch>`, which quick-skill reads as that branch, instead of `<repo>@<branch>`, which it could not read. The provenance stage reports a repository that does not exist as `not-found` instead of a network failure, an organization's SSO or SAML refusal as `forbidden` instead of a rate limit, and an offline `gh` as `network`, each result with its `error_class`, and shows a shared root cause above the per-repo errors. The Tier A kickoff lists each workaround pre-apply applied as a readable line. Decision log entries are now typed and timestamped (`decision`, `auto` or `event`). Overwriting a campaign now moves its state, its `.bak` and its brief into a new folder under `archive/` through `campaign-state.py archive`, and Setup refuses to write over an existing state or backup. A headless `campaign resume` of a campaign that already finished ends with its `SKF_CAMPAIGN_RESULT_JSON` success line (exit code `0`) instead of an error envelope, and a resume of a Setup that stopped before it wrote the brief halts at once with exit code `8` (`missing-brief`) and says to start the campaign again. `campaign resume` no longer asks whether to recover from a backup that looks newer than the primary state (a headless resume already kept the primary): every write now leaves the backup one write behind the primary, so only a hand edit could make it newer.
issues: [587, 585, 582]
