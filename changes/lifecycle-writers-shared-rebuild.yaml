type: breaking
scope: skf-export-skill, skf-drop-skill, skf-rename-skill
summary: |
  Export Skill, Drop Skill and Rename Skill now build and write the SKF managed section of `CLAUDE.md`, `AGENTS.md` or `.cursorrules` through one shared helper and one IDE mapping, so the three write the same section for the same skills. Drop Skill and Rename Skill no longer read the `unknown_ide_default_context_file` and `unknown_ide_default_skill_root` settings, and Export Skill no longer reads `managed_section_format_path`: an IDE the shared mapping does not list always resolves to `AGENTS.md` with `.agents/skills/`. Export Skill now records every exported skill in `.export-manifest.json` also when `passive_context` is `false`, measures the 300-token snippet ceiling with the token counter (and stops with exit `4`, `context-rebuild-failed`, when the counter is missing), and stops with exit `3` (`resolution-failure`) on an export manifest that does not parse or a `--context-file` value other than `CLAUDE.md`, `.cursorrules` or `AGENTS.md`. Export Skill now also finds a managed section left in `CLAUDE.md`, `AGENTS.md` or `.cursorrules` when no configured IDE uses that file, and asks whether to clear, keep or rewrite it (a headless run keeps it and prints a warning). Drop Skill and Rename Skill now keep the rows of skills the manifest does not know (skills installed from elsewhere) as Export Skill does, where they used to delete them. Drop Skill takes its purge verdict from the inventory helper and Rename Skill its ownership verdict, and both delete folders only through the helper's checked delete.
migration: |
  Delete `unknown_ide_default_context_file` and `unknown_ide_default_skill_root` from `_bmad/custom/skf-drop-skill.toml` and `_bmad/custom/skf-rename-skill.toml`, and `managed_section_format_path` from `_bmad/custom/skf-export-skill.toml`, and from the `.user.toml` files beside them. Unknown IDEs now resolve to `AGENTS.md` with `.agents/skills/`; to map another IDE, open an issue to add it to the shared mapping, since an update replaces a local copy. To remove the row of a skill installed from elsewhere, run Export Skill and choose Drop at its orphan-row prompt.
