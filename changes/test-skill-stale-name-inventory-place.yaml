summary: |
  A stale name's gap in Test Skill's Gap Report now cites the line that documents the name when the skill writes it only in a shape the gap ledger's line search does not read, such as a TypeScript declaration without `export` in a fenced code block. The ledger now also reads the run's validated `inventory.json` and, when no line is found, takes the first `at` the inventory gives that name (`SKILL.md` first, then by file path, then the lowest line). Such a name's Medium gap used to cite a bare `SKILL.md`, a file that never writes the name, and asked to update or remove its documentation there; its Source, Issue and remediation now name that line. The Issue of a documented extra opens with it too: oms-uitripled's `UILibraryContextValue`, which the brief's scope now settles as a documented extra, has an Issue that opens with `references/setup.md:90`, where `type UILibraryContextValue = {` opens. A line the search finds still comes first, a name the inventory gives no `at` keeps `SKILL.md`, and scores and the hard gate are unchanged.
