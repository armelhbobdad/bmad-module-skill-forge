type: breaking
scope: skf-test-skill
summary: |
  Test Skill's signature rules now say which declaration a type name means when the source file imports a type under another name and reuses the original name for a local alias. A type name a documented form writes means the type the skill documents or the package exports under that name, and the source file's own declaration of it only when there is none or when the file declares the name other than as an alias, while a name the source writes is read in its own file, a local alias through the type it names. A documented `ThemesParameters['themes']` therefore matches a return of the local `type ThemesParameters = Parameters['themes']` declared over `import type { ThemesParameters as Parameters }`; before, a judge that read the documented name in that file raised a Critical `signature-mismatch` gap on the correct form and failed the hard gate. A mismatch's `source_sig`, which the gap's remediation asks the form to copy, now writes a local alias that reuses a documented or exported name as the type it names, by its exported name. A form that copies the local alias name as the source writes it (`=> ThemesParameters` there) now reads as the exported type and is a Critical gap, so a skill some runs passed can now stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap whose source declares a local alias under a name the package exports, write the type the alias names in the package's exported names, as the gap's `source_sig` gives it (for example `ThemesParameters['themes']`), then run Test Skill again.
