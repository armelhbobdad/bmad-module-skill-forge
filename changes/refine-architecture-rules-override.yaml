type: breaking
scope: skf-refine-architecture
summary: |
  `refinement_rules_path` now swaps only the house-style rules: the gap, issue and improvement types, the issue severity and improvement value tiers, and the tier each Verify Stack verdict (`Blocked`, `Risky`, `Plausible`, `Verified`) raises. Every step now classifies with the tables that file defines, so the types and tiers a team's copy adds reach the findings, the Refinement Summary and the final report instead of being overridden by the bundled lists. How the steps store their findings for recovery moved to a fixed file, `references/finding-storage.md`, so a copy can no longer drop it, and the refined document's headings, callouts and RA markers stay fixed whatever the copy says. Refine Architecture now stops before any analysis with exit `3` (`resolution-failure`, phase `init:rules`) when the rules file cannot be read, lacks one of its six tables (`Gap Classification`, `Issue Classification`, `Issue Severity`, `VS Report Integration`, `Improvement Classification` and `Improvement Value`), or names a tier the Refinement Summary cannot count: each severity and value tier starts with a letter and holds only the letters A to Z, digits and spaces, no two tiers share a name (so one set of names cannot serve both severity and value), no tier is named `gap`, `issue`, `improvement`, `unverified` or `skill`, and each `VS Report Integration` row raises a severity tier or no issue. The walkthrough of each refinement moved from the menu after approval to the review, where feedback can still change the draft: the review menu now offers `[R] Review each refinement`, `[C]` and `[X]`, and the final report no longer shows the `[R] Review changes in detail` and `[X]` menu, finishing the run with exit `0` on its own. A finding you drop at a review you then approve is recorded in `.ra-dismissed-<project>.json` in the output folder, and a later run on the refined document lists it as previously dismissed instead of inserting it again; an improvement stays dropped only for the capability it named, so the other improvements of the same skill still come in. The headless envelope's `warnings` gain `out_of_scope_skills`, which counts and names the skills the run's scope left out.
migration: |
  If your team overrides `refinement_rules_path`, start the copy again from the bundled `references/refinement-rules.md` and re-apply your changes to its six tables, renaming any tier that breaks the rules above; a Finding Storage or Preservation section in the old copy is no longer read. A wrapper that answered the final menu with `[X]` sends nothing there now, since the run finishes on its own; to walk through the refinements, answer `[R]` at the review instead.
