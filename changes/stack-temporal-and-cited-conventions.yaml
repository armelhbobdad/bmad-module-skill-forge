type: changed
scope: skf-create-stack-skill
summary: |
  A Deep-tier Stack Skill run now writes the deprecation, migration and version findings it reads from a library's QMD temporal collection into that library's reference file, under a new `## Migration & Deprecation` section, each finding with its T2-past or T2-future label and its `[QMD:...]` citation, and the library's summary in `SKILL.md` (or `references/stack-catalog.md`) gains a `**Deprecations:**` line that counts its T2-future findings; before, the run read those findings and wrote none of them. A headless compose run, the Campaign capstone's included, now renames each provenance entry whose export name the package does not write to the identifier it does write, as an interactive run already did, instead of dropping it, so Test Skill still counts it toward Export Coverage. Each `## Conventions` bullet and each summary's Usage pattern line now cites what shows it: the file and line in code mode (`(src/app.ts:12)`, several comma-separated), the constituent skill in compose mode (`[from skill: react]`). A convention no extraction shows is left out, and `skf-validate-output.py --skill-type stack` reports a Conventions bullet with no citation as a `low` issue, which the validation step lists as a warning, so a house-style copy of the stack template keeps each bullet's citation.
