type: breaking
scope: skf-test-skill
summary: |
  Test Skill's verified count of a padded declared count, and a stack skill's count of the export names its provenance map cites, now count a name only when the documented inventory gives it an entry and the skill's text writes it. Before, both looked each name up in the skill's text alone. A name the skill writes only in a type position such as a parameter type, only in a sentence saying it does not cover it, only as a local import alias or a name it says the source does not export, or only in a form marked removed or from an earlier version now joins the High `numerator-inflation` gap's absent exports or the stack's missing count, as it already did where Export Coverage counts the inventory's names. A name a module path qualifies, such as `cognee.add` or `ops.text.RecursiveSplitter`, has the entry the inventory gives its last segment, and a name the provenance map types `module` or `package`, which the inventory has no kind for, still counts when the text writes it. A stack counted from its libraries and integration pairs still looks them up in the skill's text, since the inventory lists exports, not libraries. This can block a skill that passed: such a name now makes a declared count that equals the denominator a High `numerator-inflation` gap, and lowers a stack's Export Coverage.
migration: |
  If Test Skill now stops at the hard gate on a `numerator-inflation` gap, document each absent name it lists where the inventory gives it an entry (a heading, an export table's first cell or a fenced declaration), or remove it from `metadata.json` `exports`, then run Test Skill again. Do the same for a cited name a stack now counts as missing, removing it from the provenance map instead.
