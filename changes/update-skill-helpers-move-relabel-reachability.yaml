type: breaking
scope: skf-update-skill, skf-create-skill
summary: |
  Update Skill now moves the citations of the exports that moved in the source with the provenance verifier (`skf-verify-provenance-completeness.py fix --moves`) instead of having the model edit each one: in one pass, so when one export moves from line 6 to 7 and the next from 7 to 8, each citation moves once and lands on its own export's line, never twice onto a neighbour's. A move across files also changes the cited file, a citation another export claims or one inside a `[MANUAL]` block stays where it is with a `provenance:` warning in the run log, and a repair moves the citations of each export its spot-check found moved in every file of the package. The labels and node kinds the provenance checks flag are now set by the verifier's new `relabel` subcommand, which applies the Relabel Rule and writes the map, instead of by the model. A repair now runs the public-API runner once over the whole scope, and its entry-point diff, the one a normal update reads, decides whether each new export the repair located is public or internal, instead of the model walking barrels: you are asked only where the runner cannot tell (Quick tier, a run that did not finish, a name the runner could not trace, a language no recipe reads). When an export moved and the verifier is missing or refuses its input, the update now stops with `halted-for-write-failure` (`error.phase` `merge:move-citations`) before it publishes the new version, where before the model moved the citations itself. When the verifier is missing and no export moved, the evidence report shows `Provenance: SKIP (verifier missing; re-install SKF)` and the run log warns, instead of the model comparing the export lists by hand. A reference app's `pattern_surfaces_documented`, in Update Skill and Create Skill alike, is now the number of data rows in SKILL.md's `## Pattern Surface` tables, counted by `skf-render-metadata-stats.py --skill-md`, which refuses a count that differs. An Update Skill run on a reference app whose SKILL.md has no `Pattern Surface` heading now stops with `halted-for-write-failure` (`error.phase` `write:stats`), where before the rows were counted by eye and the run went on; Create Skill has you fix its staged table instead.
migration: |
  Before you update a reference app, make sure its SKILL.md holds its pattern table under a `## Pattern Surface` heading, the heading Create Skill writes. When the stop names a missing `skf-verify-provenance-completeness.py` or `skf-scan-skill-md-structure.py`, re-install SKF and run the update again.
