type: added
scope: skf-verify-stack
summary: |
  `SKF_VERIFY_STACK_RESULT_JSON` now has a schema, `skf-verify-stack-result-envelope.v1.json`, and the shared emitter builds and checks every line, each halt's included, so a halt in any stage prints the same shape even when the skill's own instructions are no longer in context. Every envelope gains `run_id`, the run's timestamp (the one in the report's file name), and `result_path`, the per-run `verify-stack-result-<YYYYMMDD-HHmmss>.json` file (null on a halt). A halt's envelope gains `error`, with the stage and gate it stopped at (`phase`) and its message, and keeps `report_latest_path` null unless the finished report was already published. `headless_decisions` lists the earlier report a headless run chose to compare against, and `warnings` appears when the run recorded one (`no_technology_referenced`, `no_live_technology` or `zero_coverage` when no referenced technology has a skill, `skill_modified_mid_run` when a skill changed while the run read it, `all_pairs_blocked` when every integration pair is Blocked) or the emitter raised one; the result file carries both lists too. The result files take their name and timestamp from the clock, and a run that ends in the same second as another gets a `-2` suffix. A pipeline that checks envelopes against its own copy of the schema should take the installed one.
