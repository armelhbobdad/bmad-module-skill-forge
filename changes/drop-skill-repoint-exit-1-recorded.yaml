type: fixed
scope: skf-drop-skill, skf-update-skill
summary: |
  When Drop Skill purged the version a skill's `active` link named and the helper that points the link at the remaining version could not run or could not move the link (it exits 1 when `skf-atomic-write.py` is missing from the install, or when the skill folder refuses the change), Drop Skill named no rule for that exit, so the drop could report `success` with no warning and leave `active` pointing at the deleted folder. It now records `active_link_dangling` with a fix that points the link at the remaining version and the helper's error, so the report and the result record name the link to repair. In the same case Update Skill now stops with `halted-for-write-failure` (`error.phase` `write:active-symlink`) and shows the helper's error. On Linux and macOS its next check used to stop the run, saying the flip did not apply and suggesting an `ln -sfn` to the version its rollback removes.
