type: breaking
scope: skf-refine-architecture
summary: |
  When Refine Architecture cannot write a result file, `refine-architecture-result-<YYYYMMDD-HHmmss>.json` or `refine-architecture-result-latest.json` in the output folder, the run no longer stops with exit `4` (`write-failed`, status `error`). It finishes with exit `0` and status `success`, and its envelope's `warnings` list `result_file_write_failed` (`result_path` is null when the per-run file is the one that failed), so `refine-architecture-result-latest.json` can still hold an earlier run's record. Exit `4` with `write-failed` at the result contract now means only that the shared emitter refused the result payload twice. Three other exits change too. An architecture document that is not UTF-8 text, which used to be refined, now halts at the start with exit `2` (`input-invalid`, phase `init:previous-pass`). At the final menu, `[X]`, `exit`, `cancel`, `q` and `:q` now finish the run with exit `0` instead of cancelling it with exit `6` (`user-cancelled`), because the result contract is written before that menu. A halt in the report step now sets `refined_path` to the refined document the review already promoted, instead of `null`, and its exit `8` (`recovery-failed`) now means a record of the draft's build or promotion is missing, no longer a refined document without its `## Refinement Summary`.
migration: |
  A pipeline that treated exit `4` as a missing result file now checks that the envelope's `warnings` hold no `result_file_write_failed` entry and that the `run_id` in `refine-architecture-result-latest.json` matches the envelope's, before it reads that file. Re-save an architecture document that is not UTF-8 as UTF-8 text before you run Refine Architecture. A wrapper that read exit `6` at the final menu as a cancel reads exit `0` there as a finished run, and one that expected `refined_path: null` on every halt reads the promoted document's path on a halt in the report step.
