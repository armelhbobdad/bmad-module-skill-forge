type: fixed
scope: skf-create-skill, skf-update-skill, skf-audit-skill, skf-test-skill
summary: |
  The recipe runner (`skf-extract-public-api.py --mode full`) now puts a Python package's explicit binding of a name before its submodule: when `x/__init__.py` binds `y` with an import (`from .y import y`) or a `def` or `class`, `from .x import y` is the name it binds, at the file and line that define it, and it is the submodule `x/y.py` only when `x/__init__.py` binds no `y` or binds the submodule itself (`from . import y`, `from pkg.x import y`). A `y` that `x/__init__.py` binds only through a star import (`from .impl import *`) is still read as the submodule `x/y.py`. Before, the runner took any `x/y.py` beside that `__init__.py` for the name, so it listed such a function as a submodule (`via: namespace`) with no line, counted the other names of its file as reachable instead of internal, and never reported it as an extraction gap or as outside scope. On cognee 1.6.2, 22 of the 26 names the runner listed as submodules are functions or classes (`cognee.visualize` is now `visualize` at `visualize.py:193`, and `cognee.delete` the function `delete/__init__.py` defines), so `counts.exports_internal` moves from 311 to 355, `entry_point_diff.extraction_gaps` now names `session` and `entry_point_diff.outside_scope` names `SearchType`.
