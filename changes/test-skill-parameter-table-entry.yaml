type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory now records a table that documents one function's, method's or class constructor's parameters (`| Param | Type | Default | Description |`, or with a Required column) as an entry of its own, at the heading or caption above it that writes the name, its rows one parameter list of `param: Type` members in row order with no default, Required or `?` mark. A table under a heading that already writes the name's form adds no entry there, so that heading keeps one form, bound to the declaration its citation names. The split-body cross-check now reads such a table as a typed form, and so does the scored signature check for a function's or a class constructor's table (it compares no method, so a method's table is recorded but never scored): a parameter the source lacks, a contradicted type or a required parameter left out is a mismatch, and an optional parameter the table leaves out is an `omitted-optional` difference, Critical unless the table is labelled partial in its column header, its caption or the nearest heading above it (such as `### Key parameters`); optionality is not compared. Before, the inventory contract named only props tables, so one reader compared such a table and another recorded nothing for it, and two strict runs of the same skill could reach different verdicts. This can block a skill that passed.
migration: |
  If Test Skill now stops at the hard gate on a parameter table, correct the parameter names or types the source contradicts, add the required parameters it leaves out, and add the optional parameters it leaves out or label the table partial in its column header or the heading above it (for example `### Key parameters`), then run Test Skill again.
