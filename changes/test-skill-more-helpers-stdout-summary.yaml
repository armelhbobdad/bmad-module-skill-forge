type: changed
scope: skf-test-skill
summary: |
  `score-signatures.py score`, `reconcile-coverage.py`, `verify-declared-numerator.py`, `aggregate-coherence.py` and `combine-external-scores.py` now print only a summary when they are given `--output`, since Test Skill reads each result from the file it writes in the run folder. `score`, `reconcile-coverage.py`, `verify-declared-numerator.py` and `aggregate-coherence.py` print each field of their result as the file holds it, with a list as its number of entries (the compared names, missing types, mismatches, gap records, warnings and open readings of `score`; the documented, missing and stale names, the warnings, the incomplete items and the open readings of the coverage reconciliation; the present and absent names of the numerator check; the invalid references of the coherence aggregate), and the path they wrote as `output`. `combine-external-scores.py` prints `externalScore`, `toolsUsed` and the path. An input a helper refuses, or a subagent result that breaks the schema, prints its error or its violations as before. They used to print the whole result as well, so every run put a second copy of the signature mismatches, the gap records and the coverage name lists into the agent's context. Without `--output` each still prints the whole result, as does `score` given `--gaps-output` alone, and no score, verdict or gap changes.
