type: changed
scope: skf-create-stack-skill
summary: |
  Stack Skill in code mode now relabels its export records with one call, `skf-render-stack-metadata.py relabel`, instead of copying each label the check expects into the records and running the check again by hand. The helper runs the label check of `skf-render-metadata-stats.py`, sets each mislabeled field to the label the record's `extraction_method` implies, and rewrites the records file only when a label changed; the `export-labels-relabeled` warning lists what it changed. Where the check names no value, the helper picks one: an unknown or missing `extraction_method` becomes `source_reading` (nothing shows an ast-grep rule matched the export), a known one written in another case takes its usual spelling, and a record with no valid `signature_source` takes `T1` when an ast-grep rule matched it and `T1-low` otherwise. The code-mode `provenance-map.json` now gets its `entries[]` from the same records file and its `integrations[]` from the extraction bundle's pairs (with their co-import files) through `skf-render-stack-metadata.py provenance --records ... --bundle ...`, which writes the map in one atomic write, so the run no longer types every export record or integration pair a second time.
