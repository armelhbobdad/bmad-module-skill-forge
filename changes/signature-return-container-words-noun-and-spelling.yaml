type: fixed
scope: skf-test-skill
summary: |
  Test Skill's signature rules now read a container written in words one way in every language and with every word for its items. A list written in words states the source language's list or array type with that type argument, so `list of Nodes` is `list[Node]` in a Python skill and `Node[]`, the same type as `Array<Node>`, in a TypeScript or JavaScript one. A generic noun for the items, such as `objects`, `instances`, `items`, `values`, `entries` or `records`, is description, so the type name before it is the type argument and a documented `list of DataPoint objects` states `list[DataPoint]`, while a generic noun alone, as in `list of objects`, writes no type argument, which is then not compared. A type name made plural, such as `dicts` or `strs`, still names that type. Before, a judge could read `objects` as the type `object` and raise a Critical `signature-mismatch` gap on `list of DataPoint objects` against a source's `list[DataPoint]`, or read `list of Nodes` as Python's `list[Node]` against a TypeScript source's `Node[]` and raise one there, failing the hard gate, while another judge passed the same skill.
