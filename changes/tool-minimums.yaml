type: breaking
scope: skf-setup, installer
summary: |
  SKF now holds the tools it runs to the minimum versions in `src/shared/tool-requirements.yaml`, which the installer copies to `_bmad/skf/shared/`. v3.0.0 sets four: `Node.js` 22, `Python` 3.11, `git` 2.15 and `ast-grep` 0.45.3. uv, gh, ccc, qmd, tessl and skill-check have none yet, so they never warn. Setup no longer counts a tier tool below its minimum: an ast-grep older than 0.45.3 is reported unavailable (`below_minimum: true` in the detector output, `false` under `tools` in `SKF_SETUP_RESULT_JSON`), so the tier can drop (ast-grep 0.42 alone now gives Quick, not Forge), a re-run lists the tool in `tools_removed`, and `--require-tier` can fail where it passed. The envelope's `warnings` gain one `tool_below_minimum: <tool> <version> (minimum <minimum>)` entry per tool below its minimum; setup also checks git and uv, which are no tier tools, so below their minimum they only warn. No envelope field is added or removed. FORGE STATUS shows an upgrade line for each such tool at every tier instead of calling it no longer detected, and shows ccc's version when uv installed it. `install`, `update` and `status` now print each tool with the version found, `ok` or `upgrade to >= <minimum>` (or missing, optional, or `installed, version unknown`), and the command or page to upgrade or install it. The update notice now also prints after `install` and `update`, and `status` returns to the prompt in a terminal instead of waiting.
migration: |
  Upgrade each tool the report names, then run `/skf-setup` again: `npm install -g @ast-grep/cli@latest` for ast-grep, the latest release from <https://git-scm.com/downloads> for git, `uv python install` for Python and the current LTS release from <https://nodejs.org> for Node.js. A pipeline that checks the envelope's `warnings` one by one should accept the `tool_below_minimum:` prefix.
