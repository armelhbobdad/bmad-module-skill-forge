type: changed
scope: skf-export-skill
summary: |
  Export Skill's bundled `assets/snippet-format.md` now holds only the two snippet templates and the note on the lines scripts parse. Its Skill Root Path, Format Rules and Rules sections and the line bullets under the single-skill template are gone: step 2 (`references/generate-snippet.md`) states each of those rules, and the two copies had to change together. If `snippet_format_path` points Export Skill at your own copy, that copy now keeps the `|api:` label and the gotchas line's `; ` separator as they are, beside the lines it already kept, because Export Skill reads both lines of the prior snippet back to rank the api names and carry gotchas forward; the quick-start and key-types lines stay free to restyle. Delete an older copy's other sections too: step 2 now states each of those rules, and a copy's own can only disagree with them.
issues: [1164]
