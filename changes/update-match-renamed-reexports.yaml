type: fixed
scope: skf-update-skill
summary: |
  Update Skill's `--from-test-report` repair now finds an export a test report names by the public name of a renamed re-export. The recipe runner names each export after its declaration, so a gap naming `experimental_MockUniversalStore`, which the package re-exports from `MockUniversalStore`, matched nothing in the targeted re-extraction, and a blocking gap halted the run with `halted-for-remediation-path`. At Forge tier and above, `skf-build-change-manifest.py records` now lists in each record's `aliases` the public names the runner's entry-point diff gives its declared name in that file, and `gap-records` matches a gap by its exact name first, then by such a public name, within the gap's own paths. The repair documents the export under its public name and maps it as a barrel rename: the provenance entry keeps the declared `export_name` at the declaration's line, with `reexported_as` the public name, which metadata.json's `exports[]` lists, so the provenance check passes and a later repair of the same gap finds that entry. At Quick tier, or when the recipe runner finds no `ast-grep` it can run, such a gap still ends unresolved.
