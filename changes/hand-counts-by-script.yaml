type: fixed
scope: skf-create-skill, skf-update-skill
summary: |
  At Quick tier, in a run the recipe runner cannot serve, and for files no recipe reads, Create Skill no longer matches the brief's globs, counts the entry points or tells internal exports and extraction gaps apart by eye. It takes the files in scope, those in a language no recipe reads included, the entry points and the arms from `skf-extract-public-api.py` (full mode now ends its JSON with `files_in_scope_list` and `files_without_recipes_list`, and `--mode denominator` gives them with no recipe run, also from a remote repository's file list), and has `exports_public_api`, `exports_internal`, `effective_denominator` and the entry-point diff (`entry_point_diff`) made by script from the public names it finds, read with quick mode for a local Python, JavaScript or TypeScript source and by eye otherwise. Update Skill counts the same way where it counted by hand, at Quick tier included. When that script cannot run, or fails again after a second try, both workflows halt instead of counting by hand. The counts stored in `metadata.json`, which Test Skill reads as its coverage denominator, can change on those runs.
