type: breaking
scope: skf-test-skill
summary: |
  Test Skill now compares each form a skill documents a name in that lists parameters or gives a usage, such as a brief usage form in SKILL.md and a full props list in a reference file. `score-signatures.py plan` kept one form per name, so whichever form ranked first stood in for the others: a correct skill could get a false Critical `signature-mismatch` gap, and a wrong form went unchecked. The documented inventory now lists a name once per place the skill documents it, under one kind, and a check lists the name's other forms as `alternatives` (the fallback per-file scan reads them from the plan's `documentedAlternatives`). The judge compares the declaration with each form by that form's own reading rules and reports a mismatch for each form that does not match, naming it in the mismatch's new optional `form` key, and `score` grades each mismatch by its own form, so an optional member left out of a form the skill labels partial is an Info observation. A form's label lowers a grade only when the mismatch quotes that form's text as `documented_sig`; otherwise `score` warns and grades it against the form it quotes. The gap's title (`Signature mismatch: {name} (form 1 of 2)`) and Issue name the form, so the ledger keeps one gap per form. Entries that say the same thing are one form, and of two that differ only by a partial label, the full one stands. A form that lists no parameter and gives no usage is never an alternative, and a `form` the check did not offer is a warning, graded against the first form. A usage form is read as what it writes: a component usage such as `<Canvas of={Primary} />` as the names of the props it sets, a call as its arguments in order, and a JSX spread, children or a call's `...args` can pass a required member. Forms that were never compared now are, so a skill that passed can stop at the hard gate.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap for a form it did not compare before, correct the form the gap quotes as `documented_sig`, then run Test Skill again.
