type: breaking
scope: skf-audit-skill
summary: |
  Audit Skill no longer offers degraded mode, which had no baseline to compare against and could not finish: the `degraded` input, the degraded-mode gate and its `init.degraded-mode` entry in the envelope's `headless_decisions` are gone, and so is the report's Mode row (`confidence_mode`). A skill with no provenance map, such as a Quick Skill, now stops with the new halt reason `no-baseline` (exit `3`) in every mode, and names Test Skill and Create Skill; before, a headless run stopped there as `user-cancelled` (exit `6`). A docs-only skill is now audited by its documents: the audit compares each document's hash with the one recorded at compile time, grades each changed document HIGH (the new `--doc-drift` input of `skf-severity-classify.py`), so the score is `SIGNIFICANT` and `next_workflow` is `update-skill`, or `CLEAN` when nothing changed. A docs-only skill that records no document hash stops with `no-baseline`, and one none of whose documents could be compared (offline, for example) stops with the halt reason `source-unreadable` (exit `3`); when only some could not be compared, the envelope's `warnings` carry `doc_fetch_failed` or `doc_not_hashed` with their counts. A stack built from code is now audited, from the project root it was scanned from and library by library, where it stopped at `source-dir-missing`. Audit Skill now checks `uv` and its shared helpers before the first question and stops with `helper-missing` when one is missing, so it no longer falls back to diffs, grades or hashes made by hand; a skill-inventory helper that is missing or crashes is now `helper-missing` instead of `skill-not-found`, and a missing script and asset hash helper skips that check with a note instead of halting. The `severity_rules_path` setting is removed: `skf-severity-classify.py` grades every finding by its own rule table, so the setting changed grades only in the by-hand fallback, which is gone. `drift_report_template_path` now names its default, `assets/drift-report-template.md`, and the comments of `customize.toml` say to keep a template copy outside the skill folder, named from `{project-root}`, what the copy must keep, and that `on_complete` is a shell command run from the project root once a finished audit's result file is written.
migration: |
  Drop `degraded` from audit-skill invocations and `severity_rules_path` from `_bmad/custom/skf-audit-skill.toml` and `skf-audit-skill.user.toml`. For a skill without a provenance map, run Test Skill (`@Ferris TS`) to check it against its source, or re-create it with Create Skill (`@Ferris CS`) to make it auditable. A pipeline that matched `user-cancelled` or an `init.degraded-mode` decision for such a skill matches `no-baseline` instead. Run audits where `uv` is installed.
