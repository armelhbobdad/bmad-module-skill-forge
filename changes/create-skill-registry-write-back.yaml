type: added
scope: skf-create-skill, skf-brief-skill
summary: |
  When you confirm or correct the demo files Create Skill leaves out of a component library, or confirm or name its registry file, the run now records your answer in the brief's `scope.demo_patterns` or `scope.registry_path` through the new `skf-write-skill-brief.py amend`, which keeps the previous brief as `skill-brief.yaml.bak` and adds a `scope.amendments` entry with the new `demo-and-registry` category, so the next run of the same brief asks neither question and a later headless run uses the registry you named instead of scoring candidates again. A registry path in the brief that can no longer be read is replaced the same way once you confirm or name another. A headless run's automatic choices are never written back. The new `skf-detect-registry.py` lists the files in the brief's scope, counts the demo files, scores the registry candidates and lists the chosen registry's entries with their lines, and a headless run accepts a candidate only when it scores 7 or more out of 9. When the brief sets `scope.demo_patterns`, the run also names the demo files of the usual kinds those patterns leave in. `skill-brief.v1.json` now lists `scope.registry_path`, `scope.demo_patterns`, `scope.ui_variants` and `scope.amendments`, and `skf-write-skill-brief.py` accepts and writes the three component-library fields. A missing field inside an object of the brief, such as a `scope.rationale` with no `reason`, is now reported by its full path (`scope.rationale.reason`).
