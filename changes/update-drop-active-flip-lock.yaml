type: fixed
scope: skf-update-skill, skf-drop-skill, skf-create-skill, skf-quick-skill, skf-create-stack-skill
summary: |
  On Linux and macOS, Update Skill and Drop Skill now take `active.skf-lock` when they point a skill's `active` link at a version, the lock Create Skill, Quick Skill and Create Stack Skill take for that flip, so these flips of the link run one at a time. When another run's flip of the link landed during Update Skill's own flip, Update Skill could stop with `halted-for-write-failure` saying the flip did not apply though it had, roll back the new version, and suggest an `ln -sfn` that pointed `active` at the removed folder; when two runs moved one skill's link at nearly the same moment, Drop Skill could record `active_link_dangling` with a fix that undid the other run's flip; and two such runs could fail with exit 1 and a `No such file or directory` error. Now a run waits while another flip holds the lock. When it stays held for 5 seconds, Update Skill stops with `halted-for-concurrent-run` (`error.phase` `write:active-symlink`, `error.reason` starting `busy:`) and undoes what it wrote, and Drop Skill records `active_link_dangling` with a fix to run once the other run has finished. A Create Skill, Quick Skill or Create Stack Skill flip that meets one of these flips now gets the documented `another process holds flip lock` refusal, where it used to go through.
