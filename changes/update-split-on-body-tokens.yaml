type: fixed
scope: skf-update-skill
summary: |
  Update Skill now splits the `SKILL.md` body when skill-check reports `body.max_tokens`, as it already did for `body.max_lines`, so an update that adds content no longer leaves the token warning in place and the quality score at 90. It runs `skf-shard-body.py`, which moves the largest `## Full` sections to `references/` until the body is within 400 lines (500 when only the token warning is reported) and 4,500 words, keeps Tier 1 inline and never moves a section a [MANUAL] block reaches into. `skill-check split-body` now runs only when that helper is missing. When no such section is left to move, the run records a `Spec compliance: WARN` with that reason in `warnings[]` instead of trimming Tier 1; a helper that fails stops the run with `blocked` (`write:body-split`), naming any reference file it already wrote; and the evidence report's Validation Summary lists each section a split moved. `skf-shard-body.py` gains `--word-budget` and `--skip-manual`, and its report gains `body_words_before`, `body_words_after`, `under_word_budget` and `word_budget`.
