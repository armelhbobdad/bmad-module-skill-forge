type: breaking
scope: skf-test-skill
summary: |
  Test Skill now reads what a documented form that writes no parameter list claims about parameters from the form itself when it grades a mismatch the signature judge tags `annotation-contradicted`. A form with no `params` and no usage form claims nothing about parameters, so such a mismatch whose other facts check is an Info `observation` titled `Annotation contradicted: {name}` however the judge writes the form, `-> Environment` or `() -> Environment`, and whatever parameters the source takes. Before, the judge's text was compared with the source's parameters: written by its return alone it had no parameter group, and the mismatch was a Critical `signature-mismatch` gap that failed the hard gate on a correct form. A form with `params: ""` or `[]` claims the export takes none and is compared as `()`: Info against a declaration that takes none, and Critical against one with a required parameter even when the judge copied the source's parameters into its `documented_sig`, which used to pass. A name the skill writes both ways with one return, with `params: ""` in one place and no `params` in another, is compared as the form that claims none, whichever the inventory lists first. The signature rules now say what a form with no `params` key claims, and that its contradicted return is tagged too.
migration: |
  If a skill now stops at the hard gate on a `signature-mismatch` gap for a form whose `params` is `""` or `[]` while the source takes a required parameter, write the parameters the source declares (the gap's `source_sig`) in the skill's signature for that name, then run Test Skill again.
