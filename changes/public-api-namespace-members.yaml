type: changed
scope: skf-create-skill, skf-update-skill, skf-audit-skill, skf-test-skill, skf-brief-skill, skf-analyze-source
summary: |
  For a submodule a package exports by name (`from . import sub`, `export * as ns`, a Rust `pub mod`), the recipe runner now lists in its `entry_point_diff.public` item a new `members` key: the names the module passes on, which users call as `pkg.sub.name`, each with the file and line that define it, a nested submodule's members in its place (`members` is null for a module the runner cannot read, such as a JavaScript target outside the repository or a Rust inline module). `counts.exports_public_api` and `counts.effective_denominator` count the members in place of the submodule, each name and file once, and a member no recipe found is an extraction gap, or outside scope when its file is. A member the module re-exports from another package has no file, is no gap when a recipe found its name, is marked public by its name, and, unlike the same form in an entry point, adds no `entry_points.unresolved` item, so the public surface still applies. For a `public-api` skill, Create Skill and Update Skill now mark the members public, so the provenance map, SKILL.md and `exports[]` document them, and no longer mark public an export named like the submodule in its folder. Test Skill's surface, Brief Skill's headless `public-api` include and tier-A candidates, and Analyze Source's `api_surface` read the members too. On cognee 1.6.2 with the oms-cognee brief, the 4 submodules give way to 43 members (`visualization_server`, the 8 `cognee.tools` functions, `Task`, `run_pipeline` and `export_dataset` among them), and `exports_public_api` moves from 64 to 102. A `public-api` skill made before this change keeps its map, so its `public_api_coverage` falls until an update documents the members (the gaps Test Skill reports, through a gap-driven Update Skill): oms-cognee 1.6.2 from 0.875 to about 0.55.
