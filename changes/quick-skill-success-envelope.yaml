type: added
scope: skf-quick-skill
summary: |
  Quick Skill now ends a finished run with a `SKF_QUICK_SKILL_RESULT_JSON` line on stdout, where only its HARD HALTs printed one before, and the shared emitter builds every such line, a halt's included, and checks it against the new `skf-quick-skill-result-envelope.v1.json` schema. The success line gives `skill_package`, the files written in `outputs`, and a `summary` with `quality_score` (the skill-check score of the written package, null when skill-check did not run; not a test-skill score), `confidence`, `repo_shape`, `language_resolution`, `detected_languages`, `zero_exports_rescue`, `active_pointer`, `exports_documented` and `validation_issues`. Every line now also carries `halt_reason`, `timestamp`, `run_id`, `result_path`, `headless_decisions` (each gate a headless run resolved by its default, such as overwriting an existing package, recorded as it decides) and `warnings`, among them `also_found_in` when a headless run kept the first registry's pick of a package name another registry also holds; `quick-skill-result-latest.json` carries the same decisions and warnings. With `--batch`, each `results[]` entry of the batch summary carries its target's `quality_score` and `batch` number, and the summary and its `batch_summary` event carry the batch's `exit_code`. A run keeps its staged payloads in a run folder under `_bmad-output/.skf-run/`, deleted when it finishes; a run that cannot create that folder stops at once with exit code `4` (`write-failure`). A headless run started with no target now stops with exit code `2` (`input-invalid`) and its envelope, where it stopped with neither.
