type: breaking
scope: skf-test-skill
summary: |
  Test Skill now holds a real run lock. Before it writes the test report, it takes `.test-skill.lock` in the skill's version folder in the forge data through the shared run-lock helper, and a second run against the same skill version halts with `another-run-active` (exit 1) while the first run's lock is fresh. Before, the lock was an `flock` that no step could hold across tool calls, so two runs could overwrite each other's `skf-test-skill-result-latest.json` and `another-run-active` never fired. A run renews its lock before it writes the result files, and every halt after the lock releases it, as do both ways a run ends, with and without `--no-health-check`. A lock left by a run that crashed now blocks the next run until it goes stale, 60 minutes after it was taken or last renewed. The run id in `test-report-<skill>-<run_id>.md`, `skf-test-skill-result-<run_id>.json` and `runId` is now the UTC time and eight random hex digits, without a process id. The lock, the version lookup and the workspace drift check all run through `uv`, so a run now checks for `uv` and `python3` first and halts when either is missing, where it used to finish as a capped FAIL.
migration: |
  When a run halts with `another-run-active` and no other Test Skill run is active for that skill, delete the lock file the message names, or re-run after the time the message gives, when the lock goes stale. A pipeline that parses a Test Skill run id should read only its leading UTC time. Install `uv` and `python3` before you run Test Skill.
