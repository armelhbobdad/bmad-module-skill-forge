type: fixed
scope: skf-test-skill
summary: |
  Test Skill's documented inventory now reads a function written with empty parentheses in running text or a description cell as a mention whatever comes before its name, such as `await cognee.disconnect()` after `await` or through a module path, so its entry leaves `params` and `usage_signature` out. Before, the inventory contract also recorded any call after `await`, `new` or an assignment, or through a receiver or module path, as a usage, so one reader recorded no form and another an empty call, which gave a function with a required parameter a Critical `signature-mismatch` gap on one run and none on the next. In running text or a description cell, a call expression is now a usage only when it passes an argument. An empty call in a heading, an export table's first cell, a call or signature column or a fenced example is still a form, compared as before.
