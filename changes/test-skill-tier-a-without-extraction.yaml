type: breaking
scope: skf-test-skill
summary: |
  Test Skill's deflation and inflation guards no longer stay off at Quick tier, or in the per-file scan it falls back to when the recipe runner printed no JSON, just because the skill brief lists a `scope.tier_a_include` glob. At Quick tier a tier A glob whose folder or file differs from every `scope.include` glob's before any wildcard (such as `gen/**` beside `src/**`) counts no name, as it already did at Forge tier. The per-file scan now passes `--fallback-scan`, since each of its results names the file that defines its exports, so a tier A list that matches no file, only files `scope.include` leaves out, only files `scope.exclude` drops or only files that define no public name counts no name there too. A stored `stats.effective_denominator` far below the re-derived surface then raises a Medium `metadata-drift` gap and can be scored over the `scope.include` set, so Export Coverage can fall and a run that passed can fail.
migration: |
  Re-run Create Skill on each skill whose brief has a `scope.tier_a_include` list that counts no public name (matching no file, only files outside `scope.include`, only files `scope.exclude` drops, or only files that define no public name), then Test Skill. On a `metadata-drift` gap that says no `scope.tier_a_include` glob in the brief counts a public name, edit or remove those globs in the skill brief by hand, then re-run Create Skill.
