type: breaking
scope: skf-brief-skill
summary: |
  Headless Brief Skill no longer stalls or guesses at the scope boundaries when you pass no `include`: each scope type takes a stated default, and the result envelope's `warnings` names it (`warn: headless boundary default <type>: <what was chosen>`). `full-library` includes the modules the analysis found, `public-api` the files that define the names the package's entry points export (traced by the recipe runner, with full-library boundaries when it cannot trace), `component-library` the full-library boundaries plus the registry and demo patterns `skf-detect-registry.py` finds and every design system variant, and `specific-modules` the modules your `intent` or `scope_hint` names. An `exclude` passed without `include` is added to the default's exclusions. When `specific-modules` came only from the module-count rule (six or more modules, none named), the brief now gets full-library boundaries, and `scope.rationale` records the switch. A `scope_type=reference-app` argument without `include` halts with `input-missing` (exit `2`) before the repository is read, and so do a `reference-app` type the recommendation picked and a `scope_type=specific-modules` argument that names no module, at scope definition. The headless arguments are now checked, and a `preset` merged, before anything uses them, so a preset's `intent` reaches the description. An interactive `[R]` Revise Scope pass on a ratified brief now keeps its `scope.amendments`, `scope.registry_path`, `scope.ui_variants` and `scope.demo_patterns` instead of dropping them, and the component-library questions show the registry candidates `skf-detect-registry.py` scores and the demo patterns it counts. Brief Skill drops the `brief_schema_path` setting: a value set in `_bmad/custom/skf-brief-skill.toml` is ignored. Interactive runs wait once fewer at the end of each of the first three steps (the summary and the proposed description share one message, the analysis no longer pauses before scope definition, and scope definition goes straight to the brief review, which keeps `[X]` to cancel), and `BS[auto]` no longer describes an approve, edit or reject menu that a pipeline, which always runs it headless, never showed.
migration: |
  Pass `include` (comma-separated globs) to a headless run whose scope type is `reference-app`, or that passes `scope_type=specific-modules` without naming the modules in `intent` or `scope_hint`. To keep a scope narrower than full-library on a library with many modules, pass `scope_type` and `include`. Remove `brief_schema_path` from `_bmad/custom/skf-brief-skill.toml` and `skf-brief-skill.user.toml`: nothing replaces it, because the brief writer's schema decides what a brief holds.
