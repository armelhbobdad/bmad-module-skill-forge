type: breaking
scope: skf-test-skill
summary: |
  Test Skill's documented inventory now gives each form of a place that writes several forms of one name, such as two overloads in one row, an entry of its own with that same `at`, so the signature check compares each form on its own and a form that matches an overload is no mismatch. A list `params` now holds the members of one parameter list, one per item, never one form per item, and `validate-inventory.py` exits 2 on a list of two or more items one of which holds several parameters, naming the entry and the item, so the reader is re-dispatched with that violation. Before, the inventory contract said to list a name once per place and never defined a list `params`, so a reader could record oms-storybook-react-vite's two `actions` overloads as one entry whose items the scripts joined into one parameter list that matched neither overload: a Critical `signature-mismatch` that failed the hard gate and told Update Skill to rewrite correct documentation. A run whose reader writes such a list twice now halts `inventory-invalid`.
migration: |
  If Test Skill halts `inventory-invalid` on a `params` item that holds several parameters, run Test Skill again: the skill under test needs no change.
