type: breaking
scope: skf-test-skill
summary: |
  Test Skill's documented inventory now gives each form of a place that writes several forms of one name, such as two overloads in one row, an entry of its own with that same `at`, so the signature check compares each form on its own and a form that matches an overload is no mismatch. A list `params` now holds the members of one parameter list, one per item, never one form per item, and `validate-inventory.py` exits 2 on a list of two or more items one of which holds several parameters or writes a whole form (such as `(...handlers: T[])` or `actions(...handlers: T[])`), or two of which name the same parameter, naming the entry and the items, so the reader is re-dispatched with that violation. A generic function type (`fn: <T, U>(x: T) => U`), a numpy docstring member's `, optional` marker and a Rust lifetime (`&'a str`) are read as part of one member, and the violation also offers the whole list as one string. Before, the inventory contract said to list a name once per place and never defined a list `params`, so a reader could record oms-storybook-react-vite's two `actions` overloads as one entry whose items the scripts joined into one parameter list that matched neither overload: a Critical `signature-mismatch` that failed the hard gate and told Update Skill to rewrite correct documentation. A run whose reader writes such a list twice now halts `inventory-invalid`.
migration: |
  If Test Skill halts `inventory-invalid` on a list `params` it refused, run Test Skill again: the skill under test needs no change.
