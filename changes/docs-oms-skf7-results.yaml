summary: |
  Verifying a Skill now quotes strict SKF 7.0.0 tests of the version each of oh-my-skills' four reference skills ships. oms-cocoindex and oms-uitripled pass at 100% and oms-storybook-react-vite at 98.23%; oms-cognee is blocked by two false positives, a documented function compared with another of the same name (#918). The page says how the first 7.0.0 tests and two or three rounds of hand fixes per skill found real errors in all four skills, the two that first passed included, and which open calls the storybook and uitripled passes turn on. `docs/_data/pinned.yaml` records the new scores (`test_score: null` for oms-cognee), the storybook worked example ends with its 7.0.0 pass, and the skill model's oms-cognee excerpt shows its new counts (t1 36, t1_low 50).
