type: fixed
scope: all workflows
summary: |
  Two health-check reports of one defect filed at the same moment no longer close each other: the repository's dedup Action now closes a report only in favour of an earlier open one with the same fingerprint, and flags a possible duplicate only against an earlier one. It acts when an issue is opened or gets the `health-check` or an `fp-*` label, so a maintainer's triage label no longer re-closes a duplicate they reopened or re-flags an issue they un-flagged, and it adds the `possible-duplicate` label before its comment, so a failed call leaves no comment to repeat. A reporter without push access to the health-check repository can now file a first report: the health check creates the `fp-*` label on its own and goes on when that fails, runs `gh issue create` once more without `--label` when the create fails, and records the issue either way. The Action then labels an issue filed without labels from its `[health-check][<severity>][<fp>]` title, or from its `## Fingerprint` and `## Severity` sections (a template filing whose labels were dropped), before it dedups it, and never takes the `Section fingerprint:` line or the template's placeholder for its fingerprint. It reads an issue's labels, its title and the `## Fingerprint` and `Section fingerprint:` lines of its body in any letter case, and uses the fingerprint in lower case, so an issue labeled `FP-ABC1234` is deduped as one labeled `fp-abc1234`. The command the local queue prints for a saved finding sets no label either, and now says it needs no push access.
