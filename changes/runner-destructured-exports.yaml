type: changed
scope: skf-analyze-source, skf-audit-skill, skf-brief-skill, skf-create-skill, skf-test-skill, skf-update-skill
summary: |
  The recipe runner (`skf-extract-public-api.py --mode full`) now reads the names bound by a destructuring pattern that opens an `export const`, `let` or `var` statement, such as storybook/test's `export const { fireEvent, within } = lib;`, whether the names share the line or sit on lines of their own. Each such name the package's entry points export, directly or through `export *`, is now on the public surface (`entry_point_diff.public`, counted in `exports_public_api` and `effective_denominator`) and, since no recipe matches it, an `extraction_gaps` row at its own line, so Create Skill's read-by-eye pass is pointed at it. Before, these names reached neither list and no warning named them. Analyze Source, Audit Skill and Brief Skill read the runner's public names, counts and gaps, so their public-API counts and surfaces now include these names, and a skill that does not document them can show new missing exports in Test Skill. A pattern after the statement's first declarator (`export const a = 1, { b } = o`), or one the runner cannot read (one that does not close, or a default holding a template literal over several lines), still binds nothing with no warning, so read it by eye. Quick mode (`--mode quick`) is unchanged: it still warns about the statement and leaves its names to be read by eye.
