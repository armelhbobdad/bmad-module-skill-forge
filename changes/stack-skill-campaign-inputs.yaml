type: added
scope: skf-create-stack-skill
summary: |
  Stack Skill now declares and binds the headless inputs `skills` (the libraries to rank in code mode, or the constituent skills in compose mode, each a skill name or a package path, which `skf-enumerate-stack-skills.py candidates --explicit` now accepts), `stack_name` (the stack's skill name and folder, with `-stack` appended when it lacks it; `{project_name}-stack` when absent), `scope_overrides` and `architecture_doc_path`, beside `project_path` and `mode` (an explicit `mode` wins over `architecture_doc_path`), so a campaign capstone can name its constituents and its stack. A headless run given `skills` in a project with no manifests composes those of them SKF generated, as before, and ranks them as libraries when none is an SKF skill instead of stopping with `resolution-failure`. Compose mode picks and gates its constituent skills with `skf-enumerate-stack-skills.py candidates`, and the first step decides the mode from that helper and `skf-scan-manifests.py`. The `SKF_STACK_RESULT_JSON` envelope and the result contract's `summary` gain `quality_score`, the skill-check score of the committed stack (`null` when skill-check did not run and on every error; it is not a test-skill score). An input the run cannot use (a `project_path` that is no folder, an `architecture_doc_path` that is not a readable file, a `stack_name` that `skf-validate-frontmatter.py --check-name` refuses once `-stack` is appended, such as one over 64 characters or with two hyphens in a row, an unknown `mode` or `scope_overrides` value) stops it before any question with exit `2` and the new halt reason `input-invalid`.
