type: fixed
scope: skf-update-skill, skf-audit-skill
summary: |
  Update Skill no longer reports a module, an alias that renames, a dunder such as `__version__` or another underscore name as a `DELETED_EXPORT` while the changed file still declares it. The recipe runner never reports these names, and the export check read again only the names the runner itself flagged. A new `skf-build-change-manifest.py baseline-gaps` call now lists, at every tier, each provenance map entry of a modified file that the runner did not report and whose file still declares it, into `baseline-gaps.json`, and the export check reads each one by eye with the map's kind while the declaration keeps it, recording each name and file once. An entry no rule can check (a file neither Python nor TS/JS, a test file, a path through a symlink, or a dotted module name) is listed in `unchecked`, and the export check records it only when its file still declares it; Audit Skill's extraction snapshot now names such entries in its warning instead of dropping them in silence. An entry its file no longer declares is still reported deleted. The selection is the one Audit Skill's extraction snapshot uses, now shared from `skf-verify-provenance-completeness.py`, and a verifier that cannot be loaded halts the run with `detect-changes:category-b`.
