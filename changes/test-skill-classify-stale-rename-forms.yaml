type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer reports a Critical `fabricated-signature` gap, which blocks the hard gate, for a documented name the source exports by renaming the cited declaration in a form `classify-stale` did not read: `export { default as Button } from './Button'`, `export const Foo = FooImpl`, `type Foo = FooImpl`, Python `Foo = _Foo`, an import renamed then re-exported, a quoted `as "Foo"`, an export list after a block comment, a Python import inside a module-level `try` or `if`, a file that declares the name before it renames to it, and a cited module that is itself the default export. Each such name is now `aliased`, an Info documented extra at the rename's line. `classify-stale` in `skf-verify-provenance-completeness.py` also resolves the rename's relative `from` module and the import that binds the renamed name, so a rename of another file's same-named declaration stays fabricated, while a package it cannot resolve keeps the earlier rule.
