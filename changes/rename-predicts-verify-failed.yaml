type: breaking
scope: skf-rename-skill
summary: |
  Rename Skill now checks, before it copies anything, whether the rewrite would leave the old name where the final no-trace check refuses it, for example in a `metadata.json` `description` that names the library the skill is named after. On a match it stops with `verify-failed` (exit `5`, phase `select:predict-verify`), with nothing changed, and names each file of the old skill to edit, with the line number and text of that file as the rename would write it: a JSON file comes out indented, so find the line by its key. `--dry-run` runs the same check, so a dry run of such a skill now stops with exit `5` where it exited `0` and the real run then rolled back. A missing `skf-rewrite-skill-name.py` now stops the run at `select:start-run`. A file of the old skill the rewrite cannot read stops it at `select:predict-verify` (`write-failed`, exit `4`), before the copy, and so does a missing `skf-verify-no-trace.py`, which stopped it at `execute:resolve-helpers` before.
migration: |
  For each line the message names, edit or remove a note an earlier run wrote, or a `context-snippet.md` line such as `|gotchas:`, in the old skill's file, then re-run the rename. When the line names the library or repository the skill is named after, the skill cannot be renamed: create it again under the new name with Brief Skill and Create Skill.
