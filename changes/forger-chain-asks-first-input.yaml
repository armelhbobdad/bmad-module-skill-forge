type: added
scope: skf-forger
summary: |
  A chain of codes whose first workflow lacks its input, such as `QS TS EX` or `QS TS EX --pin 1.2.0`, no longer starts a pipeline that stops at that workflow for it. Ferris now asks for the input first and runs the chain with it in brackets, as `QS[cocoindex] TS EX`: a project path for `AN`, a target for `QS`, an architecture document for `VS` and `RA`, and a skill name for `CS`, `TS`, `EX`, `US` and `AS`, looking past a leading `SF`. A bare `BS CS TS EX` asks for a target and a skill name and runs as `forge <repo-url-or-path> <skill-name>`. A headless run asks nothing and stops before any workflow runs, with a halt reason such as `QS needs a target before the pipeline can start: give it as QS[<target>]` in a failed pipeline result, and leaves no stopped chain to resume. A chain no bracket can complete (one led by `RS` or `DS`, any other chain led by `BS`, or a first code whose bracket already holds `min:N` or `auto`) stops there the same way, with a reason that names what no bracket can give, and asks for another invocation when it is not headless. A headless chain led by `CS` still leaves the brief to create-skill, which compiles the only brief and halts naming them when there are several.
