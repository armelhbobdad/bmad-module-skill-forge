type: changed
scope: skf-test-skill
summary: |
  Test Skill no longer records a Medium `stale-documentation` gap, with advice to update or remove the documentation, for a name the skill documents at a file whose `export *` or `export type *` from another package no script reads, such as a `@vitest/spy` type cited at a file that holds `export type * from '@vitest/spy'`. The run met each such star in the recipe runner's output, in quick mode's `unlisted` records or in a per-file result's `unresolved_stars`, but listed it only in Coverage Analysis, so the gap ledger could not tell a name passed on through it from a removed one. The run's `surface.json` now lists each such star in `unresolvedStars`, and a stale name that no source file declares and that the skill's citations place at a file holding one is an Info `observation` titled `Not checked by script: {name} (another package's export *)`, at the line that documents it, which names the star and asks no change unless that package lacks the name; a Deep-tier hand-written `Not checked by script: {name}` at that line stays a gap of its own. A name cited at any other file, one the brief scopes out and a fabricated signature keep their gaps.
issues: [1005]
