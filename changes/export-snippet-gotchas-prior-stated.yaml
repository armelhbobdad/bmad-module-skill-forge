type: fixed
scope: skf-export-skill, skf-update-skill
summary: |
  On a re-export, Export Skill now keeps a prior `|gotchas:` pitfall without the `[CARRIED]` marker while the current SKILL.md still states the pitfall's main claim anywhere, in any wording, its frontmatter description, Overview and other prose included. Before, such a pitfall counted as no longer stated unless a T2-future annotation in the evidence report, a gotchas-type section, a deprecated or removed `## Key API Summary` row or a Quick Start `await` call stated it, so a skill whose SKILL.md has no gotchas-type section had its whole gotchas line marked `[CARRIED]` and then dropped on the export after, under a warning that said SKILL.md no longer stated them. New gotchas still come only from those places, so the line stays the same from export to export, and a pitfall the old rule already dropped comes back only through them. A prior pitfall that joins several warnings, as a gotchas bullet often does, stays while one T2-future annotation or one of those bullets, rows or Quick Start calls states it whole, and is written once. One that SKILL.md states only in parts or only in other prose, such as an older line read whole, is still carried at most once, while a slot is free, and then dropped. A new gotcha left without a slot, because prior pitfalls still stated come first or earlier new gotchas fill the line, is now named in a warning, which says how to free a slot. Update Skill regenerates a snippet by the same rule.
issues: [1092]
