type: fixed
scope: skf-brief-skill, skf-analyze-source, skf-quick-skill
summary: |
  Brief Skill now looks up the version of a source whose manifest states none, as its version rules document, and a script does the lookups: a Python package with a dynamic version reads `__version__` from its package or `_version.py`, or `version=` from `setup.py`; a Rust crate that inherits its workspace version reads the workspace root's `Cargo.toml`; and any source, a Go module included, then takes its release tag. On GitHub that is the newest tag whose name is a release version, so a repository that tags releases without publishing a GitHub Release counts too, or the pinned tag itself; for a local source it is the tag `git describe` names. Before, the brief recorded `1.0.0` with no warning, and Create Skill could then build the skill from an old `v1.0.0` tag. A JavaScript or TypeScript source on GitHub whose default branch carries a pre-release version (`-alpha`, `-beta`, `-rc`, `-next` or `-canary`) now takes the newest release instead, as the version rules say. A brief whose version still falls back to `1.0.0` carries a `no source version detected` warning, in the `SKF_BRIEF_RESULT_JSON` envelope of a headless Brief Skill run that derives the brief and in Analyze Source's brief preview. The public API extractor Quick Skill also uses now reports a Cargo `version.workspace = true` as no version, with a warning, instead of passing the table on.
