type: fixed
scope: skf-test-skill
summary: |
  Test Skill's signature rules now say how a call to a class is compared, so a correct constructor call no longer depends on the judge's reading. A call to a class is compared with its constructor's parameters after its leading `self` or `cls` (Python's `__init__`, else `__new__`, else the nearest base's; the fields a dataclass, attrs class, pydantic model or NamedTuple generates; a TypeScript or JavaScript `constructor`), a call to an instance with its class's `__call__`, and a name bound to a class with that class's constructor. A leading `self`, `cls`, `&self` or `this: T` the source writes is never compared, as the scoring script already reads it. An extra positional argument exists when the declaration takes `*args` or a rest parameter, and any keyword exists when it takes `**kwargs`, so `Task(fn, max_chunk_size=512)` matches an `__init__` that takes `**kwargs`. A class whose constructor is written only outside the source tree, such as an `Exception` subclass that declares none, counts as matching. Before, a judge that read a call's first argument as `self`, or a keyword only `**kwargs` takes as unknown, reported a Critical `signature-mismatch` gap that blocked the hard gate.
