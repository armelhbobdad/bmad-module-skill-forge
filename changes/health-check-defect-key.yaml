type: changed
scope: all workflows
summary: |
  A health-check finding's fingerprint now includes a defect key: one to four lower-case words that name the thing the fix would change, such as a function, a flag or a rule, in the step file's or the code's own words (`floor-check`, `orphan-action`), or for a missing rule the case it should cover. The fingerprint hashed only the severity, workflow, step file and section, so two different defects of one severity in one section got the same fingerprint, and the dedup Action closed the later report as a duplicate of the earlier one: Test Skill's `inventory-contract.md`, which has a single heading, had only three fingerprints in all, one per severity. Each issue now records its section, its defect key and its section fingerprint (the same hash without the key), so anyone can recompute it. Opening a new issue anyway at an exact match now means naming the defect more specifically, since an issue under the same fingerprint would be closed. When no open issue has the same fingerprint, the health check searches for the section fingerprint, which finds issues filed by an SKF version whose fingerprints carry no defect key and reports from the same section under another key, and it still reads seen-cache records written by such a version. Such a match is a possible match only: the health check shows the issue with the usual choices to react, comment, open a new issue or skip, and never skips a finding or upvotes an issue on that match alone; a fixed issue found that way is linked in a `## Regression` section as a possible regression, without the REGRESSION title marker.
