type: changed
scope: all workflows
summary: |
  A health-check finding's fingerprint now includes a defect key: one to four lower-case words that name the thing the fix would change, such as a function, a flag or a rule, in the step file's or the code's own words (`floor-check`, `orphan-action`). The fingerprint hashed only the severity, workflow, step file and section, so two different defects of one severity in one section got the same fingerprint, and the dedup Action closed the later report as a duplicate of the earlier one: Test Skill's `inventory-contract.md`, which has a single heading, had only three fingerprints in all, one per severity. Each issue now records its section and defect key beside its fingerprint, so anyone can recompute it. Issues and seen-cache records made before this change are still found by their old fingerprint, as a possible match only: the health check shows such an issue with the usual choices to react, comment, open a new issue or skip, and never skips a finding, upvotes an issue or marks a regression on that match alone.
