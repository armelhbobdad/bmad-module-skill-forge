type: fixed
scope: skf-update-skill
summary: |
  Update Skill's `--from-test-report` repair now reads the skill brief's scope and never repairs an export from a file a gap cites or its Remediation names that the scope leaves out. In 5.0.0 a gap whose Source was another package's file that declares the name itself, such as Vue's own `definePreview` while the provenance map holds `@storybook/react-vite`'s, rewrote the export's documentation from that file, and a gap on a name the map does not hold was re-extracted from a cited or Remediation file outside the scope and added to the map. Such a gap now ends `unknown`, whatever its severity and with no halt: `cited-elsewhere` with `citation_check` `outside-scope` when the map holds the name, `outside-scope` otherwise; the map and the documentation stay as they were, and a `provenance:` warning names the file and the fix (when the skill covers it, change the brief's `scope.include` or `scope.exclude` so the scope takes it, else re-run Test Skill). A skill with no brief repairs as before, and so does a file the scope takes, so when the scope takes several packages that declare the name, still check each gap's Source before the repair. Each verification record `skf-build-change-manifest.py gap-records` writes now carries `outside_scope`, the files the gap names that the scope left out.
