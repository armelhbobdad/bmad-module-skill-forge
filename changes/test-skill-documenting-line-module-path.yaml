type: fixed
scope: skf-test-skill
summary: |
  A stale name's gap in Test Skill's Gap Report now cites the line that documents the name when the skill writes it only as a module path, such as `cognee.exceptions` for `exceptions`: a code span, a heading or an export table's first cell that is a dotted path whose last segment is the name, after a call's `(` is cut (`pkg.connect(url)`), and whose first segment is a module the skill's code blocks import (`import cognee`, `from cognee.x import y`, `import a.b as c` or `import * as ns from`), now documents it. Such a name's Medium gap used to cite a bare `SKILL.md` and ask to update or remove its documentation there, and each of its gaps had an Issue that read "the skill documents"; its Source, Issue and remediation now name that line, and the Issue of a documented extra opens with it too: oms-cognee's `exceptions` and `migration`, documented extras at their packages, now have Issues that open with their module headings, `SKILL.md:286` and `SKILL.md:185`. Such a code span ranks below one that is the name itself and above a declaration in a fenced code block; a path that ends in another name, one written among other words, and one through a receiver or a type (`client.connect(url)`, `Client.connect`, `store.state`) still document nothing. Scores, the hard gate and the gap count are unchanged.
