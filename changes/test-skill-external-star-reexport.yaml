type: changed
scope: skf-test-skill
summary: |
  When Test Skill reads a file by eye (a file the recipe runner could not parse, a statement the Quick-tier parser warns about, or the fallback per-file scan), an `export *` or `export type *` from another package now adds no name to the surface, as the recipe runner leaves such a star unresolved; a named re-export from another package still counts. Each per-file result lists those statements in `unresolved_stars`, and the Coverage Analysis section names them as unresolved. A run used to decide alone whether, and which, of the package's names to count, so one skill's tier A set and Export Coverage changed from run to run: oms-storybook-react-vite counted none, six or all 19 `@vitest/spy` types across three runs. A skill that documents names such a star brings in, including the names Quick Skill takes from a package's README for it, now gets a `stale-documentation` gap for each at every tier, as it already did where the recipe runner read the file.
