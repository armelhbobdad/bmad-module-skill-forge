type: changed
scope: skf-verify-stack
summary: |
  Verify Stack's coverage, integrations, requirements and synthesize steps now write their part of the feasibility report through a new helper, `skf-report-update.py`, which edits only the frontmatter keys, table rows or section a call names, so a later step no longer rewrites what an earlier one wrote and no frontmatter count or rendered table row is copied by hand. The `## Evidence Sources` rows are rendered from the skill inventory (`skf-coverage-tally.py --kind evidence --render`), and a skill whose evidence tier is off the scale stops the run (exit `7`, `inventory-unreliable`, phase `synthesize:report`) instead of reaching the next run's delta. The report gains four subsections: `### Integration Details` below the canonical verdict table, `### Requirements Coverage` and `### Prioritized Recommendations` under `## Recommendations`, and `### Input Documents` below the Evidence Sources table. Synthesize now stops (exit `5`, `schema-violation`, phase `synthesize:rollup`) when the frontmatter's pair counts disagree with the canonical verdict table.
issues: [1198]
