type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer records a correct export-list alias as a Critical `fabricated-signature` gap. When no file a documented name's provenance entries cite defines it, `classify-stale` in `skf-verify-provenance-completeness.py` now looks for an item of an export list or of a Python `from X import` clause that renames to it a name the cited file declares (`export type { API_Entry as Entry }`, on one line or as an item of a multi-line list, or `from .impl import _Impl as Impl`, on one line, in parentheses or after a backslash); such a name gets the new reason `aliased`, `fabricated: false` and a `defined_at` at the alias. It is then an Info `Documented extra` observation and its provenance entry an Info `provenance-unverified` gap, so neither blocks the hard gate. Any other rename, such as `export { default as Entry }`, `const Entry = API_Entry` or an import then an export, stays fabricated, and so does a homonym that renames nothing the cited file declares.
