type: fixed
scope: skf-quick-skill, skf-create-stack-skill, skf-create-skill, skf-update-skill
summary: |
  When skill-check's security scan cannot run or does not finish (no `SNYK_TOKEN`, no scan runner, or another scanner failure), Quick Skill now reports `Security: skipped` with the reason. It takes the validation verdict from skill-check's JSON instead of its exit code, so a scan that never started no longer reads as a failed validation or a security warning. A `pass` now reads "scan exited 0; skill-check 1.2.0 does not pass the scan's findings on": the scanner also exits 0 when its analysis fails, and skill-check's JSON output does not carry the scan's findings, so a pass does not show that the scan found nothing. Create Stack Skill lists a skipped or clean scan as a note in its validation results instead of recording a finding, and Create Skill and Update Skill now record the scan as skipped, not passed, when skill-check's error output asks for `SNYK_TOKEN`.
