type: breaking
scope: skf-test-skill
summary: |
  Test Skill's inventory contract and signature comparison rules now read four shapes of a call in running text or a table's description cell one way, where oh-my-skills rehearsal readers split. A placeholder call `name(...)`, which passes no argument, is a mention, as `name()` is. An empty call followed by a return type, such as `run_migrations() -> list[str]`, is a signature with an empty parameter list. A list that writes a bare `*` or `/`, such as `register_memo_key_function(typ, key_fn, *, state_fn=None)`, stays a parameter list, since no call writes one. A call after `await`, `new`, an assignment, a receiver or a module path stays a call when a return type follows it, so cocoindex's `await coco.mount([subpath,] processor_fn, *args, **kwargs) -> ComponentMountHandle` is no longer read as bare parameter names, which made `[subpath,]` a parameter the source lacks and could raise a Critical `signature-mismatch`. A usage is now recorded as the inventory floor writes one, its assignment, `await`, `new`, receiver or module path kept through the call's closing parenthesis, never an `@` or a `with`, and a field the floor pins blank is left out when the place writes none. Two of these readings can block a skill that passed: `run_migrations() -> list[str]` in prose now claims the export takes no parameter, so a required parameter the source takes is a Critical `signature-mismatch`, and a list with a bare `*`, such as `register_memo_key_function(typ, key_fn, *, state_fn=None)`, is now compared by its parameter names, so a name the source spells otherwise, or an optional parameter it leaves out, can be a Critical gap where a call was no difference.
migration: |
  If Test Skill now stops at the hard gate on a `signature-mismatch` for a form a skill writes in running text or a description cell, such as `name() -> T` or a list with a bare `*` or `/`, write the parameters in that form as the source declares them, or drop the return type after an empty `name()` that only mentions the export, then run Test Skill again.
