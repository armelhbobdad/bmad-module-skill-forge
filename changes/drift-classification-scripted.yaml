type: fixed
scope: skf-audit-skill
summary: |
  Audit Skill now scores drift from the structural diff it saves, not from the tables it writes into the drift report. Each run keeps the diff, the findings built from it and their classification in `forge-data/<skill>/<version>/.skf-audit/<timestamp>/`, and every export the diff lists is one finding: 40 line-only changes give a `MINOR` drift score, and 15 new exports are each graded `HIGH`, so the drift score is `SIGNIFICANT` and `next_workflow` is `update-skill`, even when the report shows them as one row. An export moved to a file outside the skill's scope is reported as moved, not removed, once ccc finds it and ast-grep confirms it. A name found in several files (a `GET` handler in two route files, for example) gets a table of its own for review instead of being paired by guess. A compose-mode stack is now audited by its constituents' freshness instead of stopping with `source-dir-missing` (exit `3`), since it has no source folder: a constituent skill that changed since the stack was composed shows under Constituent Freshness as a `HIGH` finding, so the drift score is `SIGNIFICANT` instead of `CLEAN` and `next_workflow` is `update-skill`. When the export manifest lags the `active` link (after an update, before the next export), the audit reads the provenance map of the version the link names and writes its report and results into that version's folder; before, it compared that version against the older version's provenance. The drift report's frontmatter now records the audited version and why it was chosen, the refs compared and the outcome of the upstream fetch, and its Provenance table shows the audited version and the cosmetic differences the diff collapsed.
