type: fixed
scope: skf-update-skill
summary: |
  Update Skill now writes `metadata.json` through `skf-build-change-manifest.py metadata` instead of editing it by hand. `skf-build-change-manifest.py apply` lists in `metadata-lists.json`, in the run folder, the `exports[]` the update leaves (the names the skill listed, less each name whose provenance entry the update removed or renamed, plus each name it mapped, never one off a `public-api` skill's public surface; a reference app's stays empty) and one `scripts[]` or `assets[]` row per script or asset the provenance map tracks (a row the skill had stays as it was, and a new file's purpose is read from the file). The `metadata` call writes those lists, the version, the generation date, the source commit and the stats, removes `last_update` and `update_type`, keeps every other field, and refuses stats whose script or asset counts differ from the lists, so `exports[]` names the exports the provenance map holds and `stats.scripts_count` and `stats.assets_count` match the rows.
prs: [765]
