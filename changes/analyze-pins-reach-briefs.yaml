type: fixed
scope: skf-analyze-source
summary: |
  Analyze Source now writes the ref you pin into every brief it generates. `--target-ref <tag|branch>` was never read: it now pins every project path, and `--target-refs <path:ref,...>` pins each one; each project path is scanned at its ref (a package folder inside a local repository too, read from a copy of that repository at the ref), and each brief records its unit's ref as `target_ref`, so Brief Skill and Create Skill build at the ref that was analyzed instead of the default branch. An `AN[auto]` run that falls back to the step-by-step analysis keeps the tag or branch it pinned the same way. A remote project path given as `owner/repo` or `github.com/owner/repo` is fetched over https. Each brief's `source_repo` is now the project path its unit was found in, where every brief of a multi-repository analysis named the first path, and each unit is listed and named under that path. The `[auto]` path now applies `--scope-hint`, which narrows its include patterns and the packages a split briefs, and `--intent-hint`, which picks the facets a merged repository keeps and words each description, where it ignored both.
