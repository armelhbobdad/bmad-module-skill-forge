type: fixed
scope: skf-update-skill
summary: |
  Update Skill's write step now runs in the order it is written: it first prepares what the provenance map and `metadata.json` are written from (a repair's metadata patches, the version, the generation date and the source commit the map records), then writes the provenance map with one `apply` run, then computes the stats from that map, relabels the entries they flag and writes `metadata.json`. Before, the section that wrote `metadata.json` came first but needed `apply` to have run, while `apply` read values that section bound, so a model that followed the numbering could run `apply` twice, and the second run overwrote the relabels. A repair's structural fixes, metadata patches (with whether each field was applied, left out or dropped by the recount) and exports found internal now reach you: they are recorded in the run folder's `evidence-records.jsonl`, and the evidence report's new Repairs Applied block and the update report's **Repairs applied:** line list them, where before they were noted "in the update report", which had no place for them. The run's flags, lock owner, source-tree bindings and skill paths are written to the run folder's `run-context.json` as step 1 ends, updated with the new version's paths after the merge, and read back from there when a long run loses one from its context; merge's metadata patches go to `metadata-patches.json` in the same folder. The write step no longer writes `not-public.json`, which nothing read.
