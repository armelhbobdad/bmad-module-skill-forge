type: breaking
scope: skf-refine-architecture
summary: |
  A missing `skf-enumerate-stack-skills.py`, `skf-validate-feasibility-report.py` or `skf-comention-pairs.py` now stops Refine Architecture with exit `3` `resolution-failure` (phase `init:inventory`, `init:feasibility-validator` or `gap-analysis:comention`) instead of falling back to a hand walk of the skills folder, a run without the [VS] report or co-mention facts found by hand. The skill listing and the mentions helper stop the run the same way when they exit non-zero (a skills folder that does not exist, say), naming their first error line. `--vs-report-path none` still refines without a report and needs no feasibility helper. The refinement rules are now checked by a script, `skf-check-preservation.py rules`, with the same tables and tier rules and the same exit `3` at `init:rules`: a VS Report Integration row raises the Issue Severity tier its Raises cell names (in bold, as the bundled rows do, or as a plain word), or names none and says No issue or None. Issue detection now joins the [VS] verdicts to the skill inventory and the document scope through `skf-check-preservation.py verdicts`, which reads the report again on every run, so a run stops with exit `8` `recovery-failed` whenever [VS] rewrote the report during the run or the refinement rules no longer pass the `rules` check, not only after a context loss. The mentions helper now reports the term that named each skill and which skills cover each technology the document names, so the scope confirmation and the `Not verified (no skill)` row read them instead of matching names by hand.
migration: |
  Reinstall SKF (`npx bmad-module-skill-forge install`) or install `uv` so the shared helpers resolve. A pipeline that relied on the fallback branches on exit `3` instead; one that wants no [VS] report passes `--vs-report-path none`.
