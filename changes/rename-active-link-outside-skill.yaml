type: breaking
scope: skf-rename-skill
summary: |
  Rename Skill now reads the old skill's `active` link through the inventory helper and rolls the rename back (exit `4`, `write-failed`, phase `execute:active-link`) when the link is broken or leads outside the skill's own folder. Before, it took the last part of the link's text as the version, so it pointed the renamed skill's link at a version folder of the same name in another skill, and repaired a broken link that still ended in a version the rename moved. A link SKF wrote can end up that way: on Windows without symlink rights the link is a junction to an absolute path, which moving the project folder breaks, and which a copy of the project that keeps the junction leaves pointing into the original project. A headless run whose skill roster helper cannot run now stops at phase `select:list-skills`, where a manifest read that could not run stopped at `select:read-manifest`. A run whose export manifest is not UTF-8, or is JSON but not a manifest, now stops with `manifest-corrupt` (exit `3`) in place of `write-failed` (exit `4`), and a missing `skf-skill-roster.py` stops the run at `select:start-run`.
migration: |
  When a rename stops at `execute:active-link`, point the old skill's `active` link at the version the export manifest has active (any of its version folders when the manifest does not list it), as the message says (`uv run _bmad/skf/shared/scripts/skf-atomic-write.py flip-link --link <skills_output_folder>/<old name>/active --target <version>`), or remove the link, then run the rename again.
