type: fixed
scope: skf-audit-skill
summary: |
  When a Deep-tier audit finds the skill's registered QMD extraction collection empty, its log now gives the route Setup Forge's FORGE STATUS banner gives when setup could not read an empty collection's folder, instead of a bare `qmd update`. `qmd collection show <name>` gives the collection's folder. When that folder is gone or holds no file its pattern matches, `qmd collection remove <name>` lets the next Deep-tier setup drop its registry entry, and a Create Skill run of the skill then registers a fresh collection. Only when the folder does hold such files do `qmd update`, which re-indexes every collection on the machine, and then `qmd embed -c <name>` fill it. A registered collection that QMD no longer holds (`Collection not found`) is now logged as a stale registry entry, with the same Create Skill route, and the audit reads the skill's own files for it, as it does for an empty one. The Semantic Drift header names it `registered but not in QMD`, and the report's confidence legend covers it.
