type: changed
scope: skf-test-skill
summary: |
  `score-signatures.py plan`, `validate-inventory.py` and the `census`, `floor`, `metadata` and `surface` commands of `load-coverage-inputs.py` now print only a summary when they are given `--output`, since Test Skill reads the plan, the inventory, the floor and the surface from the files they write in the run folder. `plan` prints the number of signatures it compares, the number of files and checks, the number of documented signatures and the path it wrote. `validate-inventory.py` keeps `valid`, `violations`, `warnings`, its counts, `spotCheck` and `floor`, leaves out the inventory and its `completeness`, and gives the path of `inventory.json` as `output`, or null when it refuses the inventory. `surface` prints the number of records, `denominator`, the `extraction` fields `readByEye`, `unread` and `fallback`, the `extractionGaps` it lists for a by-eye reading and the path; `census` prints `docsOnly`, `floor` prints its `summary`, and `metadata` the skill type, the inflation signature and a stack's denominator, each with the path. They used to print the whole result as well, so every run put a second copy of the inventory and the floor into the agent's context, and every source-based run one of the plan and the surface too, several hundred KB on a large skill, which ran past the tool output limit. Without `--output` each still prints the whole result, and no score, verdict or gap changes.
