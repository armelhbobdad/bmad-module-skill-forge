type: added
scope: skf-create-stack-skill
summary: |
  Stack Skill's scope review now takes the recommended scope from the import counter in both modes: `skf-count-imports.py` gains a `scope` subcommand that turns the import counts (code mode) or the picked skills (compose mode), `scope_overrides` and the published stack into the libraries in scope, each library left out with its reason, the published libraries kept and the unknown overrides, and the headless scope decision copies `scope`, `dropped` and `prior_kept` from it. The scope review's below-threshold table becomes a Left out table that lists every library left out with its reason, override and published-stack exclusions included, in compose mode too. A code-mode `scope_overrides` key that names no dependency now records a `scope-override-unknown` warning, as compose mode already did. When the import name of an unresolved dependency is known, the count runs again with the new repeatable `--module <name>=<import name>` flag of `skf-count-imports.py count`, and the library ranks with the others; a value that is not `<name>=<import name>`, names no dependency or names dependencies of several ecosystems exits `2`. Compose mode reads each skill's architecture layer from `skf-comention-pairs.py mentions`, records an `architecture-doc-parse-failed` warning when that helper is missing or cannot read the document, and halts with exit `3` (`helper-missing`, phase `compose-scope:scope`) when `skf-count-imports.py` is missing.
