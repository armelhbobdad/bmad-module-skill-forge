type: fixed
scope: skf-test-skill
summary: |
  Test Skill now renews its run lock just before each subagent starts (or, in an environment without subagents, before the main thread starts the work a subagent would have done), for 180 minutes, and the lock helper `skf-run-lock.py` keeps that window in the lock file, so a second run honours it. Nothing can renew the lock while one subagent runs, and the lock went stale 60 minutes after its last renewal whatever window the run asked for, so one subagent, such as the one that reads a large skill to list its exports, could run past the hour: a second run of the same skill version started then took the lock over, and the first run halted `another-run-active` with no result written. A second run now stops at the start with `another-run-active` while that subagent works, and the next renewal after it returns sets the window back to 60 minutes. A run cut off while a subagent runs leaves a lock that goes stale 180 minutes after that renewal; the message names the lock file to delete when no run is active.
