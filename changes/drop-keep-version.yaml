type: added
scope: skf-drop-skill
summary: |
  Dropping the active version while other versions remain no longer sends you out of the run: Drop Skill offers `[K] Keep`, which points the skill's `active` link at another version on disk, records it as the active version in the export manifest with the export date it already had, then drops the old version in the same run. A headless run takes the same path with a `keep=<version>` argument and records the choice in the result record's `headless_decisions`. Without it, a headless drop of the active version still stops with exit `5` (`active-version-guard-refused`), and its message now names the `keep=` value to re-run with. A `keep` that names no version the drop can keep stops with exit `2` (`input-invalid`), and an `active` link that cannot be moved stops with exit `4` (`write-failed`) before anything changes. The result record's summary names the kept version in `keep_version`.
