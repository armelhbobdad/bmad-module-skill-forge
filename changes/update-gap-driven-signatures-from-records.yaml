type: fixed
scope: skf-update-skill
summary: |
  Update Skill's `--from-test-report` repair now takes the signature of each export its spot-check locates from the source. When the check finds the export at its recorded line or at the line it moved to (a `signature-mismatch` gap on an export the provenance map holds, or a cited export the map lacks), the targeted re-extraction now reads that file as well, and the repair takes the export's type, parameters and return type from the record the recipe runner gives at that line: SKILL.md documents them and the provenance map records them. Before, an export the map held kept its old `params` and `return_type` while SKILL.md was repaired (a moved one changed only its line), and a cited new export took its signature from the repaired documentation, so the map and SKILL.md could disagree and the gap came back on the next test. A repaired entry keeps its confidence and extraction method; an `ast-grep` or `ast_bridge` entry takes `signature_source` from the record, and the update report lists each one that changes, such as a signature read by eye that moves an entry from T1 to T1-low. A cited new export keeps its `source-read` labels. An export the runner does not report at that line keeps its signature, with a warning, and a cited new export then takes it from the documentation, as before. `skf-build-change-manifest.py gap-records --plan` lists these exports in `reextract.signatures`, each verification record gains `params`, `return_type`, `extraction_method` and `ast_node_type` beside `export_type`, the `targeted_reextraction` evidence record gains `signature_files_scanned`, and the record call needs `--remediation-records` whenever the plan lists a file.
issues: [804, 809]
