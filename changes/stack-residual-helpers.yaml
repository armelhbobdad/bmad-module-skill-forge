type: changed
scope: skf-create-stack-skill
summary: |
  Stack Skill now takes each integration's confidence tier, and the counted fields of `metadata.json` (`library_count`, `integration_count`, `libraries`, `integration_pairs`, `confidence_distribution`, `confidence_tier` and `source_authority`), from one helper, `skf-render-stack-metadata.py`, instead of working them out by hand from rules several steps restated; an SKF install without the helper stops the run with exit `3` (`resolution-failure`). The values follow the rules the steps gave before: a pair takes the weaker of its two libraries' tiers in both modes, the distribution counts each library once, `confidence_tier` is its largest bin (a tie goes to the weaker tier), and `source_authority` is the lowest of the constituents' (`internal` below `community`). A constituent that records no authority now counts as `community`, so it never lifts a stack to `official`, and a code-mode stack, whose libraries record none, is `community`. The validation step reads a new stack structure check of `skf-validate-output.py --skill-type stack` (`validation.stack_structure`, and `--forge-tier` to compare the run's tier) instead of reading every file itself, and runs it again after `skill-check` fixes or splits the package: it warns on a missing `SKILL.md` section, a catalog link that does not resolve, a `metadata.json` key or value off the stack template (the dominant tier recomputed), a library or pair `metadata.json` lists with no file of its own, a reference or pair file without its sections, and a per-library summary, pair entry or reference file with no `T1`, `T1-low`, `T2` or `T3` label. The stack version now comes from `skf-skill-inventory.py version`: a code-mode stack takes the version of its most imported library reduced to one folder name (`^18.2.0` gives `18.2.0`), a re-composed compose-mode stack bumps the prior version as before, and only a run without the helper, or a prior stack that records no usable version, starts a new line at `1.0.0` with a `stack-version-default` warning. Compose mode finds the Verify Stack report with `skf-validate-feasibility-report.py --locate`, as Refine Architecture does: a report whose `schemaVersion` is not `1.0` still stops the run with exit `2` (`schema-version-mismatch`), a verdict token outside the schema's set is still a hard error, and a report that breaks the contract otherwise (a section missing or out of order, no verdict table or a second one, or a file that cannot be read) is no longer read, with a `vs-report-unusable` warning. The context snippet is now measured with `skf-count-tokens.py`, the count the validator takes (characters divided by 4, rounded down), with a `snippet-unmeasured` warning when that helper is missing.
