type: added
scope: skf-create-stack-skill
summary: |
  An interactive Stack Skill run that stopped after it wrote its draft, and before it wrote the stack, can now pick up at the review. The next interactive run with the same `stack_name` finds that run's folder under `_bmad-output/.skf-run/` and asks whether to resume at the review of that draft (`[Y]`), the draft kept as it was, your own edits included, or start fresh (`[N]`), which leaves the earlier folder untouched and shows its path, so you can delete it yourself. Once a later run has finished that stack, no run offers that draft again. A headless run never asks and always starts fresh. Each run now saves its first-step settings (the stack name, mode, scanned folder, inputs, template paths, hook and the forge tier after any downgrade) to `run.json` in its run folder, so steps 7 and 8, which write and validate the stack, read the tier from there, and a run now stops with exit `3` (`helper-missing`) at its first step, before any library is counted or extracted, when `skf-atomic-write.py` is missing (it stopped only at the output step before), and with exit `4` (`write-failure`) when `run.json` cannot be written.
