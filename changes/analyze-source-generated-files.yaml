type: changed
scope: skf-analyze-source
summary: |
  Analyze Source no longer drops a whole unit because one of its files looks generated. A committed lockfile such as `Cargo.lock` (which opens with `@generated`), a source folder named `src/build/`, a Java package folder named `build/` or a Go `vendor/` folder used to disqualify the crate, package or module around it. A `build/`, `dist/` or `target/` folder now counts as build output only directly below a unit or beside a manifest, and a unit drops as `generated-code` or `auto-generated-tag` only when every one of its source files is generated; a unit with some generated files stays, with those files listed as evidence the workflow weighs, in headless runs too, and a unit dropped over files that are its own code comes back when it is large enough with them. The size rules (fewer than 3 source files or 100 lines of code) now count only the source files that are not generated, so a lockfile, a README, a manifest such as `setup.py` or `build.gradle`, or a tool configuration file such as `vite.config.ts` no longer lifts a small unit over them. Units and briefs are also named by one rule in auto and interactive runs, and the check for an existing skill looks up that same name: a unit takes the name its own manifest gives its package (`@trpc/server` gives `trpc-server`, `github.com/spf13/cobra` gives `cobra`) unless the package is private, a merged monorepo or composite takes its facade's name or else the name its packages share (`aws-sdk` for the `@aws-sdk/*` packages), and any other unit takes its repository or folder name (`.` names the current folder) and a documentation URL its host (`docs-example-com`). Two units whose names would clash are told apart by their parent folders (`server-api` and `client-api`). A monorepo the auto path splits into several briefs now names each after its package instead of prefixing the package with the project name, and a package whose name an existing skill from another source already holds gets the `-wiki` suffix.
