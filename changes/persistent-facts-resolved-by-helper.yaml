type: changed
scope: all workflows, skf-forger
summary: |
  A `persistent_facts` entry that starts with `!`, such as `"!file:{project-root}/**/project-context.md"` in a team or personal override, is now applied by SKF's customization helper (`skf-resolve-customization.py`) instead of by the model following a sentence in each workflow: every workflow and Ferris now run the helper with `--facts`, which removes each `!` entry with every earlier entry it names and turns each `file:` glob into one entry per matching file before the workflow reads the list. The helper's `**` never enters a hidden folder or a folder reached through a link, so a link back up the tree cannot make it loop, and it never loads a `project-context.md` from the source clones a halted run keeps under `_bmad-output/.skf-run/`; Campaign's kickoff used to follow a linked folder, so a `project-context.md` it reached only through one is no longer loaded. Each file is listed once, and an entry the helper cannot resolve, such as a `file:` path that names no file, stays as written with a `persistent_facts:` line on stderr instead of failing the resolve. In a project with SKF alone and no override file for the workflow, the helper resolves the bundled list itself. In any other case where BMAD core's resolver cannot run, the workflow reads the bundled list as written and loads each file its glob matches itself, again none under `_bmad-output/.skf-run/`. Campaign's kickoff script loads Campaign's own facts into each skill's kickoff with the same code, and when the resolver is missing or fails, Campaign now passes `--facts-toml` with the bundled `customize.toml` to the kickoff script, which reads the list itself instead of the model copying it into a JSON file.
