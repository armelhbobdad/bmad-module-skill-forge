type: fixed
scope: skf-update-skill, skf-drop-skill, skf-create-skill, skf-quick-skill, skf-create-stack-skill, skf-rename-skill
summary: |
  On native Windows (Git Bash or PowerShell), the helper that points a skill's `active` link at a version (`skf-update-active-symlink.py`) exited 1 on every run with "use WSL2 to run update-skill", so Update Skill could not make the version it wrote live (a run could end with `metadata.json` on the new version and `active` on the old one), and a Drop Skill purge that had to move the link left it on the deleted version. The helper now makes a directory junction when Windows refuses a symlink, as Create Skill already does, reads a junction back as the version it names, and takes the link's lock (`active.skf-lock`) there as on Linux and macOS. Every fix Drop Skill gives that points the link at a version, the recovery its refusal to drop the active version names included, and the fix Update Skill shows when the link names another version now run `skf-atomic-write.py flip-link` instead of `ln -sfn`, which Git Bash without symlink rights turns into a copy of the folder. Create Skill, Quick Skill and Create Stack Skill, which flip the link through the same code, now also replace a junction whose version folder was deleted, and on Windows remove the old link first when Windows refuses to rename the new one over it.
