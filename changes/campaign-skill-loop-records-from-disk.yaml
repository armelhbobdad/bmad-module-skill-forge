type: changed
scope: skf-campaign, skf-create-skill
summary: |
  Campaign's skill loop now records a Tier A skill's folder (`skill_path`) as soon as Create Skill finishes, before Test Skill runs, so a skill whose test fails keeps its path in the state. Create Skill's doc-rot step now writes the corrections it kept to `doc-rot-corrections.json` in its staging folder, and Campaign records them in the skill's `workarounds_applied` from that file with `campaign-state.py append-workarounds --doc-rot-file`, right after Create Skill, instead of copying them from the conversation after the test. A file it cannot read stops nothing: Campaign logs it as an `event` and goes on to Test Skill. A directive problem (an override line the gate script cannot read, or a Skip List or Quality Overrides name that is no campaign skill) now reaches the decision log as one `Directive:` line, logged once per campaign however many skills report it (Export reports the same line), through the new `campaign-state.py log --once`, which counts only the lines stamped since the campaign started, so a campaign seeded again over the same log logs the line again.
