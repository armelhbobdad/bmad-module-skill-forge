type: changed
scope: skf-forger, skf-setup
summary: |
  When `_bmad/skf/config.yaml` is missing, Ferris no longer sends you to Setup, which stops on the same missing file: Ferris, Setup and `skf-preflight.py` now name the installer (`npx bmad-module-skill-forge install`, or `npx bmad-method install` and add SKF), and Ferris's `KI` does the same for a missing knowledge index. Setup's `on-activation:config-missing` reason keeps its opening sentence. Ferris checks for the config before reading it, loads the config and its sidecar folder with one `skf-preflight.py` call (a first run with no sidecar folder goes on with defaults), and reads the last pipeline result before it greets you, so the offer to resume a stopped pipeline comes in the greeting. Ferris now needs `uv` to start, as every workflow already does; without it he stops and gives the uv install link. The first-run greeting and the menu show `forge-auto` and the other pipeline aliases, every menu ends with a reminder to run each workflow in a fresh context window, `WS` names its data sources, reads them again each time, and ends with one recommended code per skill in progress, and picking a second workflow in one session first offers a fresh session or a pipeline. `skf-preflight.py` gains `--allow-missing-sidecar`, a `derived.headless_mode` field, absolute folder paths (`config.output_folder_resolved`, `config.skills_output_folder_resolved` and `config.forge_data_folder_resolved`) that expand the `{project-root}` placeholder the BMAD Method installer writes, as `config.sidecar_path_resolved` now does too, and a `CONFIG_MALFORMED` code for a config that exists but does not load. A `sidecar_path` that still holds a placeholder, such as `{project-root}/{value}`, halts with `SIDECAR_UNDEFINED`, and a sidecar file Setup has not written yet reads as empty instead of setting `preferences_error` or `forge_tier_error`.
