type: fixed
scope: skf-drop-skill, skf-update-skill, skf-audit-skill, skf-test-skill, skf-rename-skill
summary: |
  A Drop Skill or Update Skill stage took the shared helpers it runs (the result emitter, the manifest and context-file helpers, Update Skill's run-state and run-lock helpers) only from what an earlier step resolved, so after a long run's context was compacted it could lose one and have nothing in its own file to find it again: the run then wrote no result files and printed no result line, an Update Skill run stopped at the run-lock renewal before it published the new version, and an Update Skill halt could not undo what the run wrote or release its run lock. The report steps of Drop, Update, Audit, Test and Rename Skill likewise read `on_complete` only from activation, so a lost value skipped a team's hook as if it were the empty default. Each of those stages now lists where each helper it runs lives (the installed SKF path, then the development tree's) and resolves a lost one from that list, every Update Skill halt runs the run-state helper itself, and each report step reads a lost `on_complete` again through the customization resolver, or from the bundled `customize.toml` when the resolver cannot run, before it decides whether the hook runs, as Create Skill already does.
