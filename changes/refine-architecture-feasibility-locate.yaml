type: breaking
scope: skf-refine-architecture, skf-verify-stack
summary: |
  Refine Architecture now finds the report Verify Stack writes. Before it asks for its inputs, it looks up `feasibility-report-<slug>-latest.md` in the forge data folder with `skf-validate-feasibility-report.py --locate` and offers that report as the default (press Enter to use it), and a headless run without `--vs-report-path` uses it and logs that it did. Before, it looked for `feasibility-report-<project_name>.md`, a name Verify Stack never writes, so it went on without the report and never raised a `Blocked` or `Risky` pair as an issue. A report path you give, with `--vs-report-path` or at the prompt, is read through the same script, and `--architecture-doc` and `--vs-report-path` now skip their questions in interactive runs too. `--vs-report-path none` refines without a report and skips the search for one. Refine Architecture now stops with exit `2` and `input-invalid` when the report it would use has a `schemaVersion` other than `1.0`, is missing a required section, has no verdict table or two of them, uses a verdict token other than `Verified`, `Plausible`, `Risky` or `Blocked` or an `overallVerdict` other than `FEASIBLE`, `CONDITIONALLY_FEASIBLE` or `NOT_FEASIBLE` (tokens are case-sensitive), or cannot be read. Every `Plausible` pair in the document's scope is now a Minor issue, whatever its rationale says. The document scope now comes from a word-boundary match of each skill's name and of the repository and folder it was built from, the scope confirmation shows the word that named each skill and lists a skill named only through a common word (a repository called `core`, say) as ambiguous, and a `--scope-skills` name that is not a skill is now named instead of being ignored. The report check Verify Stack runs before it presents a report (`skf-validate-feasibility-report.py <report>`) now also fails on a missing or doubled verdict table and on an unknown verdict token, so Verify Stack stops with `schema-violation` on such a report.
migration: |
  Re-run Verify Stack (`@Ferris VS`) to write a current report, then run Refine Architecture again. To use a different report, pass it with `--vs-report-path <path>`; to refine without one, pass `--vs-report-path none`.
issues: [590, 598]
