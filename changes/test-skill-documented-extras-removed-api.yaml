type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer records a removed API as a documented extra. `classify-stale` in `skf-verify-provenance-completeness.py` found such a name in two places: in an example, demo, sample, script, playground, end-to-end test, benchmark or migration folder of the package (`example/old.ts`, `pkg/migrations/0001.py`), and in a module named after the name, such as `pkg/client.py` for a removed `client()`, whatever the module holds. Its walk now leaves out the `e2e` and `__fixtures__` folders wherever they lie, and the `example`, `demo`, `demos`, `sample`, `samples`, `scripts`, `playground`, `bench`, `benchmark` and `migrations` folders right below the package it reads and below each package root inside it (deeper in a package such a folder is still read, and so is one that holds a file the provenance map cites; a file the map cites in any of these folders is still read). With its new `--inventory` flag, which Test Skill now passes, a module so named no longer declares a name the skill documents as a `function`, `hook`, `class`, `interface`, `enum` or `type`, unless a provenance map entry of the name is a `module` or `package` one or the module is a TypeScript or JavaScript file that is itself the export (`export default`, `module.exports =`). Such a name is now a Medium `stale-documentation` gap, which Update Skill routes, instead of an Info `Documented extra` observation.
