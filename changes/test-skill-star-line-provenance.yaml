type: fixed
scope: skf-test-skill
summary: |
  Test Skill no longer records a blocking Critical `fabricated-signature` gap for a name whose provenance map entry cites the line of an `export *` or `export type *` from another package that no script reads, such as `Mock` cited at `export type * from '@vitest/spy';` in a storybook `spy.ts`. The fabricated-signature test found no definition of the name on that line and marked it fabricated, so the gap ledger recorded `Fabricated signature: Mock` before its check for names passed on by another package's `export *` ran, though the star passes the name on. That test now notes the module such a line names on the entry, its verdict unchanged, and the gap ledger reads an entry whose file and module match a star in the run's `surface.json` `unresolvedStars` like that star: an Info `observation` titled `Not checked by script: Mock (another package's export *)` at the line that documents the name, whose issue and remediation say the provenance map cites it at the star statement, with the entry's file and line, and ask no change unless that package lacks the name. This holds with or without the skill folder, and for a name that was not fabricated; when the skill's own citations also place the name at that file, the record is the one they already gave, when they place it at another star's file the record names that star and the entry's, and a name the brief scopes out keeps its Medium gap. The Info `Provenance line not verified for Mock` gap at that entry now stays in the Gap Report beside it, and with classify-stale's result its issue and remediation say that the line is an `export *` from that package, so no line of the file defines the name, and ask no change unless the package lacks it, in place of confirming that the line defines it. An entry at a relative `export *`, at any other line or at a star the surface does not list keeps a fabricated name Critical.
