type: changed
scope: skf-refine-architecture
summary: |
  Refine Architecture no longer writes the refined document before you review it. Compile now builds a draft beside the RA state file in the forge data folder (`.skf-ra-draft-<project_name>.md`): a script copies your architecture document line for line, places each gap, issue and improvement where its anchor puts it (after the whole paragraph, list, table or code block that holds it, so none is split), appends the Refinement Summary with counts it takes from what it placed, and checks that every original line is still there, unchanged. Only `[C]` at the review replaces `refined-architecture-<project>.md`, after the same check passes again, and an earlier file of that name is first renamed to `refined-architecture-<project>-<YYYYMMDD-HHmmss>.md` instead of being overwritten; `[X]` deletes the draft and leaves the earlier file as it was. A draft that would lose or change a line of your document is never promoted. Each refinement now sits between `<!-- RA:BEGIN ... -->` and `<!-- RA:END -->` marker lines, and running Refine Architecture again on a refined document (or on one an older version refined, with its `RA:` subsections and its Refinement Summary) sets the earlier annotations aside, analyzes only your own text and writes one current set in their place: to keep a refinement, move it into your own prose. An older version's `RA:` subsection carries no end marker, so it is set aside up to the next heading: the run names those lines when it starts, at the review and in the report, and says they were not checked, since a paragraph of yours below such a subsection is not in the refined document. The improvement subsection heading now reads `RA: Enhancement: <title>`. The final report takes its counts and the technologies no skill covers from that build instead of re-reading the document, writes the result contract before its last menu, passes the per-run result file to `on_complete`, and shows an `on_complete` failure as a warning line in the report.
issues: [585, 587]
