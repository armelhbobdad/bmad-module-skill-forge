type: changed
scope: skf-update-skill
summary: |
  When a skill's prior `context-snippet.md` holds a `|gotchas:` value that joins several pitfalls, such as an older line of more than 3 pitfalls or the `[CARRIED]` value it was rewritten as, and the merged SKILL.md states those pitfalls only apart or in other prose, Update Skill now restates each one SKILL.md still states, with the citation of the place that states it, as a bullet of SKILL.md's gotchas section or of a new `## Gotchas` section before its first `## Full` section. The regenerated `|gotchas:` line then places them as it places any gotchas bullet, within its 3 slots, the next export keeps them, and the evidence report counts the bullets as `Gotchas restated`. Before, the update carried the joined value once, marked `[CARRIED]`, and the next export dropped it, so the context file lost those pitfalls although SKILL.md still stated each one. A pitfall SKILL.md no longer states, or states without a citation, is not restated.
