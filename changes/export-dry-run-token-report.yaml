type: fixed
scope: skf-export-skill
summary: |
  Export Skill's token report now measures what the run produced. A dry run used to delete its stage folder before the report, which then measured the snippet and managed section already on disk, not the ones the run would write; now the stage folder lives until the report, which measures the staged draft and the section the run would write, and deletes it. `skf-count-tokens.py` gains `--snippet <path>`, which measures that file as the snippet row, `--section-file <path>`, which measures a staged section body as the block `insert` writes around it, and `--no-snippet`, which leaves the snippet row out of the package total. A run with passive context off passes `--no-snippet` and no context file, so a snippet create-skill left in the package no longer counts, and the report shows the snippet and managed-section rows as N/A (disabled). The token report also states the helper's JSON once instead of three ways.
