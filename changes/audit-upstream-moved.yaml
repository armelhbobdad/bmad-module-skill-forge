type: breaking
scope: skf-audit-skill, skf-forger
summary: |
  Audit Skill no longer checks out SKF's shared clone to audit a newer upstream ref: the `[C]` choice of its upstream-drift gate reads that ref into a private tree of the run's own and leaves the clone as it was, with no lock held across steps. The dirty-worktree sub-gate goes with the checkout, and so do its inputs `dirty_worktree_choice` and `force`. Since nothing on disk changes any more, `[C]` is now the headless default when `upstream_drift_choice` is unset (it was `[S]`, stay on the baseline). The upstream check is one script call that compares commits, so a clone made with `--depth 1 --branch <tag>` no longer reads as moved on every audit. The result contract and the `SKF_AUDIT_RESULT_JSON` envelope gain `upstream_moved` and `upstream_ref`, and `next_workflow` is now `update-skill` also when upstream moved, whatever the drift score, so a `maintain` pipeline reaches update-skill after an upstream release: the forger's gate no longer skips US after a `CLEAN` audit whose `next_workflow` is `update-skill`, and it passes `upstream_ref` to update-skill as `--target-ref`. Every envelope, each halt's included, now comes from the shared emitter and is checked against the new `skf-audit-result-envelope.v1.json`; it adds `run_id`, `result_path`, `headless_decisions` (the manifest-vs-link, degraded-mode and upstream-drift gates' choices), `warnings` and, on a halt, `error`, and three halt reasons with exit `3`: `helper-missing`, `provenance-invalid` and `source-unreadable` (a source file the re-index could read neither by script nor by eye). The upstream-drift gate's headless decision is recorded once its choice has run, as `S` when `[C]` could not read the private tree and the audit stayed on the baseline.
migration: |
  Drop `dirty_worktree_choice` and `force` from audit-skill invocations. To keep a headless audit on the baseline ref, pass `upstream_drift_choice=S`. A pipeline that read `next_workflow` as "CRITICAL or HIGH drift found" reads `drift_score` for that instead, and `upstream_moved` and `upstream_ref` for an upstream release.
