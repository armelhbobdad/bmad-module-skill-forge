type: fixed
scope: skf-create-skill, skf-test-skill
summary: |
  Create Skill now stores `stats.effective_denominator` with each public name counted once, as the recipe runner's help and Create Skill's instructions say. A name the package's entry points pass on from two files (a module or namespace member named like another public name, such as `foo` re-exported from `./a` beside `export * as ns from './b'` when `./b` defines its own `foo`) or in two languages used to count once per file, while Test Skill counts each name once, so a skill that documented every name scored Export Coverage below 100 on the stored count (66.67 for two names counted as three). Export Coverage on a stored count can rise. It can also fall: Test Skill checks that each name `metadata.json` declares appears in the docs, and when that check finds a name missing, the count of names it found becomes the numerator. That check now also runs when the provenance map holds no impl-block method and its distinct names equal the stored count, as it already runs when `stats.exports_documented` does. So a skill that documents every name, one of them passed on from two files, gets the check instead of `skipped`, and a High `numerator-inflation` gap can now appear where the check reported `skipped`. The gap now asks only that the absent names be documented, no longer that `stats.exports_documented` be set by hand. `stats.exports_public_api` is unchanged. A skill keeps its old count, one high for each extra key, until Create Skill runs again. To store the corrected count for a curated skill, re-run Create Skill on it: an Update Skill run drops the stored count, as it already does.
