type: breaking
scope: skf-test-skill
summary: |
  Where a skill states members several names share once and places one of a name's own members before or among them (`leading`, `first`), Test Skill's inventory now records that name's whole parameter list in the skill's order at a place the inventory floor pins too, as it already did everywhere else. Before, the pinned parameters stayed after the shared text and `; `, which the signature rules read with the shared members first, so a correct order could be reported as a Critical `signature-mismatch` that blocks the hard gate. `validate-inventory.py --floor` now carries a pinned `params` when the entry's members, cut at the commas outside brackets and strings, hold each pinned member in its order, with other members before, among or after them. A list that reorders, changes or drops a pinned member is still refused, the shared text then `; ` is still carried, and a pinned `usage_signature` is still carried only as given or after the shared text and `; `. A skill that passed can now block when it places an own member first at a pinned place while the source declares it after the shared members.
migration: |
  If a run now stops at the hard gate on a `signature-mismatch` for a pinned form whose own member the skill places before or among the shared members, correct the order in the skill to the one the source declares, then run Test Skill again.
