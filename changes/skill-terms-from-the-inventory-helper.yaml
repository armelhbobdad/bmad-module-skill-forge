type: fixed
scope: skf-refine-architecture, skf-verify-stack
summary: |
  Refine Architecture and Verify Stack now build the names they find each skill by, its own name and the repository and folder it was built from, with `skf-enumerate-stack-skills.py terms` instead of by hand, so an alias dropped while copying the inventory no longer moves a skill out of scope or hides it from the coverage check. Refine Architecture writes these terms once at the start and splits the skill pairs by scope with `skf-enumerate-stack-skills.py scope --inventory`, which reads every skill from the saved inventory, so no skill name is left out of a hand-joined list. In Refine Architecture a failure of either call stops the run with exit `3` (`resolution-failure`) at phase `init:inventory`, `gap-analysis:split` or, when gap analysis or issue detection writes the terms again, `gap-analysis:comention` or `issue-detection:vs-report`; in Verify Stack a failed `terms` call stops the coverage step as a failed mentions call does (exit `3`, phase `coverage:mentions`).
