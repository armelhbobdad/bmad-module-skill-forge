type: changed
scope: skf-audit-skill
summary: |
  A Deep-tier drift report's Semantic Drift section now shows a table only for each category that has findings, filled from the rows the semantic diff saves, the Before and After columns of a changed convention and the dependency columns of a dependency shift included, and it has no New Patterns table any more. The Documentation Drift, Constituent Freshness and Provenance sections are now printed from the files the run saved, so a `|` in a documentation URL, a fetch failure's reason or a path no longer breaks a table, and the Documentation Drift table's Detected At column shows the run's timestamp. The Workflow Recommendation now recommends `[US] Update Skill` whenever the run's `next_workflow` is `update-skill`, a run whose upstream moved included, and then names `--target-ref` with the ref upstream moved to; its line calling minor drift optional now shows only when no update is recommended. The run's result is now built from the drift report's frontmatter and the saved classification: when the frontmatter is not valid YAML, names no `skill_name`, or records `upstream_moved: true` with no `upstream_ref`, and one fix does not settle it, the run stops with exit code 4 (`write-failed`).
issues: [1130]
