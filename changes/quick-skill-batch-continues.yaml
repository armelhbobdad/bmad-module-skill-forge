type: breaking
scope: skf-quick-skill
summary: |
  `--batch` no longer ends at the first target that fails. A HARD HALT now ends only its own target, which the batch records as failed, and the batch runs every remaining target, writes its summary and runs the health check once, after the summary, instead of after each target. It then exits with the highest exit code among its failed targets (`0` when none failed), where it used to exit with the first failed target's code. `--fail-fast` keeps the old stop: the batch ends at the first failed target, writes its summary and exits with that target's code. The new `skf-quick-batch.py` helper parses the batch file and keeps the batch's place and every target's outcome on disk in the run folder as each target ends, so a long batch survives a context compaction, and it computes the counts, the status and the exit code. A batch file that cannot be read, or a missing `skf-quick-batch.py`, now stops the run before its first target with exit code `2` (`input-invalid`), and a batch run folder that cannot be written stops it with exit code `4` (`write-failure`). A line with a word after its target that is not a `language=` or `scope=` modifier, a trailing `# comment` included, is taken whole as its target, which then fails on its own.
migration: |
  A pipeline that relied on a batch stopping at its first failed target passes `--fail-fast`. One that read the batch's exit code as the first failed target's code reads each target's own `exit_code` and `error_code` in the `results[]` of `quick-skill-batch-latest.json`, or in the per-target `fail` events. In a batch file, put a comment on a line of its own that starts with `#`, and write only `language=` and `scope=` modifiers after a target.
issues: [585, 587]
