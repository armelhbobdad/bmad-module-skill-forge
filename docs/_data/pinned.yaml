# Skill Forge: Pinned Canonical Anchors
#
# This file is the SINGLE SOURCE OF TRUTH for every version number, commit
# SHA, and library reference that the docs cite about oh-my-skills, the
# canonical SKF reference output.
#
# Every time a skill is recompiled in oh-my-skills, update the matching
# entry here and then run `npm run docs:validate-drift` from the SKF repo
# root. The script will:
#
#   1. Verify every skill below exists at the claimed version in
#      $OMS/skills/<name>/<version>/<name>/metadata.json, and that its
#      version, source_commit, confidence_tier and source_authority match.
#      The other fields (source_repo, source_ref, upstream_commit_date,
#      test_score, test_mode, language) are not checked.
#   2. Grep every docs/*.md for stale version strings and flag any that
#      disagree with the anchors
#
# If the drift check fails after a recompilation, update this file first,
# then fix the docs until the check is clean.
#
# Do NOT edit docs/*.md version references without updating this file
# first. The drift check catches the mismatch when you run it. That's the point.
#
# File ignored by Astro/Starlight content collections because the parent
# directory starts with `_`. Nothing reads it at build time: only
# tools/validate-docs-drift.js checks it, and release.yaml rewrites
# skf_version. CI does not run the drift check, and the check needs a local
# oh-my-skills checkout, so run `npm run docs:validate-drift` yourself.

# SKF package version: matches the `version` field in package.json.
# Enforced two ways: (1) release.yaml bumps this line in the same commit
# as package.json + marketplace.json on every release; (2) validate-docs-drift.js
# cross-checks this value against package.json.version and fails on mismatch.
skf_version: "2.2.0"

# Path to the oh-my-skills repo, resolved relative to this repo's root.
# Override at runtime with the OMS environment variable if oh-my-skills
# lives elsewhere on your machine.
oh_my_skills_path: "../oh-my-skills"

# Every oms-* skill currently shipped in oh-my-skills. The `library` field
# (e.g. cognee) is the library name the docs use, and the drift check
# searches docs/*.md for it. The entry key is the skill package name, usually
# oms-<library>; oms-storybook-react-vite covers the storybook library.
skills:
  oms-cognee:
    library: cognee
    version: "1.0.0"
    source_repo: "https://github.com/topoteretes/cognee"
    source_commit: "3c048aa4147776f14d4546704f986242554a9ef3"
    source_ref: "v1.0.0"
    upstream_commit_date: "2026-04-11"
    test_score: 99.00
    test_mode: "naive"
    confidence_tier: "Deep"
    source_authority: "community"
    language: "python"

  oms-cocoindex:
    library: cocoindex
    version: "0.3.37"
    source_repo: "https://github.com/cocoindex-io/cocoindex"
    source_commit: "87c5dbf087bfccca83791861db0d33519ef09677"
    source_ref: "v0.3.37"
    upstream_commit_date: "2026-03-31"
    test_score: 99.0
    test_mode: "naive"
    confidence_tier: "Deep"
    source_authority: "community"
    language: "python"

  oms-storybook-react-vite:
    library: storybook
    version: "10.3.5"
    source_repo: "https://github.com/storybookjs/storybook"
    source_commit: "e486d3826bcd40c52db1c766966d1c8ec16df6cb"
    source_ref: "v10.3.5"
    upstream_commit_date: "2026-04-07"
    test_score: 99.49
    test_mode: "naive"
    confidence_tier: "Deep"
    source_authority: "community"
    language: "typescript"

  oms-uitripled:
    library: uitripled
    version: "0.1.0"
    source_repo: "https://github.com/moumen-soliman/uitripled"
    source_commit: "a5ffb45be05335d2c547436664cfbfb8c22d04df"
    source_ref: "HEAD"
    upstream_commit_date: "2026-03-22"
    test_score: 99.45
    test_mode: "naive"
    confidence_tier: "Deep"
    source_authority: "community"
    language: "typescript"

# Libraries that are mentioned in docs as illustrative examples but don't
# have a corresponding oms-* skill. Their versions are allowed to drift
# because they're illustration, not canonical. The drift check only searches
# for the `library` names under skills, so it already ignores every other
# library. This list matters only if one of these gains a skill: it then
# hides that library's drift until you remove it here.
illustrative_libraries:
  - better-auth
  - hono
  - drizzle-orm
  - spacetimedb-sdk
  - serwist
