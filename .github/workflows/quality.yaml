name: Quality & Validation

# Runs comprehensive quality checks on all PRs:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - LintLang (agent instructions under src/)
# - No em dashes (published docs, and the lines and commit messages a PR adds)
# - Change fragments (changes/*.yaml), the fragments a PR needs (pull
#   requests only), and the release-notes tools
# - Schema validation (YAML structure)
# - Agent schema tests (fixture-based validation)
# - Installation component tests (CLI + compilation)
# - Workflow state consistency tests
# - Knowledge base tests
# - Skill structure validation
# - File reference validation
# - Python script tests (pytest via uv)

"on":
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  # Lints the text SKF hands a model (the SKILL.md files and the step and
  # reference files under src/) with LintLang, a deterministic linter for agent
  # instructions. Gates on HIGH and CRITICAL findings only: its MEDIUM and LOW
  # findings on this tree are advisory, and validate:skills already owns the
  # description and naming rules. The scan is limited to src/ because a scan of
  # the whole checkout ignores .gitignore and fails on the malformed YAML
  # fixtures under test/. Linux only: the scan reads text, so a Windows run
  # would only repeat it.
  lintlang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # No `npm ci`: the script only calls uvx, which fetches the pinned
      # LintLang release itself.
      - name: LintLang
        run: npm run lint:instructions

  # Enforces the project's writing rule: no em dash (U+2014). The published
  # docs (README.md, docs/ except docs/_internal/, website/) must hold none,
  # and a pull request may add none anywhere, in its changed lines or its
  # commit messages. fetch-depth: 0 fetches the base branch the tool diffs
  # against; without it the tool fails in CI rather than skip the check.
  # Linux only: it reads text, so a Windows run would only repeat it.
  #
  # The change-fragment steps run here too, for the same reason: they read
  # history. tools/changes.js and tools/covered-surfaces.js compare the tree
  # with the last stable release tag, and their tests backtest the surface
  # diff against real tags (v1.9.0, v2.0.0, v2.2.0), which only a full clone
  # has. Those two tools need the yaml and semver devDependencies, hence
  # npm ci; the em dash tool itself uses only Node built-ins. The last step
  # checks the change fragments the pull request itself needs, against its
  # base branch.
  em-dash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Test the em dash check
        run: npm run test:em-dash-tool

      - name: No em dashes
        run: npm run validate:em-dash

      # Also after a failed em dash step, so the pull request check below can
      # still run and report its own problems in the same run.
      - name: Install dependencies
        id: deps
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Test the change-fragment tools
        run: npm run test:changes-tool

      - name: Validate change fragments
        run: npm run validate:changes

      # A pull request that changes the code the package ships (src/,
      # tools/cli/, tools/skf-npx-wrapper.js) or .npmignore adds a change
      # fragment, or says why no user notices it in a
      # "Changelog: none (<reason>)" line of one of its commit messages. A
      # covered item it removes or adds always needs a fragment
      # (tools/covered-surfaces.js, merge base to HEAD). It diffs the branch
      # against origin/$GITHUB_BASE_REF, the base the pull request targets,
      # so it runs on pull requests only and a workflow_dispatch run never
      # checks a branch against a base it did not target. A dispatch run's
      # em-dash result (release.yaml dispatches one on its bot branch) does
      # not include this check. It runs even when an earlier step of this
      # job failed, as long as the dependencies installed, so one run
      # reports every problem. On a failure the log and the step summary
      # give a fragment to fill in. PR_HEAD_REPO lets the tool exempt the
      # release branch (release/bot/*) only when it is this repository's; a
      # fork's, or one whose head repository is unknown, is checked. It goes
      # through env so the value is never run as shell.
      - name: Change fragments this pull request needs
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.deps.outcome == 'success' }}
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: npm run changes:pr

  validate:
    # Matrix Linux + Windows to catch platform-divergence bugs (path handling,
    # line endings, shell scripts). macOS skipped: POSIX-equivalent to Linux
    # for SKF's Node + Python surface area — add only if a Mac-only bug surfaces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML schemas
        run: npm run validate:schemas

      - name: Run agent schema validation tests
        run: npm run test:schemas

      - name: Test installation components
        run: npm run test:install

      - name: Test CLI integration
        run: npm run test:cli

      - name: Test workflow state consistency
        run: npm run test:workflow

      - name: Test knowledge base
        run: npm run test:knowledge

      - name: Validate skills structure
        run: npm run validate:skills

      - name: Validate file references
        run: npm run validate:refs

      - name: Test docs link rewriting
        run: npm run test:rehype

      # The link guard is a required check, so it gets its own tests. Runs in
      # `validate` rather than `docs-links` on purpose: it drives fixture trees
      # and needs no site build, so it should not wait on one.
      - name: Test the docs link guard
        run: npm run test:docs-links-tool

      # validate:refs runs with --strict in this job, so its rules get their
      # own tests against fixture trees, like the docs link guard above.
      - name: Test the file reference validator
        run: npm run test:file-refs-tool

  # Builds the real site and resolves every emitted href, src, and srcset
  # against the file tree. `docs/` is read both on GitHub and as the published
  # site, and a link can be valid in one and dead in the other while every
  # other check stays green, because an href that resolves nowhere is still
  # valid HTML. Source-level validation cannot see that; only the built output
  # can, which is why this job exists separately from `validate`.
  #
  # Separate job rather than a step in `validate`: it needs a full Astro build,
  # which the Windows half of that matrix would only duplicate at twice the
  # cost, and route rewriting is platform-independent.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 mirrors the deploy workflow. Starlight's `lastUpdated`
      # reads git history, so a shallow clone builds a different site than the
      # one that ships, and validating a different artifact defeats the point.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build documentation
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run docs:build

      - name: Validate documentation links
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node tools/validate-docs-links.js --strict --require-build

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Python tests
        run: npm run test:python
