name: Quality & Validation

# Runs comprehensive quality checks on all PRs:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - Schema validation (YAML structure)
# - Agent schema tests (fixture-based validation)
# - Installation component tests (CLI + compilation)
# - Workflow state consistency tests
# - Knowledge base tests
# - Skill structure validation
# - File reference validation
# - Python script tests (pytest via uv)

"on":
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  validate:
    # Matrix Linux + Windows to catch platform-divergence bugs (path handling,
    # line endings, shell scripts). macOS skipped: POSIX-equivalent to Linux
    # for SKF's Node + Python surface area — add only if a Mac-only bug surfaces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Smoke test conventional-changelog-cli bin resolution on Windows
        if: runner.os == 'Windows'
        run: npx --no-install conventional-changelog-cli --help

      - name: Validate YAML schemas
        run: npm run validate:schemas

      - name: Run agent schema validation tests
        run: npm run test:schemas

      - name: Test installation components
        run: npm run test:install

      - name: Test CLI integration
        run: npm run test:cli

      - name: Test workflow state consistency
        run: npm run test:workflow

      - name: Test knowledge base
        run: npm run test:knowledge

      - name: Validate skills structure
        run: npm run validate:skills

      - name: Validate file references
        run: npm run validate:refs

      - name: Test docs link rewriting
        run: npm run test:rehype

      # The link guard is a required check, so it gets its own tests. Runs in
      # `validate` rather than `docs-links` on purpose: it drives fixture trees
      # and needs no site build, so it should not wait on one.
      - name: Test the docs link guard
        run: npm run test:docs-links-tool

  # Builds the real site and resolves every emitted href, src, and srcset
  # against the file tree. `docs/` is read both on GitHub and as the published
  # site, and a link can be valid in one and dead in the other while every
  # other check stays green, because an href that resolves nowhere is still
  # valid HTML. Source-level validation cannot see that; only the built output
  # can, which is why this job exists separately from `validate`.
  #
  # Separate job rather than a step in `validate`: it needs a full Astro build,
  # which the Windows half of that matrix would only duplicate at twice the
  # cost, and route rewriting is platform-independent.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 mirrors the deploy workflow. Starlight's `lastUpdated`
      # reads git history, so a shallow clone builds a different site than the
      # one that ships, and validating a different artifact defeats the point.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build documentation
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run docs:build

      - name: Validate documentation links
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node tools/validate-docs-links.js --strict --require-build

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Python tests
        run: npm run test:python
