name: Deploy Documentation

# Builds the docs site from a release tag and deploys it to GitHub Pages. The
# site shows the latest stable release, not main, so a merge to main does not
# deploy it. release.yaml dispatches this workflow at the end of every stable
# release (patch, minor, major) with `ref` set to the new tag; a prerelease
# leaves the site alone. To deploy by hand:
#
#   gh workflow run docs.yaml                  # the latest stable tag
#   gh workflow run docs.yaml -f ref=vX.Y.Z    # a given tag
#
# Run it on main (gh's default): the workflow checks out and builds `ref`
# whatever ref it runs on, and by default the github-pages environment admits
# deployments from the default branch only, so a run on a tag is refused at
# the deploy job. See docs/_internal/RELEASING.md § The docs site.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or ref to build and deploy, such as v1.2.3. Leave empty for the latest stable tag.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Held on v5: v6 changes how it stores the git credentials, and release.yaml pushes with them.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # An empty input builds the latest stable tag: the nearest version tag
      # without a prerelease suffix, the same command release.yaml uses for
      # the previous stable tag. The input reaches the script through env only.
      - name: Resolve the ref to build
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            if ! REF=$(git describe --tags --abbrev=0 --exclude '*-*' --match 'v[0-9]*'); then
              echo "::error::No stable tag (vX.Y.Z) is reachable from $GITHUB_REF, so there is nothing to deploy. Pass ref to build another tag or ref."
              exit 1
            fi
            echo "No ref given: building the latest stable tag $REF"
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Building $REF"
          else
            echo "::warning::$REF is not a stable release tag (vX.Y.Z): the site will show docs that no stable release has until the next stable release deploys it again."
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building the docs site from \`$REF\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the ref to build
        # Held on v5: v6 changes how it stores the git credentials, and release.yaml pushes with them.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build documentation
        env:
          # Override site URL from GitHub repo variable if set
          # Otherwise, astro.config.mjs will compute from GITHUB_REPOSITORY
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
